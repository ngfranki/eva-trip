<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>旅程記錄</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅程記錄">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* 色系、字體、間距全部由 Wanderlog 實測抽返嚟（2026-09-14）：
     白底 #FFF、文字 #212529、次要 #6C757D/#ADB5BD、分隔線 #DEE2E6、
     主色珊瑚紅 #F75940、連結藍 #3F52E3、PRO 金 #EC9B3B、側欄 188px 白底 */
  :root{
    --bg:#FFFFFF; --surf:#FFFFFF; --card:#FFFFFF;
    --soft:#F1F3F5; --soft2:#F8F9FA;
    --line:#DEE2E6; --line2:#E9ECEF;
    --ink:#212529; --ink2:#495057; --muted:#6C757D; --muted2:#ADB5BD;
    --acc:#F75940; --acc-d:#E44A32; --acc-soft:#FDEAE6;
    --link:#3F52E3; --link-soft:#EDEFFE;
    --pro:#EC9B3B; --ok:#2F9E68; --warn:#E03131;
    --d1:#4C6EF5; --d2:#12B886; --d3:#40C057; --d4:#FD7E14; --d5:#FA5252; --d6:#7950F2; --d7:#1098AD;
    --sh:0 1px 2px rgba(33,37,41,.06);
    --sh2:0 4px 14px rgba(33,37,41,.10), 0 1px 3px rgba(33,37,41,.08);
    --side:188px; --mapw:40%;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181C; --surf:#1B1E23; --card:#22262C;
      --soft:#262A31; --soft2:#1F2328;
      --line:#343A41; --line2:#2B3037;
      --ink:#E9ECEF; --ink2:#CED4DA; --muted:#9AA2AB; --muted2:#767E87;
      --acc:#FF6B4F; --acc-d:#F75940; --acc-soft:#3A241E;
      --link:#7C8CFF; --link-soft:#232840;
      --sh:0 1px 2px rgba(0,0,0,.4);
      --sh2:0 4px 14px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink);
    overflow-x:hidden; overscroll-behavior-x:none}
  body{font-family:"Source Sans 3","Source Sans Pro","PingFang HK",-apple-system,"Helvetica Neue",sans-serif;
       font-size:16px; line-height:1.45; overflow:hidden; -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer; border:0; background:none; padding:0; color:inherit}
  input,textarea{background:none; border:0; outline:none}
  .num{font-variant-numeric:tabular-nums}
  .ico{display:block; flex:0 0 auto}
  .ico.inline{display:inline-block; vertical-align:-3px}
  .idx.kico{color:#fff}
  .idx.kico .ico{margin:0}
  .kin{display:inline-flex; align-items:center; margin-right:5px; color:var(--muted); vertical-align:-2px}
  .akic{display:flex; align-items:center; color:var(--muted2); flex:0 0 auto}
  .addbar .fi:focus-within .akic{color:var(--acc)}
  .kinds button .ico,.bkrow button .ico{margin:0 auto}
  .sug .sic{display:flex; align-items:center; justify-content:center; color:var(--muted)}
  .klbl{display:inline-flex; align-items:center; gap:6px; color:var(--ink2)}
  .exp .ic{color:var(--muted)}
  .sech .chev,.sgrp h4 .ico{opacity:.55}
  .sgrp h4{gap:5px}
  .brand span{display:flex; align-items:center; color:var(--acc)}
  .aibtn em{display:flex; align-items:center}
  .leg em{display:flex; align-items:center; color:var(--muted2)}
  .prow em{display:flex; align-items:center; justify-content:center; color:var(--muted); padding-top:1px}
  .pmeta .ico.inline{color:var(--muted)}
  .prate .ico,.chip.rate .ico{color:inherit}
  .tbtn .ico{margin:0}
  .btn .ico.inline,.menu button .ico.inline{margin-right:5px; vertical-align:-3px}
  .hide{display:none !important}
  ::-webkit-scrollbar{width:9px; height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px; border:2px solid transparent; background-clip:content-box}

  /* ============ shell ============ */
  .shell{display:grid; grid-template-columns:var(--side) minmax(0,1fr) var(--mapw); height:100dvh}
  .side{background:var(--surf); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; padding-bottom:10px}
  .doc{overflow-y:auto; overflow-x:hidden; background:var(--bg); touch-action:pan-y; overscroll-behavior-x:none}
  .mapwrap{position:relative; height:100%; min-height:0; background:var(--soft)}
  #map{position:absolute; inset:0; z-index:1}

  /* ============ sidebar ============ */
  .brand{display:flex; align-items:center; gap:7px; padding:13px 14px 11px; font-weight:700; font-size:15px; letter-spacing:-.02em}
  .brand em{font-style:normal; font-size:18px}
  .aibtn{display:flex; align-items:center; gap:9px; width:100%; padding:13px 16px; margin:0 0 10px;
         background:linear-gradient(90deg,#F7714A 0%,#EE5A8C 55%,#B455C8 100%); color:#fff; font-weight:700; font-size:15px}
  .aibtn em{font-style:normal; font-size:16px}
  .sgrp{padding:0 8px 4px}
  .sgrp h4{display:flex; align-items:center; gap:6px; margin:6px 0 3px; padding:8px 10px; border-radius:7px;
           background:var(--ink); color:var(--surf); font-size:14.5px; font-weight:700; letter-spacing:-.01em}
  .sgrp h4 i{font-style:normal; font-size:10px; opacity:.75}
  .side nav button{display:block; width:100%; text-align:left; padding:6px 10px; border-radius:6px; font-size:14px;
                   color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .side nav button:hover{background:var(--soft)}
  .side nav button.on{background:var(--soft); font-weight:700}
  .side nav button i{font-style:normal; display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:-1px;
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sfoot{margin-top:auto; padding:10px 16px 0; font-size:11px; color:var(--muted2)}
  .sfoot button{color:var(--muted); font-size:13px; display:block; padding:4px 0}

  /* ============ topbar ============ */
  .top{position:sticky; top:0; z-index:12; background:var(--surf); border-bottom:1px solid var(--line);
       display:flex; align-items:center; gap:6px; padding:9px 16px}
  .top{overflow:hidden}
  .top .sync{font-size:12px; color:var(--muted); margin-right:auto; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; min-width:0}
  .tbtn{flex:0 0 auto}
  .top .sync.err{color:var(--warn)}
  .tbtn{display:flex; align-items:center; gap:5px; padding:6px 13px; border-radius:99px; font-size:14px; font-weight:600; color:var(--ink2)}
  .tbtn:hover{background:var(--soft)}
  .tbtn:disabled{opacity:.3; background:none}
  .tbtn.solid{background:var(--ink); color:var(--surf)}
  .tbtn.solid:hover{background:#000}
  .tbtn.acc{background:var(--acc); color:#fff; font-weight:700}
  .tbtn.acc:hover{background:var(--acc-d)}
  .tbtn.line{border:1px solid var(--line)}
  .mapbtn{display:none}

  /* ============ doc ============ */
  .page{max-width:660px; margin:0 auto; padding:0 20px 150px}
  .hero{position:relative; height:200px; margin:0 -20px;
        background:linear-gradient(160deg,#9DB4CE,#7E9E9A 40%,#C2A87E)}
  .hero.hasph{background-size:cover; background-position:center 42%; background-repeat:no-repeat}
  .hero::after{content:""; position:absolute; inset:0;
        background:linear-gradient(180deg,rgba(0,0,0,.10) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,.30) 100%)}
  .herocard{position:relative; z-index:2; margin:-72px 0 26px; background:var(--card); border-radius:10px; box-shadow:var(--sh2); padding:20px 22px}
  .herocard h1{margin:0; font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1.1}
  .herocard .sub{display:flex; align-items:center; gap:6px; margin-top:9px; font-size:14px; color:var(--muted); font-weight:600}
  .hstats{display:flex; gap:22px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
  .hstats div b{display:block; font-size:20px; font-weight:700; line-height:1.15; letter-spacing:-.02em}
  .hstats div span{font-size:12px; color:var(--muted)}
  .hedit{position:absolute; top:16px; right:0; z-index:3}

  .sec{margin:0 0 30px; scroll-margin-top:62px}
  .sech{display:flex; align-items:center; gap:8px; margin:0 0 12px}
  .sech .chev{color:var(--muted); font-size:11px}
  .sech h2{margin:0; font-size:24px; font-weight:700; letter-spacing:-.03em}
  .sech .n{font-size:13px; color:var(--muted); font-weight:600}
  .sech .sp{flex:1}
  .panel{padding:0}
  .panel.pad{background:var(--soft); border-radius:16px; padding:16px}
  .sech h2{font-size:22px}
  .sech.big h2{font-size:32px}
  .pill{background:var(--line2); color:var(--ink2); border-radius:24px; padding:7px 16px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:6px}
  .pill:hover{background:var(--line)}
  .pill.acc{background:var(--acc); color:#fff; font-weight:700}
  .pill.acc:hover{background:var(--acc-d)}
  .pill.bare{background:none; border-radius:20px; color:var(--muted); font-size:13.5px; padding:6px 12px}
  .pill.bare:hover{background:var(--soft)}

  /* 概覽兩格卡 */
  .twoup{display:flex; gap:16px; margin-bottom:26px; flex-wrap:wrap}
  .bkcard{flex:2 1 330px; background:var(--soft); border-radius:16px; padding:16px}
  .sumcard{flex:1 1 170px; background:var(--soft); border-radius:16px; padding:16px}
  .cardlbl{font-size:16px; font-weight:700; display:block; margin-bottom:8px}
  .bkrow{display:flex; gap:0; flex-wrap:wrap}
  .bkrow button{width:58px; display:flex; flex-direction:column; align-items:center; gap:1px; padding:2px 0}
  .bkrow button b{font-size:13px; font-weight:700; height:16px; color:var(--ink)}
  .bkrow button em{font-style:normal; font-size:17px}
  .bkrow button span{font-size:11.5px; color:var(--muted)}
  .bkrow button:hover em{transform:scale(1.14)}
  .bigno{font-size:24px; font-weight:400; color:var(--muted); letter-spacing:-.02em; line-height:1.2}
  .sumcard a{display:block; margin-top:8px; font-size:13.5px; color:var(--link); font-weight:700; cursor:pointer}

  /* 開支帳 */
  .exptot{background:var(--soft); border-radius:16px; padding:16px 24px; display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap}
  .exptot .amt{font-size:36px; font-weight:400; letter-spacing:-.03em; line-height:1.1; flex:1 1 180px}
  .exptot .amt small{display:block; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:0; margin-top:3px}
  .exphead{display:flex; align-items:baseline; gap:10px; margin:24px 0 8px}
  .exphead h3{margin:0; font-size:22px; font-weight:700; letter-spacing:-.02em}
  .exphead .sp{flex:1}
  .exp{display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line2)}
  .exp:last-child{border-bottom:0}
  .exp .ic{width:30px; height:30px; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:14px; flex:0 0 auto}
  .exp .bd{flex:1; min-width:0}
  .exp .bd b{display:block; font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .exp .bd span{font-size:12.5px; color:var(--muted)}
  .exp .amt{font-weight:700; font-size:14.5px; white-space:nowrap; font-variant-numeric:tabular-nums}
  .exp .amt i{display:block; font-style:normal; font-size:11.5px; color:var(--muted); font-weight:600}
  .empty{color:var(--muted); font-size:14px; padding:16px 2px; line-height:1.75}

  /* ============ item rows ============ */
  .rows{display:flex; flex-direction:column; gap:2px}
  .row{position:relative; display:flex; gap:9px; align-items:flex-start; padding-left:14px}
  .row.drag{opacity:.3}
  .row.over .rcard{box-shadow:inset 0 2px 0 var(--acc)}
  .idx{position:absolute; left:0; top:11px; z-index:3; width:25px; height:25px; border-radius:50%;
       font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
       color:#fff; border:2px solid var(--surf)}
  .grip{position:absolute; left:-14px; top:16px; width:14px; color:transparent; font-size:12px; cursor:grab}
  .row:hover .grip{color:var(--muted2)}
  .rcard{flex:1; min-width:0; background:var(--soft); border-radius:9px; padding:11px 14px 11px 20px; margin-left:11px}
  .row.done .rcard{opacity:.62}
  .rcard .nm{font-size:15px; font-weight:700; letter-spacing:-.01em; word-break:break-word; line-height:1.35}
  .row.done .rcard .nm{text-decoration:line-through; text-decoration-color:var(--muted)}
  .rcard .kin{font-size:12px; color:var(--muted); font-weight:600; margin-right:5px}
  .rcard .ad{font-size:13px; color:var(--muted); margin-top:2px; word-break:break-word}
  .rcard .nt{font-size:14px; color:var(--ink2); margin-top:5px; white-space:pre-wrap; word-break:break-word; line-height:1.5}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
  .chip{font-size:12.5px; font-weight:700; border-radius:5px; padding:3px 8px; background:var(--link-soft); color:var(--link); white-space:nowrap}
  .chip.cost{background:var(--soft2); color:var(--ink2); border:1px solid var(--line)}
  .chip.warn{background:var(--warn); color:#fff}
  .thumb{width:86px; height:64px; flex:0 0 auto; border-radius:8px; overflow:hidden; background:var(--soft); margin-top:2px}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .chip.rate{background:#FFF3E0; color:#C9700A}
  .chip.open{background:#E7F5EC; color:#1F7A45}
  .chip.shut{background:var(--soft2); color:var(--muted); border:1px solid var(--line)}
  @media (prefers-color-scheme: dark){
    .chip.rate{background:#3A2E1A; color:#E8B368}
    .chip.open{background:#1E3326; color:#79C795}
  }
  @media (max-width:560px){ .thumb{width:64px; height:52px} }
  .rt{flex:0 0 auto; display:flex; align-items:center; gap:2px; padding-top:11px}
  .tick{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; color:transparent}
  .row:hover .tick{border-color:var(--muted2); color:var(--muted2)}
  .row.done .tick{background:var(--ok); border-color:var(--ok); color:#fff}
  .kebab{width:26px; height:26px; border-radius:6px; color:var(--muted2); font-size:16px; display:flex; align-items:center; justify-content:center; opacity:0}
  .row:hover .kebab{opacity:1}
  @media (hover:none){ .kebab,.tick{opacity:1} .tick{color:var(--muted2)} }
  .kebab:hover{background:var(--soft)}

  /* 車程段：虛線接駁 + 交通方式 + 時間距離 */
  .leg{position:relative; display:flex; align-items:center; gap:6px; padding:5px 0 5px 39px; font-size:13px; color:var(--muted)}
  .leg::before{content:""; position:absolute; left:12px; top:0; bottom:0; border-left:2px dotted var(--line)}
  .leg em{font-style:normal; font-size:13px}
  .leg a{color:var(--link); font-weight:700; text-decoration:none; margin-left:2px}
  .leg .est{font-size:10.5px; background:var(--soft2); border:1px solid var(--line); color:var(--muted2); border-radius:4px; padding:0 4px; margin-left:2px}

  .checks{margin-top:7px; display:flex; flex-direction:column; gap:4px}
  .checks label{display:flex; gap:8px; font-size:14px; align-items:flex-start; cursor:pointer}
  .checks input{margin:3px 0 0; accent-color:var(--ok)}
  .checks label.on span{text-decoration:line-through; color:var(--muted)}

  /* ============ inline add ============ */
  .add{position:relative; padding:8px 0 2px 25px}
  .addbar{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .addbar .fi{min-width:0}
  .addbar .fi{flex:1; display:flex; align-items:center; gap:8px; background:var(--surf); border:1px solid var(--line);
              border-radius:8px; padding:9px 12px}
  .addbar .fi:focus-within{border-color:var(--acc)}
  .addbar .fi input{flex:1 1 0; min-width:0; width:100%; font-size:14.5px}
  .addbar .fi input::placeholder{color:var(--muted2)}
  .kinds{display:flex; gap:2px}
  .kinds button{width:30px; height:30px; border-radius:7px; font-size:14px; display:flex; align-items:center; justify-content:center; color:var(--muted)}
  .kinds button:hover{background:var(--soft)}
  .kinds button.on{background:var(--acc-soft)}
  .sug{position:absolute; left:25px; right:0; top:100%; z-index:14; background:var(--card); border:1px solid var(--line);
       border-radius:9px; box-shadow:var(--sh2); padding:4px; max-height:290px; overflow-y:auto}
  .sug button{display:flex; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:6px; align-items:flex-start}
  .sug button:hover,.sug button.on{background:var(--soft)}
  .sug .sic{width:24px; flex:0 0 auto; text-align:center; font-size:14px}
  .sug b{display:block; font-size:14px; font-weight:700}
  .sug small{display:block; font-size:12.5px; color:var(--muted); margin-top:1px}
  .sug .hd{font-size:11px; color:var(--muted2); padding:6px 10px 3px; font-weight:700; letter-spacing:.06em; text-transform:uppercase}

  /* ============ day ============ */
  .day{margin-bottom:14px}
  .dayh{display:flex; align-items:baseline; gap:9px; margin:20px 0 9px}
  .dayh .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto; align-self:center}
  .dayh h3{margin:0; font-size:17px; font-weight:700; letter-spacing:-.02em}
  .dayh .dd{font-size:13.5px; color:var(--muted)}
  .dayh .sp{flex:1}
  .dayh .tot{font-size:13px; color:var(--muted); font-weight:600}

  /* ============ budget ============ */
  .bud{display:flex; flex-direction:column; gap:9px}
  .bud .r{display:flex; align-items:center; gap:11px; font-size:14px}
  .bud .r .bar{flex:1; height:6px; border-radius:99px; background:var(--line2); overflow:hidden}
  .bud .r .bar i{display:block; height:100%; border-radius:99px}
  .bud .r b{min-width:84px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
  .bud .r span:first-child{min-width:66px; color:var(--ink2)}
  .budtot{display:flex; justify-content:space-between; align-items:baseline; padding-top:13px; margin-top:5px; border-top:1px solid var(--line)}
  .budtot b{font-size:24px; font-weight:700; letter-spacing:-.02em}

  /* ============ map ============ */
  .leaflet-container{background:var(--soft); font:inherit}
  .pin{width:26px; height:26px; border-radius:50% 50% 50% 3px; transform:rotate(-45deg); display:flex; align-items:center;
       justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.10);
       border:2.5px solid #fff; color:#fff}
  .pin b{transform:rotate(45deg); font-size:11.5px; font-weight:700}
  .pin.big{width:34px; height:34px; z-index:900 !important}
  .pin.big b{font-size:14px}
  .mapbar{position:absolute; top:12px; left:12px; right:12px; z-index:5; display:flex; gap:5px;
    flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
  .mapbar::-webkit-scrollbar{display:none}
  .mapbar button{flex:0 0 auto; background:var(--surf); box-shadow:var(--sh2); border-radius:99px; padding:6px 12px; font-size:13px; font-weight:700; color:var(--ink2)}
  .mapbar button.on{background:var(--ink); color:var(--surf)}
  .leaflet-popup-content{margin:11px 13px; font-size:14px}
  .leaflet-popup-content b{display:block; margin-bottom:3px; font-size:14.5px; font-weight:700}
  .leaflet-popup-content a{color:var(--link); font-size:13px; font-weight:700}

  /* ============ AI panel ============ */
  .ai{position:absolute; inset:0; z-index:20; background:var(--bg); display:none; flex-direction:column}
  .ai.open{display:flex}
  .aihead{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line)}
  .aihead b{font-size:15px; font-weight:700; flex:1}
  .aihead button{font-size:13px; color:var(--muted); border-radius:99px; padding:5px 11px; font-weight:600}
  .aihead button:hover{background:var(--soft)}
  .aimsgs{flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:11px}

  .msg.a{align-self:flex-start; background:var(--soft); border-bottom-left-radius:4px}
  .msg.sys{align-self:center; background:var(--acc-soft); font-size:12.5px; color:var(--ink2); padding:6px 13px; border-radius:99px}
  .msg .did{display:block; margin-top:8px; font-size:12.5px; color:var(--acc); font-weight:700}
  .aiwelcome{color:var(--muted); font-size:14px; text-align:center; padding:26px 14px; line-height:1.8}
  .aichips{display:flex; gap:6px; padding:0 14px 8px; flex-wrap:wrap}
  .aichips button{font-size:13px; background:var(--surf); border:1px solid var(--line); border-radius:99px; padding:6px 12px; color:var(--ink2); font-weight:600}
  .aichips button:hover{border-color:var(--acc); color:var(--acc)}
  .aiin{display:flex; gap:8px; padding:11px 14px calc(13px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); align-items:flex-end}
  .aiin textarea{flex:1; background:var(--soft); border-radius:12px; padding:10px 13px; resize:none; max-height:120px; font-size:14.5px; line-height:1.5}
  .aiin button{width:38px; height:38px; border-radius:50%; background:var(--acc); color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; flex:0 0 auto}
  .aiin button:disabled{opacity:.4}
  .warnb{display:inline-block; font-size:11px; font-weight:700; color:#fff; background:var(--warn); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:1px}

  /* ============ optimize / offline ============ */
  .netbar{display:none; background:var(--warn); color:#fff; font-size:13px; font-weight:700; padding:9px 14px; text-align:center}
  .netbar.show{display:block}
  .optbox{background:var(--soft2); border:1px solid var(--line2); border-radius:10px; padding:15px}
  .optrow{display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; font-size:14px}
  .optrow b{font-size:20px; font-weight:700}
  .optrow.ok b{color:var(--ok)}
  .optsave{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:13.5px; font-weight:700; color:var(--acc)}
  .optseq{background:var(--surf); border:1px solid var(--line); border-radius:9px; padding:9px 13px; max-height:220px; overflow-y:auto}
  .optseq div{display:flex; gap:10px; padding:4px 0; font-size:14px; align-items:baseline}
  .optseq b{width:18px; color:var(--muted); font-size:12px; font-weight:700; flex:0 0 auto}

  /* 地點詳情卡 */
  .pshot{margin:-22px -22px 14px; height:190px; overflow:hidden; border-radius:12px 12px 0 0; background:var(--soft)}
  .pshot img{width:100%; height:100%; object-fit:cover; display:block}
  .phead h3{font-size:23px; font-weight:700; letter-spacing:-.02em; line-height:1.2}
  .pmeta{font-size:13.5px; color:var(--muted); margin-top:5px}
  .pmeta b{font-weight:700}
  .prate{color:#C9700A} .popen{color:var(--ok)} .pshut{color:var(--muted)}
  .prows{margin:16px 0 4px; display:flex; flex-direction:column}
  .prow{display:flex; gap:11px; padding:9px 0; border-top:1px solid var(--line2); font-size:14px; align-items:flex-start}
  .prow:first-child{border-top:0}
  .prow em{font-style:normal; width:18px; flex:0 0 auto; text-align:center}
  .prow span,.prow a{flex:1; word-break:break-word; white-space:pre-wrap}
  .prow a{color:var(--link); text-decoration:none; font-weight:600}
  .prow a[data-act]{font-weight:700; margin-left:6px; cursor:pointer}
  .phours{background:var(--soft); border-radius:10px; padding:11px 14px; margin-top:10px; font-size:13.5px; line-height:1.9}

  /* ============ sheet / modal ============ */
  .sheet{position:fixed; inset:0; z-index:60; display:none}
  .sheet.show{display:block}
  .sheet .bg{position:absolute; inset:0; background:rgba(33,37,41,.45)}
  .sheet .pan{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(450px,calc(100vw - 32px));
              max-height:88vh; overflow-y:auto; background:var(--surf); border-radius:12px; box-shadow:var(--sh2); padding:22px}
  .sheet h3{margin:0 0 16px; font-size:21px; font-weight:700; letter-spacing:-.02em}
  .sheet .close{position:absolute; top:17px; right:20px; font-size:13px; color:var(--muted); border-radius:99px; padding:4px 10px; font-weight:600}
  .sheet .close:hover{background:var(--soft)}
  .fld{margin-bottom:12px}
  .fld label{display:block; font-size:12.5px; color:var(--muted); margin:0 0 5px 1px; font-weight:700}
  .inp{width:100%; background:var(--surf); border:1px solid var(--line); border-radius:8px; padding:10px 12px; outline:none; font-size:14.5px}
  .inp:focus{border-color:var(--acc)}
  textarea.inp{resize:vertical; min-height:80px; line-height:1.55}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .btn{display:block; width:100%; background:var(--ink); color:var(--surf); border-radius:99px; padding:12px; font-size:15px; font-weight:700; text-align:center}
  .btn.ghost{background:var(--surf); color:var(--ink); border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--soft)}
  .btn.acc{background:var(--acc); color:#fff}
  .btn.acc:hover{background:var(--acc-d)}
  .btn.warn{background:var(--warn); color:#fff}
  .btnrow{display:flex; gap:9px; margin-top:11px}
  .btnrow .btn{flex:1}
  .hint{font-size:13px; color:var(--muted); margin-top:9px; line-height:1.65}
  .hint.err{color:var(--warn)}
  .menu{position:fixed; z-index:70; background:var(--card); border:1px solid var(--line); border-radius:9px; box-shadow:var(--sh2); padding:4px; min-width:180px}
  .menu button{display:block; width:100%; text-align:left; padding:8px 11px; border-radius:6px; font-size:14px}
  .menu button:hover{background:var(--soft)}
  .menu button.dz{color:var(--warn)}
  .menu hr{border:0; border-top:1px solid var(--line); margin:4px 6px}
  .spin{display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ============ print ============ */
  @media print{

    html,body{overflow:visible !important; height:auto !important; background:#fff !important; color:#000 !important; font-size:11pt}
    .shell{display:block !important; height:auto !important}
    .doc{overflow:visible !important; height:auto !important; background:#fff !important}
    .page{max-width:none !important; padding:0 !important}
    .herocard{margin:0 0 14px !important; box-shadow:none !important; padding:0 !important}

    .hstats{border-top:1px solid #bbb}

    .page{padding:0 16px 130px}
    .hero{margin:0 -16px; height:160px}
    .herocard{margin-top:-60px}
    .herocard h1{font-size:27px}
    .sech h2{font-size:21px}
    .top{padding:8px 14px}
    .addbar .fi{flex:1 1 100%}
    .kinds{width:100%; justify-content:space-between}
    .kinds button{width:38px; height:34px; font-size:16px}
    .add{padding-left:0}
    .sug{left:0}
    .idx{left:0; top:10px}
    .rcard{margin-left:9px; padding-left:19px}
    .row{padding-left:12px}
  }
  @media (min-width:821px){ .mapclose{display:none} }

<div class="gate" id="gate">
  <div class="box">
    <h2>旅程記錄</h2>
    <p>行程規劃＋旅程日誌。入暗號同步雲端；唔想同步可以淨係喺呢部機用。</p>
    <button class="btn acc hide" id="gateReuse">用返飲食記錄嘅暗號</button>

    <button class="btn ghost" id="gateLocal" style="margin-top:8px">淨係喺呢部機用</button>

  </div>
</div>

<div class="shell">

  <aside class="side" id="side">
    <div class="brand"><span id="brandIc"></span> 旅程記錄<button class="sideclose" data-act="closeside"></button></div>
    <button class="aibtn" data-act="ai"><em id="aiIc"></em> AI 助手</button>
    <div id="toc"></div>
    <div class="sfoot">
      <button data-act="trips">切換旅程</button>
      <button data-act="settings">設定</button>
      <div id="ver" style="padding-top:6px"></div>
    </div>
  </aside>

  <div class="sidebd" id="sidebd" data-act="closeside"></div>

  <main class="doc" id="doc">
    <div class="top">
      <span class="sync" id="sync">載緊…</span>
      <button class="tbtn mapbtn" data-act="menu-side" id="hamb" title="目錄"></button>
      <button class="tbtn" id="bUndo" data-act="undo" title="復原"></button>
      <button class="tbtn" id="bRedo" data-act="redo" title="重做"></button>

      <button class="tbtn solid" data-act="export">匯出</button>

    <div class="netbar" id="netbar">📴 離線中 — 睇得改得，接返網就自動同步</div>
    <div id="main"></div>
  </main>

  <section class="mapwrap" id="mapwrap">
    <div id="map"></div>
    <div class="mapbar" id="mapbar"></div>
    <button class="mapclose" data-act="closemap">收起</button>

    <section class="ai" id="aiPanel">
      <div class="aihead"><b><span id="aiHeadIc"></span> AI 助手</b>
        <button data-act="aiclear">新對話</button>

      <div class="aichips" id="aiChips"></div>

        <button data-act="aisend" id="aiSend">↑</button></div>
    </section>
  </section>

</div>

<div class="sheet" id="sheet"><div class="bg" data-act="closesheet"></div><div class="pan" id="pan"></div></div>

  // ---------- state / migration ----------

  function curTrip(){ var id=state&&state.settings.curTrip; if(!id) return null;

  // 換算去旅程主幣種。匯率係你自己喺旅程設定入面填（唔駁 API，離線都準）。
  function toHome(amt, ccy){
    amt=+amt||0; if(!ccy || ccy===cur()) return amt;
    var r=rates()[ccy]; return r? amt*(+r) : amt;
  }
  function fmtCcy(ccy, n){
    n=+n||0;

  }

    return 2*R*Math.asin(Math.sqrt(s));
  }
  function legTxt(a,b){
    if(!a.lat||!b.lat) return null;

    var mode, kmh;
    if(km<2){ mode=ic('walk',15); kmh=4.5; }
    else if(km<15){ mode=ic('car',15); kmh=26; }
    else { mode=ic('train',15); kmh=65; }
    var mins=Math.max(1,Math.round(km/kmh*60));
    var t = mins>=60 ? Math.floor(mins/60)+' \u5c0f\u6642'+(mins%60? ' '+(mins%60)+' \u5206':'') : mins+' \u5206\u9418';
    return { ic:mode, t:t+' \u00b7 '+(km<10?km.toFixed(1):Math.round(km))+' km' };
  }

  function stripOps(txt){

  function grabOps(txt){
    var m=String(txt).match(/```json\s*([\s\S]*?)```/);
    var raw=m? m[1] : null;
    if(!raw){ var m2=String(txt).match(/\{[^{}]*"ops"[\s\S]*\}/); raw=m2?m2[0]:null; }
    if(!raw) return null;
    try{ var j=JSON.parse(raw.trim()); return Array.isArray(j.ops)?j.ops:null; }catch(e){ return null; }
  }
  function applyOps(ops){
    var t=curTrip(); if(!t||!ops||!ops.length) return 0;
    snap();
    var n=0, fresh=[];
    ops.forEach(function(o){
      try{
        if(!o||!o.op) return;
        if(o.op==='add'){
          var pp=String(o.to||'').split(':'), isDay=pp[0]==='day';
          var date=isDay?pp[1]:null, listId=isDay?null:(pp[1]||(tLists()[0]||{}).id);
          if(isDay && days().indexOf(date)<0) return;
          if(!isDay && !listId) return;
          var nm=String(o.name||'').trim(); if(!nm) return;
          var x={id:uid(),tripId:t.id,kind:KINDS[o.kind]?o.kind:'place',listId:listId,date:date,
                 ord:nextOrd(isDay?dayItems(date):listItems(listId)),time:String(o.time||''),
                 name:nm.slice(0,120),lat:null,lng:null,addr:'',note:String(o.note||'').slice(0,400),
                 cost:+o.cost||0,done:false,checks:[],ai:1};
          state.items.push(x); fresh.push(x.id); n++;
        }
        else if(o.op==='del'){ var b=state.items.length;
          state.items=state.items.filter(function(i){ return i.id!==o.id; }); if(state.items.length<b) n++; }
        else if(o.op==='move'){ var x2=itemById(o.id); if(!x2||x2.tripId!==t.id) return;
          var q=String(o.to||'').split(':');
          if(q[0]==='day'){ if(days().indexOf(q[1])<0) return; x2.date=q[1]; x2.listId=null; }
          else { if(!q[1]) return; x2.date=null; x2.listId=q[1]; }
          x2.ord=nextOrd(x2.date?dayItems(x2.date):listItems(x2.listId)); n++; }
        else if(o.op==='set'){ var x3=itemById(o.id); if(!x3||x3.tripId!==t.id) return;
          if(o.name!=null) x3.name=String(o.name).slice(0,120);
          if(o.time!=null) x3.time=String(o.time).slice(0,5);
          if(o.note!=null) x3.note=String(o.note).slice(0,400);
          if(o.cost!=null) x3.cost=+o.cost||0;
          if(o.kind && KINDS[o.kind]) x3.kind=o.kind;
          if(o.done!=null) x3.done=!!o.done;
          n++; }
        else if(o.op==='newlist'){ var ln=String(o.name||'').trim(); if(!ln) return;
          state.lists.push({id:uid(),tripId:t.id,name:ln.slice(0,40),ord:tLists().length+1}); n++; }
      }catch(e){}
    });
    if(n) save();
    fresh.forEach(function(i){ geoQ.push(i); }); if(fresh.length) pumpGeo();
    return n;
  }

  // ---------- 路線最優化（nearest-neighbour → 2-opt）----------
  function P(x){ return [x.lat,x.lng]; }
  function pathKm(seq){ var t=0; for(var i=1;i<seq.length;i++) t+=hav(P(seq[i-1]),P(seq[i])); return t; }
  function optimizeSeq(pts, fixStart){
    if(pts.length<3) return pts.slice();
    var rest=pts.slice(), order=[];
    order.push(fixStart? rest.shift() : rest.shift());
    var cur=order[0];
    while(rest.length){
      var bi=0,bd=Infinity;
      for(var i=0;i<rest.length;i++){ var d=hav(P(cur),P(rest[i])); if(d<bd){ bd=d; bi=i; } }
      cur=rest.splice(bi,1)[0]; order.push(cur);
    }
    var lo = fixStart?1:0, guard=0, improved=true;
    while(improved && guard<120){
      improved=false; guard++;
      for(var a=lo; a<order.length-1; a++){
        for(var b=a+1; b<order.length; b++){
          var prev=order[a-1], A=order[a], B=order[b], nxt=order[b+1];
          if(!prev) continue;
          var before=hav(P(prev),P(A)) + (nxt? hav(P(B),P(nxt)) : 0);
          var after =hav(P(prev),P(B)) + (nxt? hav(P(A),P(nxt)) : 0);
          if(after < before - 1e-9){
            var seg=order.slice(a,b+1).reverse();
            Array.prototype.splice.apply(order,[a,b+1-a].concat(seg));
            improved=true;
          }
        }
      }
    }
    return order;
  }
  function optimizeDay(d){
    var all=dayItems(d);
    var geo=all.filter(function(x){ return x.lat&&x.lng; });
    if(geo.length<3) return null;
    var seq=optimizeSeq(geo,true);
    var before=pathKm(geo), after=pathKm(seq);
    var same=seq.every(function(x,i){ return x.id===geo[i].id; });
    return {d:d, all:all, geo:geo, seq:seq, before:before, after:after, same:same};
  }
  function optimizeSheet(d){
    var r=optimizeDay(d);
    if(!r){ alert('呢日要至少 3 個有座標嘅地點先排到'); return; }
    if(r.same){ openSheet('<h3>'+ic('route',19,'inline')+' 路線最優化</h3><div class="empty">而家嘅次序已經係最順<br>行程總長 '+r.before.toFixed(1)+' km，唔使改。</div>'); return; }
    var saved=r.before-r.after, pct=Math.round(saved/r.before*100);
    openSheet('<h3>'+ic('route',19,'inline')+' 路線最優化 · '+longD(d)+'</h3>'+
      '<div class="optbox"><div class="optrow"><span>而家</span><b class="num">'+r.before.toFixed(1)+' km</b></div>'+
      '<div class="optrow ok"><span>重排之後</span><b class="num">'+r.after.toFixed(1)+' km</b></div>'+
      '<div class="optsave">慳 '+saved.toFixed(1)+' km（'+pct+'%）</div></div>'+
      '<div class="fld" style="margin-top:14px"><label>新次序</label><div class="optseq">'+

      '<div class="btnrow"><button class="btn ghost" data-act="closesheet">唔要</button>'+
      '<button class="btn acc" data-act="applyopt" data-d="'+d+'">套用</button></div>');
  }
  function applyOpt(d){
    var r=optimizeDay(d); if(!r||r.same) return;
    snap();
    // 只換有座標嗰啲項目所佔嘅位，冇座標嘅（航班／筆記）原地不動
    var slots=[]; r.all.forEach(function(x,i){ if(x.lat&&x.lng) slots.push(i); });
    var out=r.all.slice();
    slots.forEach(function(pos,k){ out[pos]=r.seq[k]; });
    out.forEach(function(x,i){ x.ord=(i+1)*10; });
    save(); closeSheet(); setSync('ok','路線重排咗，慳 '+(r.before-r.after).toFixed(1)+' km');
  }

  // ---------- 真路線（Google Routes，逐日 cache，簽名冇變就唔會再 call）----------
  function routeSig(pts){ return pts.map(function(p){ return p.lat.toFixed(4)+','+p.lng.toFixed(4); }).join('|'); }
  function dayRoute(d){
    if(!state.routes) state.routes={};
    var t=curTrip(); if(!t) return null;
    return state.routes[t.id+'|'+d]||null;
  }
  function ensureRoute(d){
    if(GOOG===false || MODE!=='cloud') return;
    var t=curTrip(); if(!t) return;
    var pts=dayItems(d).filter(function(x){ return kd(x.kind).geo && x.lat&&x.lng; }).map(function(x){ return {lat:x.lat,lng:x.lng}; });
    if(pts.length<2) return;
    var sig=routeSig(pts), k=t.id+'|'+d;
    if(!state.routes) state.routes={};
    var cur2=state.routes[k];
    if(cur2 && cur2.sig===sig) return;
    if(routeBusy[k]) return;
    routeBusy[k]=1;
    gCall({op:'route',points:pts,mode:'DRIVE'},function(j,err){
      delete routeBusy[k];
      if(err||!j||!j.legs){ return; }
      state.routes[k]={sig:sig, legs:j.legs, mode:j.mode, at:Date.now()};
      save(true); render();
    });
  }
  var routeBusy={};
  function legReal(d, i){
    var r=dayRoute(d); if(!r||!r.legs||!r.legs[i]) return null;
    var l=r.legs[i], mins=Math.max(1,Math.round(l.sec/60)), km=l.m/1000;
    var t2 = mins>=60 ? Math.floor(mins/60)+' 小時'+(mins%60?' '+(mins%60)+' 分':'') : mins+' 分鐘';
    return { ic:ic('car',15), t:t2+' · '+(km<10?km.toFixed(1):Math.round(km))+' km', real:1 };
  }

    var k=kd(x.kind);

  // ---------- Google Maps 底圖（要 browser key，存喺暗號閘後面嘅 row）----------
  var gmap=null, gmarks=[], gInfo=null, gState='off';  // off | loading | on | fail
  function mapKey(){ return (state && state.settings && state.settings.gmapKey) || ''; }
  function loadGMaps(cb){
    if(window.google && window.google.maps){ gState='on'; cb(); return; }
    if(gState==='loading') return;
    var k=mapKey(); if(!k){ gState='off'; return; }
    gState='loading';
    window.__gmapsReady=function(){ gState='on'; cb(); };
    var sc=document.createElement('script');
    sc.async=true;
    sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(k)+
           '&language=zh-HK&region=HK&loading=async&callback=__gmapsReady';
    sc.onerror=function(){ gState='fail'; setSync('err','Google 地圖載入失敗，用返 OSM'); drawMap(); };
    document.head.appendChild(sc);
  }
  function pinIcon(label,color,big){
    var w=big?34:27, h=big?44:35;
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 28 36">'+
      '<path d="M14 0C6.3 0 0 6.3 0 14c0 9.9 14 22 14 22s14-12.1 14-22C28 6.3 21.7 0 14 0z" fill="'+color+'" stroke="#fff" stroke-width="2.2"/>'+
      '<text x="14" y="19.5" font-size="'+(String(label).length>1?11:13)+'" font-weight="700" fill="#fff" '+
      'text-anchor="middle" font-family="-apple-system,PingFang HK,sans-serif">'+String(label)+'</text></svg>';
    return { url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),
             scaledSize:new google.maps.Size(w,h), anchor:new google.maps.Point(w/2,h) };
  }
  // 手機開合地圖／視窗變化之後通知兩個地圖庫重新量尺寸
  var gKickT=null;
  function sizeMap(){
    var wrap=$('mapwrap');
    if(!wrap) return false;
    var r=wrap.getBoundingClientRect();
    return !(r.width<60 || r.height<60);
  }
  function gKick(){
    if(gKickT) clearTimeout(gKickT);
    var go=function(){
      if(gmap && window.google){ try{ google.maps.event.trigger(gmap,'resize'); }catch(e){} }
      if(map && map.invalidateSize){ try{ map.invalidateSize(); }catch(e){} }
    };
    requestAnimationFrame(go);
    gKickT=setTimeout(go, 300);
  }
  // 由 bounds 算出啱嘅 zoom（Mercator），代替 fitBounds
  function fitZoom(b){
    var el=$('map'); if(!el) return 12;
    var W=Math.max(200, el.clientWidth-88), H=Math.max(200, el.clientHeight-108);
    var ne=b.getNorthEast(), sw=b.getSouthWest();
    var latRad=function(la){ var sn=Math.sin(la*Math.PI/180); return Math.log((1+sn)/(1-sn))/2; };
    var latFrac=Math.abs(latRad(ne.lat())-latRad(sw.lat()))/(2*Math.PI);
    var lngDiff=ne.lng()-sw.lng(); if(lngDiff<0) lngDiff+=360;
    var lngFrac=lngDiff/360;
    var z=19;
    if(latFrac>1e-9) z=Math.min(z, Math.floor(Math.log(H/256/latFrac)/Math.LN2));
    if(lngFrac>1e-9) z=Math.min(z, Math.floor(Math.log(W/256/lngFrac)/Math.LN2));
    return Math.max(2, Math.min(17, z));
  }
  function drawGMap(pts){
    var el=$('map');
    if(!gmap){
      if(!sizeMap()){                      // 容器仲未有尺寸，下一格再嚟
        if(!drawGMap.__wait){ drawGMap.__wait=1;
          requestAnimationFrame(function(){ drawGMap.__wait=0; drawMap(); }); }
        return;
      }
      el.innerHTML='';
      gmap=new google.maps.Map(el,{
        center:{lat:22.3193,lng:114.1694}, zoom:11,
        mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
        clickableIcons:false, zoomControl:true,
        gestureHandling:'greedy'
      });
      gInfo=new google.maps.InfoWindow();
      // 建立嗰刻容器尺寸未必 settle（三欄 grid 嘅 40% 欄）。Google 量到 0 就再也唔會重畫，
      // 所以一定要主動踢佢 resize，並且用 ResizeObserver 盯住之後任何尺寸變化。
      gKick();
      try{
        var wrap=$('mapwrap');
        if(window.ResizeObserver && wrap && !wrap.__ro){
          wrap.__ro=new ResizeObserver(function(){ sizeMap(); });
          wrap.__ro.observe(wrap);
        }
      }catch(e){}
    }
    gmarks.forEach(function(m){ m.setMap(null); }); gmarks=[];
    if(!pts.length) return;
    var bounds=new google.maps.LatLngBounds(), lines={};
    pts.forEach(function(p){
      var big=hlId===p.x.id;
      var m=new google.maps.Marker({
        position:{lat:p.x.lat,lng:p.x.lng}, map:gmap,
        icon:pinIcon(p.n||'·', p.c, big), title:p.x.name, zIndex:big?999:1
      });
      m.addListener('click',function(){
        hlId=p.x.id;
        gInfo.setContent('<div style="font:14px -apple-system,PingFang HK,sans-serif;min-width:150px">'+
          '<b style="display:block;margin-bottom:3px">'+esc(p.x.name)+'</b>'+
          (p.x.rating?'<span style="color:#C9700A;font-weight:700">'+ic('star',12,'inline')+' '+(+p.x.rating).toFixed(1)+'</span> ':'')+
          (p.x.addr?'<span style="color:#6C757D;font-size:12.5px">'+esc(p.x.addr)+'</span>':'')+
          '<a href="https://www.google.com/maps/dir/?api=1&destination='+p.x.lat+','+p.x.lng+
          '" target="_blank" rel="noopener" style="display:block;margin-top:6px;color:#3F52E3;font-weight:700;font-size:12.5px">導航 →</a></div>');
        gInfo.open({anchor:m, map:gmap});
        render(); scrollTo(p.x.id);
      });
      gmarks.push(m); bounds.extend(m.getPosition());
      if(p.d){ (lines[p.d]=lines[p.d]||{c:p.c,a:[]}).a.push({lat:p.x.lat,lng:p.x.lng}); }
    });
    Object.keys(lines).forEach(function(d){
      if(lines[d].a.length<2) return;
      var pl=new google.maps.Polyline({ path:lines[d].a, map:gmap, strokeColor:lines[d].c,
        strokeOpacity:0, zIndex:0,
        icons:[{ icon:{path:'M 0,-1 0,1', strokeOpacity:.9, strokeWeight:3, scale:2}, offset:'0', repeat:'12px' }] });
      gmarks.push(pl);
    });
    if(!gmap.__fit || mapDay!==gmap.__lastDay){
      // 唔用 fitBounds：實測 Maps 3.66 喺初始 fitBounds 之後唔會畫磚（成塊白），
      // 但任何之後嘅 setCenter/setZoom（例如撳個地點 flyTo）就即刻正常。
      // 所以自己由 bounds 算 center + zoom，直接 setCenter/setZoom。
      // 實測：setCenter（瞬間）之後唔會畫磚；但 panTo（有動畫）之後就會。
      // 所以先擺去一個偏移位置，再 panTo 去真正中心，保證有一次真實鏡頭移動。
      var bc=bounds.getCenter();
      var z=(pts.length===1 ? 15 : fitZoom(bounds));
      gmap.setZoom(z);
      gmap.setCenter({lat:bc.lat()+0.35, lng:bc.lng()+0.35});
      gmap.__fit=1; gmap.__lastDay=mapDay;
      setTimeout(function(){ try{ gmap.panTo(bc); }catch(e){} }, 90);
    }
  }

  // ---------- map ----------

      dayItems(d).forEach(function(x){ if(kd(x.kind).geo && x.lat){ n++; out.push({x:x, n:n, c:dayColor(i), d:d, di:i}); } });
    });

  function mapBar(){

  }
  function drawMap(){
    // 有 browser key 就行 Google，否則 Leaflet + OSM
    if(mapKey() && gState!=='fail'){
      if(gState!=='on'){ loadGMaps(function(){ drawMap(); }); 
        if(gState==='loading'){ mapBar(); return; } }
      if(gState==='on'){
        if(map){ try{ map.remove(); }catch(e){} map=null; markers=[]; }
        mapBar(); drawGMap(mapPoints()); return;
      }
    }
    if(!window.L) return;
    sizeMap();
    if(!map){
      map=L.map('map',{zoomControl:true});
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
      map.setView([22.3193,114.1694],10);
    }
    markers.forEach(function(m){ map.removeLayer(m); }); markers=[];
    mapBar();
    var pts=mapPoints();
    if(!pts.length){ return; }
    var lines={}, ll=[];
    pts.forEach(function(p){
      var big = hlId===p.x.id;
      var m=L.marker([p.x.lat,p.x.lng],{icon:L.divIcon({className:'',
        html:'<div class="pin'+(big?' big':'')+'" style="background:'+p.c+'"><b>'+(p.n||'·')+'</b></div>',
        iconSize:[25,25], iconAnchor:[12,25]}), zIndexOffset: big?1000:0});
      m.on('click',function(){ hlId=p.x.id; render(); scrollTo(p.x.id); });
      m.bindTooltip(p.x.name,{direction:'top',offset:[0,-22]});
      m.addTo(map); markers.push(m); ll.push([p.x.lat,p.x.lng]);
      if(p.d){ (lines[p.d]=lines[p.d]||{c:p.c,a:[]}).a.push([p.x.lat,p.x.lng]); }
    });
    Object.keys(lines).forEach(function(d){
      if(lines[d].a.length>1){ var pl=L.polyline(lines[d].a,{color:lines[d].c,weight:3,opacity:.8,dashArray:'5 6'}).addTo(map); markers.push(pl); }
    });
    if(!map.__fit || mapDay!==map.__lastDay){ map.fitBounds(L.latLngBounds(ll).pad(.25)); if(ll.length===1) map.setZoom(14); map.__fit=1; map.__lastDay=mapDay; }
    setTimeout(function(){ map.invalidateSize(); },60);
  }
  function flyTo(x){
    if(!x.lat) return;
    if(gState==='on' && gmap){ gmap.panTo({lat:x.lat,lng:x.lng}); if(gmap.getZoom()<15) gmap.setZoom(15); return; }
    if(map) map.flyTo([x.lat,x.lng], Math.max(map.getZoom(),15), {duration:.6});
  }

  // ---------- geocode ----------
  function destToken(){
    var t=curTrip(); if(!t||!t.dest) return '';
    return String(t.dest).split(/[・、,，\/／|｜]/)[0].trim().split(/\s*\(/)[0].trim();
  }
  // 順序試：名＋目的地第一個地名 → 淨個名。目的地寫「東京・北海道」呢類唔會再搞死查詢。
  function nomTry(name, cb){
    var d=destToken(), tries=[];
    if(d) tries.push(name+' '+d);
    tries.push(name);
    (function go(i){
      if(i>=tries.length){ cb([]); return; }
      nom(tries[i], function(a){
        if(a===null){ cb(null); return; }
        if(a.length){ cb(a); return; }
        if(i+1<tries.length) setTimeout(function(){ go(i+1); },1100); else cb([]);
      });
    })(0);
  }
  // ---------- Google（經 edge function 代理，key 唔喺前端）----------
  var GOOG=null;           // null=未知 true=有 false=冇
  var photoMem={};         // photoName → url（今次 session 用）
  function gCall(body,cb){
    if(MODE!=='cloud' || GOOG===false){ cb(null,'no-google'); return; }
    fetch(AI_URL,{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+SBK,'x-client-info':KEY,'Content-Type':'application/json'},
      body:JSON.stringify(body)})
      .then(function(r){
        if(r.status===501){ GOOG=false; throw new Error('no-google-key'); }
        if(!r.ok) throw new Error('HTTP '+r.status);
        GOOG=true; return r.json();
      })
      .then(function(j){ cb(j,null); })
      .catch(function(e){ cb(null,e.message||'err'); });
  }
  function tripCentre(){
    var a=tItems().filter(function(x){ return x.lat&&x.lng; });
    if(!a.length) return null;
    return {lat:a.reduce(function(t,x){return t+x.lat;},0)/a.length, lng:a.reduce(function(t,x){return t+x.lng;},0)/a.length};

  // 攞相：先睇 state 有冇存過 URL，再睇今 session memo，最後才問 Google
  function photoUrl(x, cb){
    if(x.photoUrl){ cb(x.photoUrl); return; }
    if(!x.photoName){ cb(null); return; }
    if(photoMem[x.photoName]){ cb(photoMem[x.photoName]); return; }

  // Google types → 我哋嘅 kind
  function kindFromTypes(ts){
    ts=ts||[];
    var has=function(a){ return ts.some(function(t){ return a.indexOf(t)>=0; }); };
    if(has(['lodging','hotel','motel','guest_house','resort_hotel'])) return 'stay';
    if(has(['restaurant','cafe','bakery','bar','food','meal_takeaway','ramen_restaurant','japanese_restaurant'])) return 'eat';
    if(has(['airport','train_station','subway_station','bus_station','transit_station','car_rental'])) return 'car';
    if(has(['shopping_mall','store','department_store','supermarket','clothing_store'])) return 'buy';
    return 'place';

  function nom(q,cb){
    fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&addressdetails=1&accept-language=zh-HK,zh,en&q='+encodeURIComponent(q))
      .then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(a){ cb(a||[]); }).catch(function(){ cb(null); });
  }
  function pumpGeo(){

      else if(a && !a.length && x.ai){ x.unverified=1; save(true); }

      closeSheet();

        if(i>=todo.length){ setSync('ok','\u88dc\u5b8c '+todo.length+' \u500b'); render(); return; }
