<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>旅程記錄</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅程記錄">
<meta name="theme-color" content="#FAF6EB">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#F2ECDD; --surf:#FAF6EB; --card:#FFFFFF; --ink:#2F2E17; --ink2:#5C5A3E;
    --muted:#8A876A; --line:#E7E0CD; --soft:#F4EFE2; --gold:#CEB991; --gold-soft:#F1E9D6;
    --acc:#C4693F; --acc-soft:#F8E4D9; --warn:#B33F2B; --ok:#6E8F62;
    --d1:#8FAF86; --d2:#D98E6B; --d3:#9DAEBE; --d4:#C0A15E; --d5:#B99BC4; --d6:#7FA9A4; --d7:#C98A9B;
    --sh:0 1px 2px rgba(47,46,23,.05), 0 6px 18px rgba(47,46,23,.06);
    --sh2:0 2px 6px rgba(47,46,23,.10), 0 16px 40px rgba(47,46,23,.12);
    --side:212px; --mapw:40%;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15140E; --surf:#1C1B14; --card:#25241B; --ink:#EFEADA; --ink2:#C9C4AE;
      --muted:#9A9680; --line:#37352A; --soft:#2C2A20; --gold:#CEB991; --gold-soft:#3A3526;
      --acc:#E0855A; --acc-soft:#3A281F; --warn:#D4735B; --ok:#8FB183;
      --sh:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
      --sh2:0 2px 6px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink)}
  body{font-family:-apple-system,"PingFang HK","Helvetica Neue",sans-serif; font-size:15px; line-height:1.5; overflow:hidden}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer; border:0; background:none; padding:0; color:inherit}
  input,textarea{background:none; border:0; outline:none}
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .hide{display:none !important}
  ::-webkit-scrollbar{width:10px; height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px; border:3px solid transparent; background-clip:content-box}

  /* ============ shell ============ */
  .shell{display:grid; grid-template-columns:var(--side) minmax(0,1fr) var(--mapw); height:100dvh}
  .side{background:var(--ink); color:var(--surf); display:flex; flex-direction:column; overflow-y:auto; padding-bottom:12px}
  .doc{overflow-y:auto; background:var(--bg); scroll-behavior:smooth}
  .mapwrap{position:relative; background:var(--soft)}
  #map{position:absolute; inset:0; z-index:1}

  /* ============ sidebar ============ */
  .brand{display:flex; align-items:center; gap:8px; padding:14px 14px 10px; font-weight:800; font-size:15px; letter-spacing:-.01em}
  .brand em{font-style:normal; font-size:17px}
  .aibtn{margin:2px 10px 12px; padding:11px 12px; border-radius:14px; background:linear-gradient(100deg,var(--acc),#9C6BA8); color:#fff; font-weight:800; font-size:14px; display:flex; align-items:center; gap:8px; box-shadow:0 3px 12px rgba(0,0,0,.25)}
  .aibtn small{margin-left:auto; opacity:.75; font-weight:600; font-size:11px}
  .sgrp{padding:8px 10px 2px}
  .sgrp h4{margin:0 0 4px; padding:0 8px; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.42)}
  .side nav button{display:block; width:100%; text-align:left; padding:7px 10px; border-radius:9px; font-size:13.5px; color:rgba(255,255,255,.8); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .side nav button:hover{background:rgba(255,255,255,.07)}
  .side nav button.on{background:rgba(255,255,255,.13); color:#fff; font-weight:700}
  .side nav button i{font-style:normal; display:block; font-size:11px; color:rgba(255,255,255,.4); font-weight:500; margin-top:1px}
  .sfoot{margin-top:auto; padding:10px 16px 0; font-size:11px; color:rgba(255,255,255,.35)}
  .sfoot button{color:rgba(255,255,255,.55); font-size:12px; display:block; padding:3px 0}

  /* ============ topbar ============ */
  .top{position:sticky; top:0; z-index:12; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:6px; padding:9px 18px}
  .top .sync{font-size:12px; color:var(--muted); margin-right:auto; white-space:nowrap}
  .top .sync.err{color:var(--warn)}
  .tbtn{display:flex; align-items:center; gap:5px; padding:6px 11px; border-radius:10px; font-size:13px; font-weight:700; color:var(--ink2); background:var(--card); box-shadow:var(--sh)}
  .tbtn:disabled{opacity:.35; box-shadow:none; background:transparent}
  .tbtn.solid{background:var(--ink); color:var(--surf)}
  .tbtn.acc{background:var(--acc); color:#fff}
  .mapbtn{display:none}

  /* ============ doc ============ */
  .page{max-width:720px; margin:0 auto; padding:0 18px 140px}
  .hero{position:relative; height:180px; margin:0 -18px 0; background:linear-gradient(135deg,#B9A87C,#8FA98A 45%,#7E93A8); overflow:hidden}
  .hero::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.28))}
  .herocard{position:relative; z-index:2; margin:-58px 0 22px; background:var(--card); border-radius:20px; box-shadow:var(--sh2); padding:18px 20px}
  .herocard h1{margin:0; font-size:27px; font-weight:800; letter-spacing:-.02em; line-height:1.15}
  .herocard .sub{margin-top:5px; font-size:13px; color:var(--muted)}
  .hstats{display:flex; gap:20px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
  .hstats div b{display:block; font-size:18px; font-weight:800; line-height:1.2}
  .hstats div span{font-size:11px; color:var(--muted)}
  .hedit{position:absolute; top:14px; right:0; z-index:3}

  .sec{margin:0 0 26px; scroll-margin-top:64px}
  .sech{display:flex; align-items:center; gap:10px; margin:0 0 10px}
  .sech h2{margin:0; font-size:19px; font-weight:800; letter-spacing:-.015em}
  .sech .n{font-size:12px; color:var(--muted); font-weight:600}
  .sech .sp{flex:1}
  .sech .mini{font-size:12px; color:var(--muted); background:var(--soft); border-radius:99px; padding:4px 10px; font-weight:700}
  .panel{background:var(--card); border-radius:16px; box-shadow:var(--sh); padding:6px 14px}
  .panel.pad{padding:14px}
  .empty{color:var(--muted); font-size:13px; padding:16px 4px; text-align:center; line-height:1.8}

  /* ============ item rows ============ */
  .rows{display:flex; flex-direction:column}
  .row{display:flex; gap:11px; padding:10px 0; border-top:1px solid var(--line); align-items:flex-start; position:relative}
  .row:first-child{border-top:0}
  .row.drag{opacity:.35}
  .row.over{box-shadow:inset 0 2px 0 var(--acc)}
  .row.hl{background:var(--acc-soft); border-radius:10px; margin:0 -8px; padding-left:8px; padding-right:8px}
  .grip{width:14px; flex:0 0 auto; align-self:center; color:var(--line); font-size:13px; cursor:grab; line-height:1}
  .row:hover .grip{color:var(--muted)}
  .ic{width:30px; height:30px; flex:0 0 auto; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; background:var(--soft); margin-top:1px}
  .idx{position:absolute; left:-26px; top:12px; width:20px; height:20px; border-radius:50%; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; color:#fff}
  .bd{flex:1; min-width:0}
  .bd .t{font-size:14.5px; font-weight:700; word-break:break-word; line-height:1.35}
  .bd .m{font-size:12px; color:var(--muted); margin-top:1px; word-break:break-word}
  .bd .nt{font-size:13px; color:var(--ink2); margin-top:4px; white-space:pre-wrap; word-break:break-word}
  .rt{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding-top:3px}
  .tm{font-size:12.5px; font-weight:700; color:var(--ink2); white-space:nowrap}
  .cost{font-size:12.5px; font-weight:800; white-space:nowrap}
  .tick{width:22px; height:22px; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--muted)}
  .row.done .tick{background:var(--ok); color:#fff}
  .row.done .bd .t{text-decoration:line-through; text-decoration-color:var(--muted); opacity:.6}
  .kebab{width:24px; height:24px; border-radius:7px; color:var(--muted); font-size:15px; display:flex; align-items:center; justify-content:center; opacity:0}
  .row:hover .kebab{opacity:1}
  @media (hover:none){ .kebab{opacity:1} }
  .kebab:hover{background:var(--soft)}
  .leg{display:flex; align-items:center; gap:6px; padding:2px 0 2px 55px; font-size:11.5px; color:var(--muted)}
  .leg span{width:1px; height:13px; background:var(--line); margin-left:-40px; margin-right:34px}
  .checks{margin-top:5px; display:flex; flex-direction:column; gap:3px}
  .checks label{display:flex; gap:7px; font-size:13px; align-items:flex-start; cursor:pointer}
  .checks input{margin:3px 0 0; accent-color:var(--ok)}
  .checks label.on span{text-decoration:line-through; color:var(--muted)}

  /* ============ inline add ============ */
  .add{position:relative; padding:8px 0 9px; border-top:1px solid var(--line)}
  .addbar{display:flex; align-items:center; gap:8px}
  .addbar .fi{flex:1; display:flex; align-items:center; gap:8px; background:var(--soft); border-radius:11px; padding:9px 12px}
  .addbar .fi input{flex:1; font-size:14px}
  .addbar .fi input::placeholder{color:var(--muted)}
  .kinds{display:flex; gap:3px}
  .kinds button{width:31px; height:31px; border-radius:9px; font-size:14px; display:flex; align-items:center; justify-content:center; background:var(--soft); color:var(--muted)}
  .kinds button:hover{background:var(--gold-soft)}
  .kinds button.on{background:var(--ink); color:var(--surf)}
  .sug{position:absolute; left:0; right:0; top:100%; z-index:14; background:var(--card); border-radius:13px; box-shadow:var(--sh2); padding:5px; max-height:288px; overflow-y:auto}
  .sug button{display:flex; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:9px; align-items:flex-start}
  .sug button:hover,.sug button.on{background:var(--soft)}
  .sug .sic{width:26px; height:26px; border-radius:8px; background:var(--gold-soft); display:flex; align-items:center; justify-content:center; font-size:13px; flex:0 0 auto}
  .sug b{display:block; font-size:13.5px; font-weight:700}
  .sug small{display:block; font-size:11.5px; color:var(--muted); margin-top:1px}
  .sug .hd{font-size:11px; color:var(--muted); padding:6px 10px 3px; font-weight:800; letter-spacing:.05em}

  /* ============ day ============ */
  .day{margin-bottom:8px}
  .dayh{display:flex; align-items:baseline; gap:9px; margin:22px 0 8px; position:relative}
  .dayh .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto; align-self:center}
  .dayh h3{margin:0; font-size:16px; font-weight:800; letter-spacing:-.01em}
  .dayh .dd{font-size:12px; color:var(--muted)}
  .dayh .sp{flex:1}
  .dayh .tot{font-size:12px; color:var(--muted); font-weight:700}

  .jr{background:var(--gold-soft); border-radius:13px; padding:12px 14px; margin:8px 0 0; font-size:13.5px; line-height:1.65; white-space:pre-wrap; cursor:pointer}
  .jr .mo{font-size:16px; margin-right:6px}

  /* ============ budget ============ */
  .bud{display:flex; flex-direction:column; gap:8px}
  .bud .r{display:flex; align-items:center; gap:10px; font-size:13.5px}
  .bud .r .bar{flex:1; height:7px; border-radius:99px; background:var(--soft); overflow:hidden}
  .bud .r .bar i{display:block; height:100%; border-radius:99px}
  .bud .r b{min-width:82px; text-align:right; font-weight:800; font-variant-numeric:tabular-nums}
  .bud .r span:first-child{min-width:62px}
  .budtot{display:flex; justify-content:space-between; align-items:baseline; padding-top:11px; margin-top:4px; border-top:1px solid var(--line)}
  .budtot b{font-size:22px; font-weight:800}

  /* ============ map ============ */
  .leaflet-container{background:var(--soft); font:inherit}
  .pin{width:25px; height:25px; border-radius:50% 50% 50% 3px; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,.35); border:2px solid #fff; color:#fff}
  .pin b{transform:rotate(45deg); font-size:11px; font-weight:800}
  .pin.big{width:33px; height:33px; z-index:900 !important}
  .pin.big b{font-size:14px}
  .mapbar{position:absolute; top:10px; left:10px; right:10px; z-index:5; display:flex; gap:5px; flex-wrap:wrap}
  .mapbar button{background:var(--card); box-shadow:var(--sh); border-radius:99px; padding:5px 11px; font-size:12px; font-weight:700; color:var(--ink2)}
  .mapbar button.on{background:var(--ink); color:var(--surf)}
  .leaflet-popup-content{margin:10px 12px; font-size:13.5px}
  .leaflet-popup-content b{display:block; margin-bottom:3px; font-size:14px}
  .leaflet-popup-content a{color:var(--acc); font-size:12.5px; font-weight:700}

  /* ============ AI panel ============ */
  .ai{position:absolute; inset:0; z-index:20; background:var(--surf); display:none; flex-direction:column}
  .ai.open{display:flex}
  .aihead{display:flex; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid var(--line); background:var(--card)}
  .aihead b{font-size:15px; font-weight:800; flex:1}
  .aihead button{font-size:12px; color:var(--muted); background:var(--soft); border-radius:99px; padding:5px 10px; font-weight:700}
  .aimsgs{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px}
  .msg{max-width:88%; padding:10px 13px; border-radius:15px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word}
  .msg.u{align-self:flex-end; background:var(--ink); color:var(--surf); border-bottom-right-radius:5px}
  .msg.a{align-self:flex-start; background:var(--card); box-shadow:var(--sh); border-bottom-left-radius:5px}
  .msg.sys{align-self:center; background:var(--gold-soft); font-size:12px; color:var(--ink2); padding:6px 12px; border-radius:99px}
  .msg .did{display:block; margin-top:7px; font-size:12px; color:var(--acc); font-weight:800}
  .aiwelcome{color:var(--muted); font-size:13px; text-align:center; padding:22px 12px; line-height:1.8}
  .aichips{display:flex; gap:6px; padding:0 14px 8px; flex-wrap:wrap}
  .aichips button{font-size:12px; background:var(--card); box-shadow:var(--sh); border-radius:99px; padding:6px 11px; color:var(--ink2); font-weight:700}
  .aiin{display:flex; gap:8px; padding:10px 14px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--card); align-items:flex-end}
  .aiin textarea{flex:1; background:var(--soft); border-radius:13px; padding:10px 12px; resize:none; max-height:120px; font-size:14px; line-height:1.5}
  .aiin button{width:38px; height:38px; border-radius:50%; background:var(--acc); color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; flex:0 0 auto}
  .aiin button:disabled{opacity:.4}
  .warnb{display:inline-block; font-size:10.5px; font-weight:800; color:#fff; background:var(--warn); border-radius:5px; padding:1px 5px; margin-left:6px; vertical-align:1px}
  @media (max-width:820px){ .ai{position:fixed; inset:0; z-index:70} }

  /* ============ sheet / modal ============ */
  .sheet{position:fixed; inset:0; z-index:60; display:none}
  .sheet.show{display:block}
  .sheet .bg{position:absolute; inset:0; background:rgba(20,18,8,.42)}
  .sheet .pan{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(440px,calc(100vw - 32px)); max-height:88vh; overflow-y:auto; background:var(--surf); border-radius:20px; box-shadow:var(--sh2); padding:20px}
  .sheet h3{margin:0 0 14px; font-size:18px; font-weight:800}
  .sheet .close{position:absolute; top:15px; right:18px; font-size:13px; color:var(--muted); background:var(--soft); border-radius:99px; padding:4px 10px; font-weight:700}
  .fld{margin-bottom:11px}
  .fld label{display:block; font-size:11.5px; color:var(--muted); margin:0 0 4px 3px; font-weight:800; letter-spacing:.03em}
  .inp{width:100%; background:var(--card); border-radius:11px; padding:10px 12px; box-shadow:var(--sh); outline:none; font-size:14px}
  textarea.inp{resize:vertical; min-height:78px; line-height:1.55}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:9px}
  .btn{display:block; width:100%; background:var(--ink); color:var(--surf); border-radius:12px; padding:12px; font-size:14.5px; font-weight:800; text-align:center}
  .btn.ghost{background:var(--soft); color:var(--ink)}
  .btn.acc{background:var(--acc); color:#fff}
  .btn.warn{background:var(--warn); color:#fff}
  .btnrow{display:flex; gap:8px; margin-top:10px}
  .btnrow .btn{flex:1}
  .hint{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.65}
  .hint.err{color:var(--warn)}
  .menu{position:fixed; z-index:70; background:var(--card); border-radius:13px; box-shadow:var(--sh2); padding:5px; min-width:172px}
  .menu button{display:block; width:100%; text-align:left; padding:8px 11px; border-radius:9px; font-size:13.5px}
  .menu button:hover{background:var(--soft)}
  .menu button.dz{color:var(--warn)}
  .menu hr{border:0; border-top:1px solid var(--line); margin:4px 8px}
  .spin{display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ============ optimize / offline ============ */
  .netbar{display:none; background:var(--warn); color:#fff; font-size:13px; font-weight:700; padding:9px 14px; text-align:center}
  .netbar.show{display:block}
  .optbox{background:var(--soft); border-radius:14px; padding:14px}
  .optrow{display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; font-size:14px}
  .optrow b{font-size:19px; font-weight:800}
  .optrow.ok b{color:var(--ok)}
  .optsave{margin-top:9px; padding-top:9px; border-top:1px solid var(--line); font-size:13px; font-weight:800; color:var(--acc)}
  .optseq{background:var(--card); border-radius:12px; padding:9px 12px; max-height:220px; overflow-y:auto; box-shadow:var(--sh)}
  .optseq div{display:flex; gap:9px; padding:4px 0; font-size:13.5px; align-items:baseline}
  .optseq b{width:18px; color:var(--muted); font-size:11.5px; font-weight:800; flex:0 0 auto}

  /* ============ print ============ */
  @media print{
    .side,.mapwrap,.top,.add,.kebab,.grip,.tick,.ai,.sheet,.menu,.netbar,.hero,.hedit,.tbtn,.empty,.leg span{display:none !important}
    html,body{overflow:visible !important; height:auto !important; background:#fff !important; color:#000 !important; font-size:11pt}
    .shell{display:block !important; height:auto !important}
    .doc{overflow:visible !important; height:auto !important; background:#fff !important}
    .page{max-width:none !important; padding:0 !important}
    .herocard{margin:0 0 14px !important; box-shadow:none !important; padding:0 !important; background:none !important}
    .herocard h1{font-size:20pt}
    .hstats{border-top:1px solid #bbb}
    .panel{box-shadow:none !important; border:1px solid #ccc; border-radius:8px; padding:4px 11px; break-inside:avoid}
    .sec,.day,.row{break-inside:avoid}
    .row{border-top:1px solid #eee}
    .ic{background:none !important; width:20px}
    .idx{position:static; margin-right:4px; background:#444 !important}
    .jr{background:#f6f6f6 !important; border:1px solid #ddd}
    .sech h2{font-size:14pt}
    .dayh h3{font-size:12pt}
    a{color:#000; text-decoration:none}
    .leg{padding-left:34px}
    #tripNote{background:none !important; border:1px solid #ddd; min-height:auto}
    @page{ margin:14mm 12mm }
  }

  /* ============ gate ============ */
  .gate{position:fixed; inset:0; background:var(--bg); z-index:90; display:none; align-items:center; justify-content:center; padding:20px}
  .gate.show{display:flex}
  .gate .box{width:100%; max-width:330px; background:var(--card); border-radius:20px; box-shadow:var(--sh2); padding:24px}
  .gate h2{margin:0 0 6px; font-size:21px; font-weight:800}
  .gate p{margin:0 0 14px; font-size:13px; color:var(--muted); line-height:1.65}
  .gate .inp{background:var(--soft); box-shadow:none; margin-bottom:9px}

  /* ============ responsive ============ */

<body>

<div class="gate" id="gate">
  <div class="box">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  'use strict';
  var SB  = 'https://lvwspnjysfyomuszzjay.supabase.co';
  var SBK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2d3Nwbmp5c2Z5b211c3p6amF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0ODIxMzIsImV4cCI6MjEwMTA1ODEzMn0.fmrc8DlO1UXcsLnUdhTG6IZyxv1kZEVP8jSEIQgf2d4';
  var TABLE='trip_log', AI_URL=SB+'/functions/v1/trip-ai';
  var APP_VER='20260913-v4-1';

  // kind：類型定義（icon、名、有冇座標、預設時間 label）
  var KINDS={
    place:{i:'📍', n:'地點',  geo:1},
    eat:  {i:'🍜', n:'食',    geo:1},
    stay: {i:'🛏', n:'住宿',  geo:1, tl:'Check in'},
    flight:{i:'✈️',n:'航班',  geo:0, tl:'起飛'},
    car:  {i:'🚗', n:'交通',  geo:1, tl:'Pick up'},
    note: {i:'📝', n:'筆記',  geo:0},
    check:{i:'☑️', n:'清單',  geo:0}
  };
  var KORDER=['place','eat','stay','flight','car','note','check'];
  var DCOL=['--d1','--d2','--d3','--d4','--d5','--d6','--d7'];

  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function kd(k){ return KINDS[k]||KINDS.place; }
  function dayColor(i){ return getComputedStyle(document.documentElement).getPropertyValue(DCOL[i%DCOL.length]).trim()||'#8FAF86'; }

  var KEY='', MODE='';
  try{ KEY=localStorage.getItem('tripKey')||''; }catch(e){}
  try{ if(KEY) MODE='cloud'; else if(localStorage.getItem('tripLocal')==='1') MODE='local'; }catch(e){}

  var state=null, lastUpdated=null, dirty=false, pTimer=null, rTimer=null, offline=false;
  var map=null, markers=[], mapDay='all', hlId=null, sugSel=-1, sugData=[], sugTimer=null;
  var undoStack=[], redoStack=[], geoQ=[], geoBusy=false;

  // ---------- date ----------
  function pad(n){ return (n<10?'0':'')+n; }
  function fmtD(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function today(){ return fmtD(new Date()); }
  function pD(s){ var p=String(s||'').split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  function shift(s,n){ var d=pD(s); d.setDate(d.getDate()+n); return fmtD(d); }
  function diffD(a,b){ return Math.round((pD(b)-pD(a))/86400000); }
  function md(s){ var d=pD(s); return (d.getMonth()+1)+'/'+d.getDate(); }
  function dow(s){ return ['日','一','二','三','四','五','六'][pD(s).getDay()]; }
  function longD(s){ var d=pD(s); return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+dow(s); }
  function nowT(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }

  // ---------- state / migration ----------
  function defState(){ return {v:2, trips:[], lists:[], items:[], logs:{}, settings:{curTrip:null,updatedAt:null}, meta:{}}; }
  function migrate(s){
    if(!s || typeof s!=='object') return defState();
    if(s.v===2){
      if(!Array.isArray(s.trips)) s.trips=[];
      if(!Array.isArray(s.lists)) s.lists=[];
      if(!Array.isArray(s.items)) s.items=[];
      if(!s.logs) s.logs={}; if(!s.settings) s.settings={}; if(!s.meta) s.meta={};
      return s;
    }
    // v1 → v2：stops 變 items，未排日期嘅入「想去」清單
    var o=defState();
    o.trips=Array.isArray(s.trips)?s.trips:[];
    o.logs=s.logs&&typeof s.logs==='object'?s.logs:{};
    o.settings=s.settings&&typeof s.settings==='object'?s.settings:{curTrip:null};
    var byTrip={};
    (Array.isArray(s.stops)?s.stops:[]).forEach(function(st){
      var k = (st.cat==='eat')?'eat' : (st.cat==='stay')?'stay' : (st.cat==='go')?'car' : 'place';
      var it={ id:st.id||uid(), tripId:st.tripId, kind:k, listId:null, date:st.date||null, ord:st.ord||0,
               time:st.time||'', name:st.name||'', lat:st.lat||null, lng:st.lng||null, addr:st.addr||'',
               note:st.note||'', cost:+st.cost||0, done:!!st.done, checks:[] };
      if(!it.date){
        if(!byTrip[it.tripId]){ var L={id:uid(), tripId:it.tripId, name:'想去', ord:1}; o.lists.push(L); byTrip[it.tripId]=L.id; }
        it.listId=byTrip[it.tripId];
      }
      o.items.push(it);
    });
    return o;
  }
  function applyState(row){
    state=migrate((row&&row.state)||{});
    lastUpdated=(row&&row.updated_at)||null;
    if(!curTrip() && state.trips.length) state.settings.curTrip=state.trips[0].id;
    ensureList();
  }
  function ensureList(){
    var t=curTrip(); if(!t) return;
    if(!state.lists.some(function(l){return l.tripId===t.id;}))
      state.lists.push({id:uid(), tripId:t.id, name:'想去', ord:1});
  }
  function cacheSave(){ try{ localStorage.setItem('tripCache', JSON.stringify({state:state,updated_at:lastUpdated})); }catch(e){} }
  function cacheLoad(){ try{ var s=localStorage.getItem('tripCache'); return s?JSON.parse(s):null; }catch(e){ return null; } }
  function setSync(c,t){ var e=$('sync'); e.className='sync '+(c||''); e.textContent=t; }
  function hdr(){ return {apikey:SBK, Authorization:'Bearer '+SBK, 'x-client-info':KEY, 'Content-Type':'application/json'}; }

  // ---------- undo ----------
  function snap(){
    try{ undoStack.push(JSON.stringify(state)); }catch(e){ return; }
    if(undoStack.length>40) undoStack.shift();
    redoStack.length=0;
  }
  function undo(){ if(!undoStack.length) return; try{ redoStack.push(JSON.stringify(state)); state=JSON.parse(undoStack.pop()); save(); }catch(e){} }
  function redo(){ if(!redoStack.length) return; try{ undoStack.push(JSON.stringify(state)); state=JSON.parse(redoStack.pop()); save(); }catch(e){} }
  function upBtns(){ $('bUndo').disabled=!undoStack.length; $('bRedo').disabled=!redoStack.length; }

  // ---------- persist ----------
  function save(quiet){
    dirty=true; state.settings.updatedAt=new Date().toISOString(); cacheSave();
    if(!quiet) render();
    if(MODE==='local'){ dirty=false; setSync('ok','已存喺本機 '+nowT()); return; }
    setSync('','儲緊…');
    if(pTimer) clearTimeout(pTimer);
    pTimer=setTimeout(persist,600);
  }
  function persist(){
    if(!state||MODE!=='cloud'||!KEY) return;
    var ts=new Date().toISOString();
    fetch(SB+'/rest/v1/'+TABLE+'?on_conflict=id',{method:'POST',
      headers:Object.assign(hdr(),{Prefer:'resolution=merge-duplicates,return=representation'}),
      body:JSON.stringify([{id:'main',state:state,updated_at:ts}])})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(rows){ dirty=false; if(rows&&rows[0]) lastUpdated=rows[0].updated_at; cacheSave(); setSync('ok','已儲低 '+nowT()); })
    .catch(function(){ setSync('err','離線，資料未同步'); setTimeout(persist,8000); });
  }
  function fetchRow(cb){
    var done=false,ctrl=null; try{ctrl=new AbortController();}catch(e){}
    var t=setTimeout(function(){ if(done)return; done=true; try{ctrl&&ctrl.abort();}catch(e){} cb(null,false); },12000);
    fetch(SB+'/rest/v1/'+TABLE+'?id=eq.main&select=state,updated_at',{headers:hdr(),signal:ctrl?ctrl.signal:undefined})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ if(done)return; done=true; clearTimeout(t); cb(rows&&rows[0]?rows[0]:null,true); })
      .catch(function(){ if(done)return; done=true; clearTimeout(t); cb(null,false); });
  }
  function boot(){
    if(!MODE){ showGate(''); return; }
    if(MODE==='local'){ var c=cacheLoad(); applyState(c&&c.state?c:{state:defState()}); setSync('ok','本機模式'); render(); return; }
    if(!state){ var c2=cacheLoad(); if(c2&&c2.state){ applyState(c2); render(); setSync('','上次嘅資料·更新緊…'); } else setSync('','載緊資料…'); }
    fetchRow(function(row,reached){
      if(!row){
        if(!reached){ if(!state){ applyState({state:defState()}); render(); } setSync('err','離線，資料未同步');
          if(rTimer) clearTimeout(rTimer); rTimer=setTimeout(boot,10000); return; }
        setSync('','第一次用，開緊…');
        fetch(SB+'/rest/v1/'+TABLE+'?on_conflict=id',{method:'POST',
          headers:Object.assign(hdr(),{Prefer:'resolution=merge-duplicates,return=representation'}),
          body:JSON.stringify([{id:'main',state:defState(),updated_at:new Date().toISOString()}])})
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(rows){ if(!rows||!rows[0]) throw 0; applyState(rows[0]); cacheSave(); setSync('ok','已同步'); render(); })
        .catch(function(){ try{localStorage.removeItem('tripKey');}catch(e){} KEY=''; MODE=''; showGate('暗號唔啱，再入一次'); });
        return;
      }
      applyState(row); cacheSave(); setSync('ok','已同步'); render();
    });
  }
  function refreshIfChanged(){
    if(!state||dirty||MODE!=='cloud'||!KEY) return;
    fetch(SB+'/rest/v1/'+TABLE+'?id=eq.main&select=updated_at',{headers:hdr()})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ if(rows&&rows[0]&&rows[0].updated_at!==lastUpdated)
        fetchRow(function(row){ if(row&&!dirty){ applyState(row); cacheSave(); render(); setSync('ok','已同步 '+nowT()); } }); })
      .catch(function(){ setSync('err','離線，資料未同步'); });
  }

  // ---------- gate ----------
  function mealKey(){ try{ return localStorage.getItem('mealKey')||''; }catch(e){ return ''; } }
  function showGate(msg){
    $('gate').className='gate show'; $('gateMsg').textContent=msg||'';
    var has=!!mealKey();
    $('gateReuse').className='btn acc'+(has?'':' hide');
    $('gateOr').className='hint'+(has?'':' hide');
    if(!has) setTimeout(function(){ try{$('gateKey').focus();}catch(e){} },50);
  }
  function enter(k){ KEY=k; MODE='cloud'; try{ localStorage.setItem('tripKey',k); localStorage.removeItem('tripLocal'); }catch(e){} $('gate').className='gate'; boot(); }
  $('gateGo').addEventListener('click',function(){ var k=($('gateKey').value||'').trim(); if(k) enter(k); });
  $('gateKey').addEventListener('keydown',function(e){ if(e.key==='Enter'){ var k=(e.target.value||'').trim(); if(k) enter(k); } });
  $('gateReuse').addEventListener('click',function(){ var k=mealKey(); if(k) enter(k); });
  $('gateLocal').addEventListener('click',function(){ MODE='local'; try{ localStorage.setItem('tripLocal','1'); }catch(e){} $('gate').className='gate'; boot(); });

  // ---------- model ----------
  function curTrip(){ var id=state&&state.settings.curTrip; if(!id) return null;
    for(var i=0;i<state.trips.length;i++) if(state.trips[i].id===id) return state.trips[i]; return null; }
  function tripById(id){ for(var i=0;i<state.trips.length;i++) if(state.trips[i].id===id) return state.trips[i]; return null; }
  function days(){ var t=curTrip(); if(!t||!t.start||!t.end) return [];
    var n=diffD(t.start,t.end); if(n<0||n>400) return [t.start];
    var a=[]; for(var i=0;i<=n;i++) a.push(shift(t.start,i)); return a; }
  function tItems(){ var t=curTrip(); if(!t) return []; return state.items.filter(function(x){return x.tripId===t.id;}); }
  function tLists(){ var t=curTrip(); if(!t) return []; return state.lists.filter(function(l){return l.tripId===t.id;}).sort(function(a,b){return (a.ord||0)-(b.ord||0);}); }
  function byOrd(a,b){ return (a.ord||0)-(b.ord||0); }
  function dayItems(d){ return tItems().filter(function(x){return x.date===d;}).sort(byOrd); }
  function listItems(id){ return tItems().filter(function(x){return x.listId===id && !x.date;}).sort(byOrd); }
  function itemById(id){ for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) return state.items[i]; return null; }
  function nextOrd(arr){ var m=0; arr.forEach(function(x){ if((x.ord||0)>m) m=x.ord||0; }); return m+10; }
  function cur(){ var t=curTrip(); return (t&&t.cur)||'HKD'; }
  function money(n){ return cur()+' '+Math.round(+n||0).toLocaleString(); }
  function sumCost(arr){ return arr.reduce(function(a,x){ return a+(+x.cost||0); },0); }
  function hav(a,b){
    var R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
    var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2*R*Math.asin(Math.sqrt(s));
  }
  function legTxt(a,b){
    if(!a.lat||!b.lat) return '';
    var km=hav([a.lat,a.lng],[b.lat,b.lng])*1.3;
    if(km<0.06) return '';
    var mins = km<2 ? Math.max(1,Math.round(km/4.5*60)) : Math.round(km/26*60);
    var how = km<2 ? '步行' : '車程';
    return how+'約 '+mins+' 分鐘 · '+(km<10?km.toFixed(1):Math.round(km))+' km';
  }

  // ---------- journal ----------
  var MOODS=['😀','🙂','😐','😮‍💨','🤩'];
  function logKey(d){ var t=curTrip(); return t? t.id+'|'+d : null; }
  function getLog(d){ var k=logKey(d); return (k&&state.logs[k])||null; }
  function journalSheet(d){
    var lg=getLog(d)||{text:'',mood:''}, done=dayItems(d).filter(function(x){return x.done;});
    openSheet('<h3>📖 '+longD(d)+'</h3>'+
      '<div class="moods" style="display:flex;gap:6px;margin-bottom:10px">'+
      MOODS.map(function(m){ return '<button class="tbtn jm'+(lg.mood===m?' solid':'')+'" data-m="'+m+'" style="width:38px;height:38px;justify-content:center;font-size:17px">'+m+'</button>'; }).join('')+'</div>'+
      '<textarea class="inp" id="jText" style="min-height:150px" placeholder="今日去咗邊、食咗乜、有咩感覺…">'+esc(lg.text)+'</textarea>'+
      (done.length?'<div class="hint">今日打咗勾：'+done.map(function(x){return esc(x.name);}).join('、')+'</div>':'')+
      '<div class="btnrow"><button class="btn ghost" data-act="ailog" data-d="'+d+'">✨ AI 幫我寫</button>'+
      '<button class="btn acc" data-act="savejournal" data-d="'+d+'">儲存</button></div>');
  }

  // ---------- AI ----------
  function aiCall(intent,prompt,cb){
    if(MODE!=='cloud'){ cb(null,'no-key'); return; }
    fetch(AI_URL,{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+SBK,'x-client-info':KEY,'Content-Type':'application/json'},
      body:JSON.stringify({intent:intent,prompt:prompt})})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ cb(j&&j.text||'',null); })
      .catch(function(e){ cb(null,String(e.message||e)); });
  }
  function parseStops(t){ if(!t) return null; var m=String(t).match(/\{[\s\S]*\}/); if(!m) return null;
    try{ var j=JSON.parse(m[0]); return Array.isArray(j.stops)?j.stops:null; }catch(e){ return null; } }
  function importStops(arr,toList){
    var t=curTrip(), ds=days(), ids=[]; snap();
    var lid = toList ? (tLists()[0]||{}).id : null;
    arr.forEach(function(r){
      if(!r||!r.name) return;
      var date=null;
      if(!toList && r.day){ var i=(+r.day)-1; if(i>=0&&i<ds.length) date=ds[i]; }
      var k = KINDS[r.cat]? r.cat : (r.cat==='see'||r.cat==='buy'||r.cat==='etc'? 'place' : (r.cat==='go'?'car':'place'));
      var x={ id:uid(), tripId:t.id, kind:k, listId:date?null:lid, date:date,
              ord:nextOrd(date?dayItems(date):listItems(lid)), time:r.time||'', name:String(r.name).slice(0,120),
              lat:null,lng:null,addr:'', note:String(r.note||'').slice(0,400), cost:+r.cost||0, done:false, checks:[] };
      state.items.push(x); ids.push(x.id);
    });
    save(); closeSheet();
    ids.forEach(function(i){ geoQ.push(i); }); pumpGeo();
    return ids.length;
  }
  function aiSheet(){
    var t=curTrip();
    openSheet('<h3>✨ AI 助手</h3>'+
      '<div class="hint" style="margin-bottom:12px">常駐對話助手喺第二浪。而家可以做呢兩樣：</div>'+
      '<div class="fld"><label>排行程 — 想點玩？</label><textarea class="inp" id="aiPref" placeholder="例：主打街頭嘢食同古蹟，唔想行太多，中等預算"></textarea></div>'+
      '<button class="btn acc" data-act="aiplan">排落' + (days().length||0) + '日行程（加喺現有嘢後面）</button>'+
      '<div class="fld" style="margin-top:16px"><label>貼文字抽地點</label><textarea class="inp" id="aiSrc" placeholder="貼 blog、IG caption、朋友清單…"></textarea></div>'+
      '<button class="btn ghost" data-act="aiextract">抽出嚟入清單</button>'+
      '<div class="hint" id="aiMsg"></div>');
  }
  function aiRun(intent,prompt,onText){
    var m=$('aiMsg'); if(m) m.innerHTML='<span class="spin"></span>諗緊…';
    aiCall(intent,prompt,function(txt,err){
      if(err||!txt){ manualSheet(prompt,onText,err); return; }
      onText(txt);
    });

    var m=String(txt).match(/```json\s*([\s\S]*?)```/);
    var raw=m? m[1] : null;
    if(!raw){ var m2=String(txt).match(/\{[^{}]*"ops"[\s\S]*\}/); raw=m2?m2[0]:null; }
    if(!raw) return null;
    try{ var j=JSON.parse(raw.trim()); return Array.isArray(j.ops)?j.ops:null; }catch(e){ return null; }

  function applyOps(ops){
    var t=curTrip(); if(!t||!ops||!ops.length) return 0;
    snap();
    var n=0, fresh=[];
    ops.forEach(function(o){
      try{
        if(!o||!o.op) return;
        if(o.op==='add'){
          var pp=String(o.to||'').split(':'), isDay=pp[0]==='day';
          var date=isDay?pp[1]:null, listId=isDay?null:(pp[1]||(tLists()[0]||{}).id);
          if(isDay && days().indexOf(date)<0) return;
          if(!isDay && !listId) return;
          var nm=String(o.name||'').trim(); if(!nm) return;
          var x={id:uid(),tripId:t.id,kind:KINDS[o.kind]?o.kind:'place',listId:listId,date:date,
                 ord:nextOrd(isDay?dayItems(date):listItems(listId)),time:String(o.time||''),
                 name:nm.slice(0,120),lat:null,lng:null,addr:'',note:String(o.note||'').slice(0,400),
                 cost:+o.cost||0,done:false,checks:[],ai:1};
          state.items.push(x); fresh.push(x.id); n++;
        }
        else if(o.op==='del'){ var b=state.items.length;
          state.items=state.items.filter(function(i){ return i.id!==o.id; }); if(state.items.length<b) n++; }
        else if(o.op==='move'){ var x2=itemById(o.id); if(!x2||x2.tripId!==t.id) return;
          var q=String(o.to||'').split(':');
          if(q[0]==='day'){ if(days().indexOf(q[1])<0) return; x2.date=q[1]; x2.listId=null; }
          else { if(!q[1]) return; x2.date=null; x2.listId=q[1]; }
          x2.ord=nextOrd(x2.date?dayItems(x2.date):listItems(x2.listId)); n++; }
        else if(o.op==='set'){ var x3=itemById(o.id); if(!x3||x3.tripId!==t.id) return;
          if(o.name!=null) x3.name=String(o.name).slice(0,120);
          if(o.time!=null) x3.time=String(o.time).slice(0,5);
          if(o.note!=null) x3.note=String(o.note).slice(0,400);
          if(o.cost!=null) x3.cost=+o.cost||0;
          if(o.kind && KINDS[o.kind]) x3.kind=o.kind;
          if(o.done!=null) x3.done=!!o.done;
          n++; }
        else if(o.op==='newlist'){ var ln=String(o.name||'').trim(); if(!ln) return;
          state.lists.push({id:uid(),tripId:t.id,name:ln.slice(0,40),ord:tLists().length+1}); n++; }
      }catch(e){}
    });
    if(n) save();
    fresh.forEach(function(i){ geoQ.push(i); }); if(fresh.length) pumpGeo();
    return n;

  // ---------- 路線最優化（nearest-neighbour → 2-opt）----------
  function P(x){ return [x.lat,x.lng]; }
  function pathKm(seq){ var t=0; for(var i=1;i<seq.length;i++) t+=hav(P(seq[i-1]),P(seq[i])); return t; }
  function optimizeSeq(pts, fixStart){
    if(pts.length<3) return pts.slice();
    var rest=pts.slice(), order=[];
    order.push(fixStart? rest.shift() : rest.shift());
    var cur=order[0];
    while(rest.length){
      var bi=0,bd=Infinity;
      for(var i=0;i<rest.length;i++){ var d=hav(P(cur),P(rest[i])); if(d<bd){ bd=d; bi=i; } }
      cur=rest.splice(bi,1)[0]; order.push(cur);
    }
    var lo = fixStart?1:0, guard=0, improved=true;
    while(improved && guard<120){
      improved=false; guard++;
      for(var a=lo; a<order.length-1; a++){
        for(var b=a+1; b<order.length; b++){
          var prev=order[a-1], A=order[a], B=order[b], nxt=order[b+1];
          if(!prev) continue;
          var before=hav(P(prev),P(A)) + (nxt? hav(P(B),P(nxt)) : 0);
          var after =hav(P(prev),P(B)) + (nxt? hav(P(A),P(nxt)) : 0);
          if(after < before - 1e-9){
            var seg=order.slice(a,b+1).reverse();
            Array.prototype.splice.apply(order,[a,b+1-a].concat(seg));
            improved=true;
          }
        }
      }
    }
    return order;
  }
  function optimizeDay(d){
    var all=dayItems(d);
    var geo=all.filter(function(x){ return x.lat&&x.lng; });
    if(geo.length<3) return null;
    var seq=optimizeSeq(geo,true);
    var before=pathKm(geo), after=pathKm(seq);
    var same=seq.every(function(x,i){ return x.id===geo[i].id; });
    return {d:d, all:all, geo:geo, seq:seq, before:before, after:after, same:same};
  }
  function optimizeSheet(d){
    var r=optimizeDay(d);
    if(!r){ alert('呢日要至少 3 個有座標嘅地點先排到'); return; }
    if(r.same){ openSheet('<h3>🧭 路線最優化</h3><div class="empty">而家嘅次序已經係最順<br>行程總長 '+r.before.toFixed(1)+' km，唔使改。</div>'); return; }
    var saved=r.before-r.after, pct=Math.round(saved/r.before*100);
    openSheet('<h3>🧭 路線最優化 · '+longD(d)+'</h3>'+
      '<div class="optbox"><div class="optrow"><span>而家</span><b class="num">'+r.before.toFixed(1)+' km</b></div>'+

      '<button class="btn acc" data-act="applyopt" data-d="'+d+'">套用</button></div>');
  }
  function applyOpt(d){
    var r=optimizeDay(d); if(!r||r.same) return;
    snap();
    // 只換有座標嗰啲項目所佔嘅位，冇座標嘅（航班／筆記）原地不動
    var slots=[]; r.all.forEach(function(x,i){ if(x.lat&&x.lng) slots.push(i); });
    var out=r.all.slice();
    slots.forEach(function(pos,k){ out[pos]=r.seq[k]; });
    out.forEach(function(x,i){ x.ord=(i+1)*10; });
    save(); closeSheet(); setSync('ok','路線重排咗，慳 '+(r.before-r.after).toFixed(1)+' km');
  }

  function budgetSec(){
    var it=tItems().filter(function(x){return +x.cost>0;});

    var by={}, tot=0;

  function drawMap(){
    if(!window.L) return;
    if(!map){
      map=L.map('map',{zoomControl:true});
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
      map.setView([22.3193,114.1694],10);
    }
    markers.forEach(function(m){ map.removeLayer(m); }); markers=[];
    var t=curTrip();
    $('mapbar').innerHTML = t? ('<button data-act="mapday" data-d="all" class="'+(mapDay==='all'?'on':'')+'">全程</button>'+
      days().map(function(d,i){ return '<button data-act="mapday" data-d="'+d+'" class="'+(mapDay===d?'on':'')+'">'+md(d)+'</button>'; }).join('')) : '';
    var pts=mapPoints();
    if(!pts.length){ return; }
    var lines={}, ll=[];
    pts.forEach(function(p){
      var big = hlId===p.x.id;
      var m=L.marker([p.x.lat,p.x.lng],{icon:L.divIcon({className:'',
        html:'<div class="pin'+(big?' big':'')+'" style="background:'+p.c+'"><b>'+(p.n||'·')+'</b></div>',
        iconSize:[25,25], iconAnchor:[12,25]}), zIndexOffset: big?1000:0});
      m.on('click',function(){ hlId=p.x.id; render(); scrollTo(p.x.id); });
      m.bindTooltip(p.x.name,{direction:'top',offset:[0,-22]});
      m.addTo(map); markers.push(m); ll.push([p.x.lat,p.x.lng]);
      if(p.d){ (lines[p.d]=lines[p.d]||{c:p.c,a:[]}).a.push([p.x.lat,p.x.lng]); }
    });
    Object.keys(lines).forEach(function(d){
      if(lines[d].a.length>1){ var pl=L.polyline(lines[d].a,{color:lines[d].c,weight:3,opacity:.8,dashArray:'5 6'}).addTo(map); markers.push(pl); }
    });
    if(!map.__fit || mapDay!==map.__lastDay){ map.fitBounds(L.latLngBounds(ll).pad(.25)); if(ll.length===1) map.setZoom(14); map.__fit=1; map.__lastDay=mapDay; }
    setTimeout(function(){ map.invalidateSize(); },60);
  }

  // ---------- geocode ----------
  function destToken(){
    var t=curTrip(); if(!t||!t.dest) return '';
    return String(t.dest).split(/[・、,，\/／|｜]/)[0].trim().split(/\s*\(/)[0].trim();
  }
  // 順序試：名＋目的地第一個地名 → 淨個名。目的地寫「東京・北海道」呢類唔會再搞死查詢。
  function nomTry(name, cb){
    var d=destToken(), tries=[];
    if(d) tries.push(name+' '+d);
    tries.push(name);
    (function go(i){
      if(i>=tries.length){ cb([]); return; }
      nom(tries[i], function(a){
        if(a===null){ cb(null); return; }
        if(a.length){ cb(a); return; }
        if(i+1<tries.length) setTimeout(function(){ go(i+1); },1100); else cb([]);
      });
    })(0);
  }
  function nom(q,cb){
    fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&addressdetails=1&accept-language=zh-HK,zh,en&q='+encodeURIComponent(q))
      .then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(a){ cb(a||[]); }).catch(function(){ cb(null); });
  }
  function pumpGeo(){
    if(geoBusy) return;
    var id=geoQ.shift(); if(id==null){ if(state) setSync('ok','定位完'); return; }
    var x=itemById(id); if(!x||x.lat){ pumpGeo(); return; }
    geoBusy=true; setSync('','定位緊…剩 '+(geoQ.length+1));
    var t=curTrip();
    nomTry(x.name,function(a){
      if(a&&a[0]){ x.lat=+a[0].lat; x.lng=+a[0].lon; if(!x.addr) x.addr=shortAddr(a[0]); x.unverified=0; save(); }
      else if(a && !a.length && x.ai){ x.unverified=1; save(true); }
      setTimeout(function(){ geoBusy=false; pumpGeo(); },1100);
    });
  }
  function shortAddr(r){
    var a=r.address||{};
    var p=[a.suburb||a.neighbourhood||a.city_district||'', a.city||a.town||a.village||a.county||'', a.country||''].filter(Boolean);
    return p.length? p.join(', ') : (r.display_name||'').split(',').slice(1,3).join(',').trim();
  }

      if(sc2[0]==='day'){ x4.date=sc2[1]; x4.listId=null; } else { x4.date=null; x4.listId=sc2[1]; }
      var ec=$('eChecks');
      if(ec){ var old=x4.checks||[]; x4.checks=ec.value.split('\n').map(function(l){return l.trim();}).filter(Boolean).map(function(t2){
        var p=old.filter(function(o){return o.t===t2;})[0]; return {t:t2, done:p?p.done:false}; }); }
      save(); closeSheet();
    }
    else if(act==='relookup'){
      var x5=itemById(id); if(!x5) return; x5.lat=null; x5.lng=null; geoQ.push(id); pumpGeo();
      $('eGeo').innerHTML='<span class="spin"></span>定位緊…';
    }
    else if(act==='dup'){ var x6=itemById(id); if(!x6) return; snap();
      var c=JSON.parse(JSON.stringify(x6)); c.id=uid(); c.ord=(x6.ord||0)+5; state.items.push(c); save(); }
    else if(act==='del'){ snap(); state.items=state.items.filter(function(i){return i.id!==id;}); save(); }
    else if(act==='geo1'){ geoQ.push(id); pumpGeo(); }
    else if(act==='nav'){ var x7=itemById(id); if(x7&&x7.lat) window.open('https://www.google.com/maps/dir/?api=1&destination='+x7.lat+','+x7.lng,'_blank','noopener'); }
    else if(act==='sortday'){ var d2=el.getAttribute('data-d'); snap();
      dayItems(d2).slice().sort(function(a,b){ return (a.time||'99:99')<(b.time||'99:99')?-1:1; }).forEach(function(x,k){ x.ord=(k+1)*10; }); save(); }
    else if(act==='clearday'){ var d3=el.getAttribute('data-d');
      if(!confirm('清空呢日所有項目？')) return; snap();
      state.items=state.items.filter(function(i){ return !(i.tripId===curTrip().id && i.date===d3); }); save(); }
    else if(act==='newlist'){ var nm=prompt('清單叫咩名？','餐廳'); if(!nm) return; snap();
      state.lists.push({id:uid(),tripId:curTrip().id,name:nm.trim(),ord:tLists().length+1}); save(); }
    else if(act==='renlist'){ var l=state.lists.filter(function(z){return z.id===id;})[0]; if(!l) return;
      var nm2=prompt('改做…',l.name); if(!nm2) return; snap(); l.name=nm2.trim(); save(); }
    else if(act==='dellist'){
      if(!confirm('刪咗呢個清單？入面啲項目都會冇。')) return; snap();
      state.lists=state.lists.filter(function(z){return z.id!==id;});
      state.items=state.items.filter(function(z){return z.listId!==id;}); save(); }
    else if(act==='newtrip'){ tripSheet(null); }
    else if(act==='edittrip'){ tripSheet(curTrip()); }
    else if(act==='savetrip'){
      var nm3=($('tName').value||'').trim(), st=$('tStart').value, en=$('tEnd').value;
      if(!nm3){ $('tName').focus(); return; }
      if(st&&en&&diffD(st,en)<0){ alert('返程早過出發'); return; }
      snap();
      var t2=id? tripById(id):null;
      if(t2){ t2.name=nm3; t2.dest=($('tDest').value||'').trim(); t2.start=st; t2.end=en; t2.cur=($('tCur').value||'HKD').trim(); }
      else { t2={id:uid(),name:nm3,dest:($('tDest').value||'').trim(),start:st,end:en,cur:($('tCur').value||'HKD').trim(),note:''};
             state.trips.push(t2); state.settings.curTrip=t2.id; ensureList(); }
      save(); closeSheet();
    }
    else if(act==='deltrip'){
      if(!confirm('刪咗成個旅程？')) return; snap();
      state.trips=state.trips.filter(function(z){return z.id!==id;});
      state.items=state.items.filter(function(z){return z.tripId!==id;});
      state.lists=state.lists.filter(function(z){return z.tripId!==id;});
      state.settings.curTrip=state.trips.length?state.trips[0].id:null; save(); closeSheet();
    }
    else if(act==='trips'){
      var h='<h3>我嘅旅程</h3>';
      state.trips.forEach(function(t3){
        h+='<button class="btn ghost" data-act="picktrip" data-id="'+t3.id+'" style="text-align:left;margin-bottom:7px">'+
           (t3.id===state.settings.curTrip?'● ':'')+esc(t3.name)+' <span style="color:var(--muted);font-weight:500">'+(t3.start?md(t3.start)+'–'+md(t3.end):'')+'</span></button>';
      });
      openSheet(h+'<button class="btn acc" data-act="newtrip">＋ 開新旅程</button>');
    }
    else if(act==='picktrip'){ state.settings.curTrip=id; mapDay='all'; if(map) map.__fit=0; save(); closeSheet(); }
    else if(act==='go'){ var s3=$(el.getAttribute('data-s')); if(s3) s3.scrollIntoView({block:'start',behavior:'smooth'});
      document.querySelectorAll('#toc button').forEach(function(b){ b.classList.remove('on'); }); el.classList.add('on');
      $('side').classList.remove('open'); }
    else if(act==='mapday'){ mapDay=el.getAttribute('data-d'); if(map) map.__fit=0; drawMap(); }
    else if(act==='openmap'){ $('mapwrap').classList.add('open'); setTimeout(function(){ if(map) map.invalidateSize(); },80); }
    else if(act==='closemap'){ $('mapwrap').classList.remove('open'); }
    else if(act==='menu-side'){ $('side').classList.toggle('open'); }
    else if(act==='undo'){ undo(); }
    else if(act==='redo'){ redo(); }
    else if(act==='closesheet'){ closeSheet(); }
    else if(act==='optday'){ optimizeSheet(el.getAttribute('data-d')); }
    else if(act==='applyopt'){ applyOpt(el.getAttribute('data-d')); }
    else if(act==='print'){ closeSheet(); setTimeout(function(){ window.print(); },250); }
    else if(act==='export'){ exportSheet(); }
    else if(act==='exJson'){ dl('eva-trip-'+today()+'.json', JSON.stringify(state,null,2)); }
    else if(act==='exCsv'){
      var rows=[['日期','時間','類型','名','地址','使費','備註','完成']];
      days().forEach(function(d){ dayItems(d).forEach(function(x){
        rows.push([d,x.time||'',kd(x.kind).n,x.name,x.addr||'',x.cost||0,(x.note||'').replace(/\n/g,' '),x.done?'✓':'']); }); });
      tLists().forEach(function(l){ listItems(l.id).forEach(function(x){
        rows.push([l.name,'',kd(x.kind).n,x.name,x.addr||'',x.cost||0,(x.note||'').replace(/\n/g,' '),'']); }); });
      var csv='﻿'+rows.map(function(r){ return r.map(function(c){ return '"'+String(c).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
      dl((curTrip().name||'trip')+'.csv', csv, 'text/csv');
    }
    else if(act==='exShare'){
      var t4=curTrip(), lg={};
      Object.keys(state.logs).forEach(function(k2){ if(k2.indexOf(t4.id+'|')===0) lg[k2.slice(t4.id.length+1)]=state.logs[k2]; });
      dl('data.json', JSON.stringify({trip:{name:t4.name,dest:t4.dest,start:t4.start,end:t4.end,cur:t4.cur},
        stops:tItems().map(function(x){ return {name:x.name,cat:x.kind,date:x.date,time:x.time,addr:x.addr,note:x.note,cost:x.cost,done:!!x.done,lat:x.lat,lng:x.lng}; }),
        logs:lg, exportedAt:'匯出於 '+today()},null,2));
    }
    else if(act==='exGmap'){
      var d4=mapDay==='all'? days()[0] : mapDay;
      var pts=dayItems(d4).filter(function(x){return x.lat;});
      if(pts.length<1){ alert('嗰日冇座標'); return; }
      var u='https://www.google.com/maps/dir/'+pts.map(function(x){return x.lat+','+x.lng;}).join('/');
      window.open(u,'_blank','noopener');
    }
    else if(act==='ai'){ aiOpen(); }
    else if(act==='aiclose'){ $('aiPanel').classList.remove('open'); if(innerWidth<=820) $('mapwrap').classList.remove('open'); }
    else if(act==='aiclear'){ var t7=curTrip(); if(t7&&state.chat){ state.chat[t7.id]=[]; save(true); renderChat(); } }
    else if(act==='aisend'){ var ta3=$('aiText'); var v3=ta3.value; ta3.value=''; ta3.style.height=''; aiSend(v3); }
    else if(act==='aichip'){ aiSend(el.textContent); }
    else if(act==='aitools'){ aiSheet(); }
    else if(act==='journal'){ journalSheet(el.getAttribute('data-d')); }
    else if(el.classList.contains('jm')){
      $('pan').querySelectorAll('.jm').forEach(function(b){ b.classList.remove('solid'); }); el.classList.add('solid');
    }
    else if(act==='savejournal'){
      var d5=el.getAttribute('data-d'), k3=logKey(d5); if(!k3) return;
      var mo=$('pan').querySelector('.jm.solid');
      snap(); state.logs[k3]={text:($('jText').value||'').trim(), mood:mo?mo.getAttribute('data-m'):'', updatedAt:new Date().toISOString()};
      if(!state.logs[k3].text && !state.logs[k3].mood) delete state.logs[k3];
      save(); closeSheet();
    }
    else if(act==='ailog'){
      var d6=el.getAttribute('data-d'), t5=curTrip(), i6=days().indexOf(d6);
      var went=dayItems(d6).filter(function(x){return x.done;}).map(function(x){ return '- '+(x.time?x.time+' ':'')+x.name+(x.cost?'（'+x.cost+'）':'')+(x.note?'：'+x.note:''); }).join('\n');
      var pr='幫我寫今日旅程日誌，第一人稱、書面中文（香港用詞），150–250 字，平實唔好誇張，只可以照住下面事實寫，唔准作嘢。\n'+
        '旅程：'+t5.name+(t5.dest?'（'+t5.dest+'）':'')+'\n日子：第'+(i6+1)+'日 '+d6+'\n去咗：\n'+(went||'（未標低）')+'\n'+
        '我自己嘅筆記：'+((getLog(d6)||{}).text||'（冇）')+'\n\n只回覆日誌本身，唔好加標題。';
      var apply=function(txt){ var ta=$('jText'); if(ta){ ta.value=(ta.value?ta.value+'\n\n':'')+String(txt).trim(); } else {
        var k4=logKey(d6); snap(); state.logs[k4]={text:String(txt).trim(),mood:(getLog(d6)||{}).mood||'',updatedAt:new Date().toISOString()}; save(); closeSheet(); } };
      aiRun('log',pr,apply);
    }
    else if(act==='aiplan'){
      var t6=curTrip(), n6=days().length;
      if(!n6){ alert('先入返出發／返程日期'); return; }
      var pr2='你係旅程規劃助手。幫我排「'+(t6.dest||t6.name)+'」'+n6+'日行程。\n出發日：'+t6.start+'\n偏好：'+(($('aiPref').value||'').trim()||'冇特別')+'\n'+
        '每日 3–6 個地點，順路排。只可以回覆 JSON：\n'+
        '{"stops":[{"day":1,"time":"09:30","name":"地點名（連城市）","cat":"place|eat|stay|car","note":"一句","cost":0}]}\n'+
        'cost 用 '+cur()+' 每人大約，唔知就 0。';
      aiRun('plan',pr2,function(txt){ var a=parseStops(txt); if(!a){ manualSheet(pr2,arguments.callee,'回覆唔係 JSON'); return; }
        var n=importStops(a,false); setSync('ok','AI 加咗 '+n+' 項'); });
    }
    else if(act==='aiextract'){
      var src=($('aiSrc').value||'').trim(); if(!src){ alert('未貼嘢'); return; }
      var pr3='從下面段文字抽出所有值得去嘅地點，只可以回覆 JSON：\n{"stops":[{"name":"地點名（連城市）","cat":"place|eat|stay|car","note":"一句","cost":0}]}\n\n文字：\n<<<\n'+src.slice(0,6000)+'\n>>>';
      aiRun('extract',pr3,function(txt){ var a=parseStops(txt); if(!a){ manualSheet(pr3,arguments.callee,'回覆唔係 JSON'); return; }
        var n=importStops(a,true); setSync('ok','AI 加咗 '+n+' 項落清單'); });
    }
    else if(act==='copyprompt'){ var ta2=$('mPrompt'); ta2.select();
      if(navigator.clipboard) navigator.clipboard.writeText(ta2.value); else try{document.execCommand('copy');}catch(e){}
      var mm=$('aiMsg'); if(mm) mm.textContent='已複製 ✓'; }
    else if(act==='applypaste'){
      var fn=$('pan').__onText, v=($('mPaste').value||'').trim();
      if(!fn||!v){ var m2=$('aiMsg'); if(m2) m2.textContent='未貼嘢'; return; }
      fn(v);
    }
    else if(act==='settings'){
      openSheet('<h3>設定</h3><div class="hint" style="margin-bottom:12px">模式：'+(MODE==='cloud'?'雲端同步':'本機模式')+'<br>版本 '+APP_VER+'</div>'+
        '<button class="btn ghost" data-act="exJson">匯出備份</button>'+
        (MODE==='cloud'?'<button class="btn warn" data-act="logout" style="margin-top:8px">登出</button>':''));
    }
    else if(act==='logout'){ try{ localStorage.removeItem('tripKey'); localStorage.removeItem('tripCache'); }catch(e){} location.reload(); }
  });

  document.addEventListener('input',function(e){
    if(e.target.id==='aiText'){ e.target.style.height='auto'; e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'; }
  });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) refreshIfChanged(); });
  setInterval(refreshIfChanged,45000);
  addEventListener('resize',function(){ if(map) map.invalidateSize(); });
  addEventListener('online',function(){ setNet(); refreshIfChanged(); });
  addEventListener('offline',setNet);
  setNet();
  if('serviceWorker' in navigator) addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
  boot();
})();
</script>
</body>
</html>
