  // ---------- Google Maps 底圖（要 browser key，存喺暗號閘後面嘅 row）----------
  var gmap=null, gmarks=[], gInfo=null, gState='off';  // off | loading | on | fail
  function mapKey(){ return (state && state.settings && state.settings.gmapKey) || ''; }
  function loadGMaps(cb){
    if(window.google && window.google.maps){ gState='on'; cb(); return; }
    if(gState==='loading') return;
    var k=mapKey(); if(!k){ gState='off'; return; }
    gState='loading';
    window.__gmapsReady=function(){ gState='on'; cb(); };
    var sc=document.createElement('script');
    sc.async=true;
    sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(k)+
           '&language=zh-HK&region=HK&loading=async&callback=__gmapsReady';
    sc.onerror=function(){ gState='fail'; setSync('err','Google 地圖載入失敗，用返 OSM'); drawMap(); };
    document.head.appendChild(sc);
  }
  function pinIcon(label,color,big){
    var w=big?34:27, h=big?44:35;
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 28 36">'+
      '<path d="M14 0C6.3 0 0 6.3 0 14c0 9.9 14 22 14 22s14-12.1 14-22C28 6.3 21.7 0 14 0z" fill="'+color+'" stroke="#fff" stroke-width="2.2"/>'+
      '<text x="14" y="19.5" font-size="'+(String(label).length>1?11:13)+'" font-weight="700" fill="#fff" '+
      'text-anchor="middle" font-family="-apple-system,PingFang HK,sans-serif">'+String(label)+'</text></svg>';
    return { url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),
             scaledSize:new google.maps.Size(w,h), anchor:new google.maps.Point(w/2,h) };
  }
  // 手機開合地圖／視窗變化之後通知兩個地圖庫重新量尺寸
  var gKickT=null;
  function sizeMap(){
    var wrap=$('mapwrap');
    if(!wrap) return false;
    var r=wrap.getBoundingClientRect();
    return !(r.width<60 || r.height<60);
  }
  function gKick(){
    if(gKickT) clearTimeout(gKickT);
    var go=function(){
      if(gmap && window.google){ try{ google.maps.event.trigger(gmap,'resize'); }catch(e){} }
      if(map && map.invalidateSize){ try{ map.invalidateSize(); }catch(e){} }
    };
    requestAnimationFrame(go);
    gKickT=setTimeout(go, 300);
  }
  // Maps 3.66 喺呢個版面下，初始化之後有機會永遠唔貼磚（成塊白）。
  // 實測過嘅事實：另起一個 Map 實例，原本嗰個就即刻畫。
  // 所以裝個 watchdog —— 2.5 秒內冇 tilesloaded 就拆掉重建，最多兩次。
  var gTries=0;
  function gWatch(){
    if(!gmap || !window.google) return;
    var ok=false;
    google.maps.event.addListenerOnce(gmap,'tilesloaded',function(){ ok=true; });
    setTimeout(function(){
      if(ok || !gmap) return;
      if(gTries>=2){
        // 放棄 Google 底圖，自動退返 OSM —— 寧願底圖冇咁靚，都唔可以畀你睇住一塊白
        gState='fail'; gmap=null; gmarks=[]; gInfo=null;
        var e2=$('map'); if(e2) e2.innerHTML='';
        setSync('err','Google 底圖畫唔出，已改用 OpenStreetMap');
        drawMap();
        return;
      }
      gTries++;
      var el=$('map'); if(!el) return;
      gmap=null; gmarks=[]; gInfo=null; el.innerHTML='';
      drawMap();
    }, 2500);
  }

  var gTraffic=null;
  function drawGMap(pts){
    var el=$('map');
    if(!gmap){
      if(!sizeMap()){                      // 容器仲未有尺寸，下一格再嚟
        if(!drawGMap.__wait){ drawGMap.__wait=1;
          requestAnimationFrame(function(){ drawGMap.__wait=0; drawMap(); }); }
        return;
      }
      el.innerHTML='';
      gmap=new google.maps.Map(el,{
        center:{lat:22.3193,lng:114.1694}, zoom:11,
        mapTypeControl:false, streetViewControl:false, fullscreenControl:false,
        clickableIcons:false, zoomControl:true,
        gestureHandling:'greedy'
      });
      gInfo=new google.maps.InfoWindow();
      try{ gTraffic=new google.maps.TrafficLayer(); }catch(e){}
      gWatch();                            // 磚唔出就自我重建（見 gWatch 註解）
      // 建立嗰刻容器尺寸未必 settle（三欄 grid 嘅 40% 欄）。Google 量到 0 就再也唔會重畫，
      // 所以一定要主動踢佢 resize，並且用 ResizeObserver 盯住之後任何尺寸變化。
      gKick();
      try{
        var wrap=$('mapwrap');
        if(window.ResizeObserver && wrap && !wrap.__ro){
          wrap.__ro=new ResizeObserver(function(){ sizeMap(); });
          wrap.__ro.observe(wrap);
        }
      }catch(e){}
    }
    gmarks.forEach(function(m){ m.setMap(null); }); gmarks=[];
    if(!pts.length) return;
    var bounds=new google.maps.LatLngBounds(), lines={};
    pts.forEach(function(p){
      var big=hlId===p.x.id;
      var m=new google.maps.Marker({
        position:{lat:p.x.lat,lng:p.x.lng}, map:gmap,
        icon:pinIcon(p.n||'·', p.c, big), title:p.x.name, zIndex:big?999:1
      });
      m.addListener('click',function(){
        hlId=p.x.id;
        gInfo.setContent('<div style="font:14px -apple-system,PingFang HK,sans-serif;min-width:150px">'+
          '<b style="display:block;margin-bottom:3px">'+esc(p.x.name)+'</b>'+
          (p.x.rating?'<span style="color:#C9700A;font-weight:700">'+ic('star',12,'inline')+' '+(+p.x.rating).toFixed(1)+'</span> ':'')+
          (p.x.addr?'<span style="color:#6C757D;font-size:12.5px">'+esc(p.x.addr)+'</span>':'')+
          '<a href="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+p.x.lat+','+p.x.lng+
          '" target="_blank" rel="noopener" style="display:block;margin-top:6px;color:#3F52E3;font-weight:700;font-size:12.5px">導航 →</a></div>');
        gInfo.open({anchor:m, map:gmap});
        render(); scrollTo(p.x.id);
      });
      gmarks.push(m); bounds.extend(m.getPosition());
      if(p.d){ (lines[p.d]=lines[p.d]||{c:p.c,a:[]}).a.push({lat:p.x.lat,lng:p.x.lng}); }
    });
    Object.keys(lines).forEach(function(d){
      if(lines[d].a.length<2) return;
      var pl=new google.maps.Polyline({ path:lines[d].a, map:gmap, strokeColor:lines[d].c,
        strokeOpacity:0, zIndex:0,
        icons:[{ icon:{path:'M 0,-1 0,1', strokeOpacity:.9, strokeWeight:3, scale:2}, offset:'0', repeat:'12px' }] });
      gmarks.push(pl);
    });
    if(!gmap.__fit || mapDay!==gmap.__lastDay){
      if(pts.length===1 || bounds.isEmpty()){ gmap.setCenter(bounds.getCenter()); gmap.setZoom(15); }
      else gmap.fitBounds(bounds, {top:64, right:44, bottom:44, left:44});
      gmap.__fit=1; gmap.__lastDay=mapDay;
    }
    syncTraffic();
    if(myPos) meMarker();
  }

  function nomTry(name, cb){
    var d=destToken(), tries=[];
    if(d) tries.push(name+' '+d);

        if(a.length){ cb(a); return; }

  // Google 嘅 formattedAddress 有兩種語序，都要處理：
  //   A 西式（多數）："3-chōme-4-2 Hanedakūkō, Ota City, Tokyo 144-0041, Japan"
  //   B 日式（有時）："Japan, 〒163-8001 Tokyo, Shinjuku City, Nishishinjuku, 2-chōme−8−１ …, 45F"
  // 行裡面只需要知「大概喺邊區」，門牌同樓層係噪音。原本地址照留喺 state，
  // 詳情卡仍然見得到全個。
  function tidyAddr(a){
    if(!a) return '';
    var t=String(a).replace(/\s+/g,' ').trim();
    var jp=/^(Japan|日本)\s*[,、]/i.test(t) || /〒/.test(t);     // 日式語序（闊 → 窄）
    t=t.replace(/^(Japan|日本)\s*[,、]\s*/i,'')
       .replace(/[,、]?\s*(Japan|日本|Hong Kong|香港)\s*$/i,'')
       .replace(/〒?\d{3}[-−]?\d{4}/g,'');
    var seg=t.split(/\s*[,、]\s*/).map(function(x){ return x.trim(); }).filter(Boolean);
    seg=seg.filter(function(x){
      if(/\b(District|County|Prefecture)\b/i.test(x)) return false;   // 郡／県 冇資訊量
      if(/^[0-9０-９]+\s*F(?:[・･][0-9０-９]+\s*F)*$/i.test(x)) return false; // 樓層
      return true;
    });
    if(!seg.length) return '';
    var keep;
    if(jp) keep=seg.slice(1,3);                 // 跳過都道府県，取「區 + 町」
    else {
      keep=seg.slice(0,2);
      // 掉走第一截頭嗰段門牌（"3-chōme-4-2 Hanedakūkō" → "Hanedakūkō"）
      if(keep[0]){
        var c=keep[0].replace(/^(?:[0-9０-９]+\s*[-−]?\s*[Cc]h[ōo]me\s*[-−]?\s*[0-9０-９\-−]*|[0-9０-９\-−]+)\s*/,'').trim();
        if(c) keep[0]=c;
      }
    }
    keep=keep.filter(Boolean);
    return keep.length? keep.join(', ') : seg[0];
  }

    var p=[a.suburb||a.neighbourhood||a.city_district||'', a.city||a.town||a.village||a.county||'', a.country||''].filter(Boolean);
    return p.length? p.join(', ') : (r.display_name||'').split(',').slice(1,3).join(',').trim();
  }

          return ' \u00b7 <b class="'+(o.open?'popen':'pshut')+'">'+(o.open?'營業中':'休息')+'</b>'+
                 '<span class="ohint">'+esc(o.why)+(o.local?'':'（按你部機時間）')+'</span>'; })()+
       '</div></div>';

    var rows=[];
    if(x.addr) rows.push([ic('pin',17), esc(x.addr), x.lat? 'https://www.google.com/maps/search/?api=1&query='+x.lat+','+x.lng : '']);

    if(th) rows.push([ic('clock',17), esc(th)+(x.hours.length>1?' <a data-act="allhours">\u5168\u9031</a>':''), '']);

    if(x.fno) rows.push([kico(x.kind,17), esc(x.fno), '']);

    if(x.seat) rows.push([ic('check',17), '座位 '+esc(x.seat), '']);

    if(x.phone) rows.push([ic('phone',17), esc(x.phone), 'tel:'+String(x.phone).replace(/[^0-9+]/g,'')]);
    if(x.site) rows.push([ic('link',17), esc(String(x.site).replace(/^https?:\/\//,'').slice(0,42)), x.site]);
    if(x.time) rows.push([ic('clock',17), esc((k.tl?k.tl+' ':'')+x.time), '']);
    if(+x.cost) rows.push([ic('money',17), esc(fmtCcy(itemCcy(x), x.cost))+(itemCcy(x)!==cur()?' \u2248 '+esc(fmtCcy(cur(),toHome(x.cost,itemCcy(x)))):''), '']);
    if(x.note) rows.push([ic('note',17), esc(x.note), '']);
    if(rows.length){
      h+='<div class="prows">';
      rows.forEach(function(r){
        h+='<div class="prow"><em>'+r[0]+'</em>'+

      });
      h+='</div>';
    }
    if((x.files||[]).length) h+='<div class="fld" style="margin-top:14px"><label>附件</label>'+filesHTML(x,false)+'</div>';
    if(x.hours && x.hours.length>1)
      h+='<div class="phours hide" id="pAllHours">'+x.hours.map(function(l){ return '<div>'+esc(l)+'</div>'; }).join('')+'</div>';

    h+='<div class="btnrow">'+
       (x.lat? '<button class="btn acc" data-act="nav" data-id="'+x.id+'">\u5c0e\u822a</button>':'')+
       '<button class="btn ghost" data-act="edititem" data-id="'+x.id+'">\u6539</button></div>';
    if(GOOG!==false && MODE==='cloud')
      h+='<button class="btn ghost" data-act="enrich" data-id="'+x.id+'" style="margin-top:8px">'+
         (x.placeId?'\u91cd\u65b0\u651d Google \u8cc7\u6599':'\u2728 \u651d Google \u8cc7\u6599\uff08\u76f8\uff0f\u8a55\u5206\uff0f\u6642\u9593\uff09')+'</button>';
    openSheet(h);
  }
  // ⚠️ 由 gCall 返嚟嗰刻，state 可能已經被 persist() 撞版後嘅 mergeStates 整個換走，
  // 所以一定要用 id 重新拎返個 item，唔可以繼續寫落入嚟嗰個 object（會變孤兒）。
  function enrich(x, cb){
    if(!x){ if(cb) cb(false); return; }
    var xid=x.id;
    setSync('','\u6435 Google \u8cc7\u6599\u2026');
    // 已經有 placeId（例如由 Wanderlog 匯入嘅）就直接攞詳情 ——
    // 省一個 autocomplete call，而且唔會「搜返嚟係另一筆記錄」。
    if(x.placeId){ details(x.placeId); return; }
    var c=tripCentre(), body={op:'autocomplete', q:x.name};
    if(c){ body.lat=c.lat; body.lng=c.lng; }
    gCall(body,function(j,err){
      var s0=j&&j.suggestions&&j.suggestions[0];
      if(err||!s0){ setSync('err','Google \u6435\u5514\u5230\u300c'+x.name+'\u300d'); if(cb) cb(false); return; }
      details(s0.placeId);
    });
    function details(pid){
      gCall({op:'details',placeId:pid},function(d,e2){
        if(e2||!d){ setSync('err','\u651d\u5514\u5230\u8a73\u60c5'); if(cb) cb(false); return; }
        x=itemById(xid)||x;                     // state 可能已經換過，重新拎
        snap(); fillFromDetails(x,d); save(); setSync('ok','\u5df2\u88dc '+x.name);
        if(x.photoName) photoUrl(x,function(){ render(); if(cb) cb(true); });
        else if(cb) cb(true);
      });
    }
  }
  // 由「快速加」建一個指定類型嘅項目，即刻開編輯器
  function addOfKind(k){
    var t=curTrip(); if(!t) return;
    if(!KINDS[k]) k='place';
    var ds=days();
    var date = ds.length? (ds.indexOf(today())>=0? today() : ds[0]) : null;
    var lid = date? null : ((tLists()[0]||{}).id||null);
    if(!date && !lid){ ensureList(); lid=(tLists()[0]||{}).id||null; }
    snap();
    var x={ id:uid(), tripId:t.id, kind:k, listId:lid, date:date, ord:0, time:'',
            name:'', lat:null, lng:null, addr:'', note:'', cost:0, ccy:'', done:false, checks:[] };
    x.ord = nextOrd(date? dayItems(date) : listItems(lid));
    x.name = '';
    state.items.push(x); save();
    pendingNew=x.id;                       // 閂窗都未填名就清走，唔會留「新航班」呢類廢項目
    itemSheet(x);
    setTimeout(function(){ try{ $('eName').focus(); }catch(er){} }, 90);
  }
  // 未命名嘅新項目：離開編輯器就清走
  var pendingNew=null;
  function dropPendingNew(){
    if(!pendingNew) return;
    var id=pendingNew; pendingNew=null;
    var x=itemById(id); if(!x) return;
    if(!String(x.name||'').trim() && !x.time && !+x.cost && !String(x.note||'').trim() && !x.lat){
      rmv(id);
      state.items=state.items.filter(function(z){ return z.id!==id; });
      save();
    }
  }
  function tripSheet(t){
    var isNew=!t; t=t||{id:null,name:'',dest:'',start:today(),end:shift(today(),4),cur:'HKD'};
    openSheet('<h3>'+(isNew?'開新旅程':'改旅程')+'</h3>'+
      '<div class="fld"><label>旅程名</label><input class="inp" id="tName" value="'+esc(t.name)+'" placeholder="例：京都秋楓"></div>'+
      '<div class="fld"><label>目的地</label><input class="inp" id="tDest" value="'+esc(t.dest||'')+'" placeholder="Kyoto, Japan"></div>'+
      '<div class="two"><div class="fld"><label>出發</label><input class="inp" id="tStart" type="date" value="'+esc(t.start||'')+'"></div>'+
      '<div class="fld"><label>返程</label><input class="inp" id="tEnd" type="date" value="'+esc(t.end||'')+'"></div></div>'+
      '<div class="fld"><label>貨幣</label><input class="inp" id="tCur" value="'+esc(t.cur||'HKD')+'"></div>'+
      '<button class="btn acc" data-act="savetrip" data-id="'+(t.id||'')+'">儲存</button>'+
      (isNew?'':'<button class="btn warn" data-act="deltrip" data-id="'+t.id+'" style="margin-top:8px">刪咗成個旅程</button>'));
  }
  // ==================== GPS ＋「而家」卡（乘客版）====================
  // 設計前提：車上有第二個人。呢一版係俾乘客睇同讀出嚟嘅 —— 大字、少撳、
  // 一版講一件事。司機唔應該睇手機。
  var myPos=null, gpsWatch=null, gpsErr='', nowTimer=null, gMe=null;

  function gpsOn(){ return gpsWatch!==null; }
  function gpsStart(cb){
    if(!navigator.geolocation){ gpsErr='呢部機唔支援定位'; if(cb) cb(false); return; }
    if(gpsWatch!==null){ if(cb) cb(true); return; }
    gpsErr='';
    gpsWatch=navigator.geolocation.watchPosition(function(pos){
      myPos={ lat:pos.coords.latitude, lng:pos.coords.longitude,
              acc:pos.coords.accuracy, at:Date.now() };
      gpsErr='';
      if($('pan').__now) nowRender();
      if(gmap) meMarker();
      if(cb){ var f=cb; cb=null; f(true); }
    }, function(e){
      gpsErr = e.code===1? '你拒絕咗定位權限（Safari 設定 → 位置）'
             : (e.code===3? '攞唔到位置（訊號弱）' : '定位出錯');
      if($('pan').__now) nowRender();
      if(cb){ var f2=cb; cb=null; f2(false); }
    }, {enableHighAccuracy:true, maximumAge:15000, timeout:20000});
  }
  function gpsStop(){
    if(gpsWatch!==null){ try{ navigator.geolocation.clearWatch(gpsWatch); }catch(e){} gpsWatch=null; }
    myPos=null;
    if(gMe){ try{ gMe.setMap(null); }catch(e){} gMe=null; }
  }
  function meMarker(){
    if(!gmap || !myPos || !window.google) return;
    var p={lat:myPos.lat,lng:myPos.lng};
    if(gMe){ gMe.setPosition(p); return; }
    try{
      gMe=new google.maps.Marker({map:gmap, position:p, zIndex:9999, title:'我而家',
        icon:{ path:google.maps.SymbolPath.CIRCLE, scale:7,
               fillColor:'#1A73E8', fillOpacity:1, strokeColor:'#fff', strokeWeight:3 }});
    }catch(e){}
  }

  // ── 現場天氣（Open-Meteo，免 key）：12 月北海道停你嘅唔係塞車，係雪同視界 ──
  var liveWxData=null, liveWxAt=0, liveWxBusy=false;
  var liveWxNA='';
  function liveWx(cb){
    if(!myPos){ liveWxNA='冇位置'; later(cb,null); return; }
    if(liveWxData && (Date.now()-liveWxAt)<10*60*1000){ later(cb,liveWxData); return; }
    if(liveWxBusy) return;                                            // 打緊，等佢返
    liveWxBusy=true;
    var u='https://api.open-meteo.com/v1/forecast?latitude='+myPos.lat.toFixed(3)+
      '&longitude='+myPos.lng.toFixed(3)+
      '&current=temperature_2m,snowfall,precipitation,weather_code,wind_gusts_10m,visibility&timezone=auto';
    fetch(u).then(function(r){ return r.ok? r.json():null; }).then(function(j){
      liveWxBusy=false;
      if(j&&j.current){ liveWxData=j.current; liveWxAt=Date.now(); liveWxNA=''; }
      else liveWxNA='攞唔到現場天氣';
      later(cb,liveWxData);
    }).catch(function(){ liveWxBusy=false; liveWxNA='攞唔到現場天氣（冇網？）'; later(cb,null); });
  }
  // 一句人話。視界同陣風先講 —— 嗰兩樣係決定「行唔行得」嘅嘢，唔係氣溫。
  function liveWxLine(){
    var c=liveWxData; if(!c) return '';
    var bits=[];
    if(c.visibility!=null){
      var v=+c.visibility;
      var vs = v<1000? Math.round(v)+'m' : (v/1000).toFixed(v<10000?1:0)+'km';
      bits.push((v<1000?'⚠ ':'')+'視界 '+vs);
    }
    if(+c.snowfall>0) bits.push('落雪 '+(+c.snowfall).toFixed(1)+'cm/h');
    else if(+c.precipitation>0) bits.push('落雨 '+(+c.precipitation).toFixed(1)+'mm/h');
    if(c.wind_gusts_10m!=null){
      var g=+c.wind_gusts_10m;
      bits.push((g>=60?'⚠ ':'')+'陣風 '+Math.round(g)+'km/h');
    }
    if(c.temperature_2m!=null) bits.push(Math.round(c.temperature_2m)+'°C');
    return bits.join(' · ');
  }

  // ── 下一站：今日未打勾、有座標、排得最前嗰個 ──
  function nextStop(){
    var t=curTrip(); if(!t) return null;
    var ds=days(), td=today();
    if(ds.indexOf(td)<0) return null;                 // 唔喺行程期間就冇「下一站」
    var arr=dayItems(td).filter(function(x){ return !x.done && kd(x.kind).geo && x.lat!=null; });
    return arr.length? {x:arr[0], d:td, left:arr.length} : null;
  }

  // ── 由 GPS 去下一站嘅真實車程（計埋即時路況）──
  // 呢個係唯一會開 traffic:true 嘅地方（Routes Pro SKU，每月 5,000 次免費）。
  // 一分鐘內唔重複打，所以一日用幾十個 call，離免費額好遠。
  var nowEta=null, nowEtaBusy=false, nowEtaFor='', nowEtaNA='';
  function later(cb,v){ if(cb) setTimeout(function(){ cb(v); },0); }   // 一定要 async，
                                                                      // 唔係 nowRender 會自己叫自己
  function fetchEta(x, cb){
    if(!myPos || !x || x.lat==null){ nowEtaNA='冇位置，計唔到車程'; later(cb,null); return; }
    var key=x.id+'|'+myPos.lat.toFixed(3)+','+myPos.lng.toFixed(3);
    if(nowEta && nowEtaFor===key && (Date.now()-nowEta.at)<60*1000){ later(cb,nowEta); return; }
    if(nowEtaBusy) return;                                            // 已經打緊，等佢返
    if(MODE!=='cloud'){ nowEtaNA='本機模式計唔到車程（要雲端同步）'; later(cb,null); return; }
    if(GOOG===false){ nowEtaNA='Google 未接通，計唔到車程'; later(cb,null); return; }
    nowEtaNA='';
    nowEtaBusy=true;
    gCall({op:'route', mode:'DRIVE', traffic:true,
           points:[{lat:myPos.lat,lng:myPos.lng},{lat:x.lat,lng:x.lng}]},
      function(j,err){
        nowEtaBusy=false;
        if(err||!j||!j.totalSec){
          nowEtaFor=''; nowEtaNA='攞唔到車程'+(err?'（'+String(err).slice(0,40)+'）':'');
          later(cb,null); return;
        }
        nowEta={ sec:j.totalSec, m:j.totalM, traffic:!!j.traffic, at:Date.now() };
        nowEtaFor=key; nowEtaNA='';
        later(cb,nowEta);
      });
  }

  function hhmm(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
  function minsTxt(sec){
    var m=Math.max(1,Math.round(sec/60));
    return m>=60? Math.floor(m/60)+' 小時'+(m%60? ' '+(m%60)+' 分':'') : m+' 分鐘';
  }
  // 當地時間（用當日天氣記錄嘅時區，冇就用經度估 —— 部機時區喺旅行時係錯嘅）
  function localNow(d, lng){
    var w=d? wxGet(d) : null;
    var tz = (w&&w.tz!=null)? w.tz : (lng!=null? lngTz(lng) : null);
    var n=new Date();
    if(tz==null) return n;
    return atTz(n, tz);
  }

  function nowSheet(){
    openSheet('<div id="nowBox" class="nowwrap"></div>');
    $('pan').__now=1;
    nowRender();
    if(!gpsOn()) gpsStart(function(){ nowRender(); });
    if(nowTimer) clearInterval(nowTimer);
    nowTimer=setInterval(function(){
      if($('pan').__now) nowRender();
      else { clearInterval(nowTimer); nowTimer=null; }
    }, 30000);
  }

  function nowRender(){
    var box=$('nowBox'); if(!box) return;
    var t=curTrip();
    var h='';
    if(!t){ box.innerHTML='<div class="empty">仲未有旅程</div>'; return; }

    var ns=nextStop();
    var td=today(), inTrip=days().indexOf(td)>=0;
    var d = inTrip? td : null;
    var pt = ns? {lat:ns.x.lat,lng:ns.x.lng} : (d? dayPt(d) : tripCentre());
    var lnow = localNow(d, myPos? myPos.lng : (pt? pt.lng : null));

    // 天黑（當日、當地）
    var setTxt='', setMin=null;
    if(d && pt){
      var w=wxGet(d);
      var st = (w&&w.set)? w.set
             : (function(){ var q=sunTimes(pt.lat,pt.lng,d,(w&&w.tz!=null)?w.tz:null); return q&&q.set; })();
      if(st){ setTxt=st; var sp=st.split(':'); setMin=(+sp[0])*60+(+sp[1]); }
    }

    h+='<div class="nowtime">'+hhmm(lnow)+'<span>當地時間</span></div>';

    if(!inTrip){
      h+='<div class="empty" style="margin:16px 0">今日唔喺行程日期範圍內<br>'+
         (t.start? md(t.start)+'–'+md(t.end) : '未定日期')+'</div>';
    } else if(!ns){
      h+='<div class="nowbig">今日冇未完成嘅安排</div>'+
         '<div class="nowsub">'+longD(d)+(setTxt? ' · '+setTxt+' 天黑':'')+'</div>';
    } else {
      var x=ns.x;
      h+='<div class="nowlbl">下一站'+(ns.left>1? '（今日仲有 '+ns.left+' 個）':'')+'</div>';
      h+='<div class="nowbig">'+kico(x.kind,24,'inline')+' '+esc(x.name)+'</div>';
      if(x.addr) h+='<div class="nowsub">'+esc(x.addr)+'</div>';

      var e=(nowEta && nowEtaFor.indexOf(x.id+'|')===0)? nowEta : null;
      if(!myPos){
        h+='<div class="nowrow warn">'+(gpsErr||'<span class="spin"></span>攞緊你嘅位置…')+'</div>';
      } else if(!e){
        if(nowEtaNA){
          h+='<div class="nowrow warn">'+esc(nowEtaNA)+
             '<a href="#" data-act="etaretry" style="margin-left:8px">再試</a></div>';
        } else {
          h+='<div class="nowrow"><span class="spin"></span>計緊車程…</div>';
          fetchEta(x, function(){ nowRender(); });
        }
      } else {
        var eta=new Date(lnow.getTime()+e.sec*1000);
        var etaMin=eta.getHours()*60+eta.getMinutes();
        h+='<div class="nowrow big">'+ic('car',20,'inline')+' 開 '+minsTxt(e.sec)+
           ' · '+(e.m/1000).toFixed(e.m<10000?1:0)+'km'+
           (e.traffic? '<em>計埋即時路況</em>':'')+'</div>';
        h+='<div class="nowrow big">'+ic('clock',20,'inline')+' '+hhmm(eta)+' 到'+
           (setMin!=null? '<em class="'+(etaMin>setMin?'bad':'')+'">'+
              (etaMin>setMin? '天黑後 '+minsTxt((etaMin-setMin)*60)
                            : '天黑前 '+minsTxt((setMin-etaMin)*60))+'</em>' : '')+'</div>';

        // 到嗰陣仲開唔開門 —— 用推算到達時間去驗，唔係等你手打時間
        var H=dayHours(x, d);
        if(H){
          if(H.closed) h+='<div class="nowrow warn">'+ic('clock',18,'inline')+' 星期'+dow(d)+'休息</div>';
          else if(H.all) h+='<div class="nowrow ok">'+ic('clock',18,'inline')+' 24 小時營業</div>';
          else if(H.spans){
            var openAt=H.spans.some(function(sp){ return etaMin>=sp[0] && etaMin<=sp[1]; });
            var last=H.spans[H.spans.length-1];
            if(openAt) h+='<div class="nowrow ok">'+ic('clock',18,'inline')+' 到嗰陣開門 · '+minHM(last[1])+' 關</div>';
            else h+='<div class="nowrow warn">'+ic('clock',18,'inline')+' ⚠ '+hhmm(eta)+' 到，但當日營業 '+
                    esc(H.spans.map(function(sp){ return minHM(sp[0])+'–'+minHM(sp[1]); }).join('、'))+'</div>';
          }
        }
      }
      if(setTxt) h+='<div class="nowrow">'+ic('spark',18,'inline')+' '+setTxt+' 天黑</div>';
      if(x.conf) h+='<div class="nowrow">'+ic('check',18,'inline')+' '+esc(bkLab(x.kind).conf[0])+' '+esc(x.conf)+'</div>';
      if(x.phone) h+='<div class="nowrow"><a href="tel:'+esc(String(x.phone).replace(/[^0-9+]/g,''))+'">'+
                     ic('phone',18,'inline')+' '+esc(x.phone)+'</a></div>';
    }

    if(myPos){
      var lw=liveWxLine();
      if(lw) h+='<div class="nowwx">'+esc(lw)+'</div>';
      else if(liveWxNA) h+='<div class="nowwx" style="color:var(--muted)">'+esc(liveWxNA)+'</div>';
      else { h+='<div class="nowwx"><span class="spin"></span>攞現場天氣…</div>'; liveWx(function(){ nowRender(); }); }
    }

    h+='<div class="nowbtns">';
    if(ns) h+='<button class="btn acc" data-act="nav" data-id="'+ns.x.id+'">'+ic('route',16,'inline')+' 導航去呢站</button>';
    if(ns) h+='<button class="btn ghost" data-act="tick" data-id="'+ns.x.id+'">到咗 ✓</button>';
    h+='<a class="btn ghost" href="https://northern-road.ceri.go.jp/navi/touge/sp/location.htm" target="_blank" rel="noopener">'+
       ic('map',16,'inline')+' 官方吹雪視界（北の道ナビ）</a>';
    h+='<a class="btn ghost" href="https://northern-road.ceri.go.jp/navi/touge/sp/stop.htm" target="_blank" rel="noopener">'+
       ic('x',16,'inline')+' 官方通行止め情報</a>';
    h+='</div>';
    h+='<div class="hint">吹雪同封路係開去政府官方頁。App 唔會自己 cache 或者代你判斷 —— '+
       '一個靜咗嘅 feed 顯示「通行可」會害死人。</div>';
    if(myPos){
      var upd=localNow(d, myPos.lng);                    // 同上面個鐘同一個時區，唔好兩個並排

  // ---------- .ics：入 iPhone 行事曆 ----------
  // 用 floating local time（唔加 Z、唔加 TZID）—— 旅行嗰陣你想見到當地牆上時間，
  // 唔係換算成香港時間。大部分行事曆都照當地時間顯示。
  function icsEsc(v){ return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/[;,]/g,function(c){return '\\'+c;}).replace(/\r?\n/g,'\\n'); }
  function icsFold(l){                       // RFC 5545：一行最多 75 octet
    // 一定要按字元邊界折，唔可以直接切 byte —— 切爛一個中文字就成份 .ics 廢咗
    var chars = Array.from? Array.from(l) : l.split('');
    var lines=[], cur='', n=0, lim=73;       // 留位俾續行開頭嗰個空格
    chars.forEach(function(ch){
      var b=unescape(encodeURIComponent(ch)).length;
      if(n+b>lim){ lines.push(cur); cur=''; n=1; }
      cur+=ch; n+=b;
    });
    lines.push(cur);
    return lines.join('\r\n ');
  }
  function icsOut(){
    var t=curTrip(); if(!t) return '';
    var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//eva-trip//'+APP_VER+'//EN','CALSCALE:GREGORIAN',
           'X-WR-CALNAME:'+icsEsc(t.name||'旅程')];
    var st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
    var n=0;
    days().forEach(function(d){
      dayItems(d).forEach(function(x){
        var bits=[];
        var Lb=bkLab(x.kind);
        if(x.fno)  bits.push(Lb.fno[0]+'：'+x.fno);
        if(x.conf) bits.push(Lb.conf[0]+'：'+x.conf);
        if(x.seat) bits.push(Lb.seat[0]+'：'+x.seat);
        if(x.term) bits.push(Lb.term[0]+'：'+x.term);
        if(x.phone) bits.push('電話：'+x.phone);
        if(+x.cost) bits.push('使費：'+fmtCcy(itemCcy(x), x.cost));
        if(x.note) bits.push(x.note);
        if(x.site) bits.push(x.site);
        L.push('BEGIN:VEVENT');
        L.push('UID:'+x.id+'@eva-trip');
        L.push('DTSTAMP:'+st);
        var dz=d.replace(/-/g,'');
        if(x.time){
          var pp=x.time.split(':'), h=+pp[0], mi=+(pp[1]||0);
          var dur = (x.kind==='flight')? 150 : (x.kind==='eat'? 90 : (x.kind==='stay'? 30 : 75));
          var e=h*60+mi+dur, eh=Math.floor(e/60), ed=dz;
          if(eh>=24){ eh-=24; ed=shift(d,1).replace(/-/g,''); }
          L.push('DTSTART:'+dz+'T'+pad(h)+pad(mi)+'00');
          L.push('DTEND:'+ed+'T'+pad(eh)+pad(e%60)+'00');
        } else {
          L.push('DTSTART;VALUE=DATE:'+dz);
          L.push('DTEND;VALUE=DATE:'+shift(d,1).replace(/-/g,''));
        }
        L.push('SUMMARY:'+icsEsc((kd(x.kind).tl? kd(x.kind).tl+' ' : '')+x.name));
        if(x.addr) L.push('LOCATION:'+icsEsc(x.addr));
        if(bits.length) L.push('DESCRIPTION:'+icsEsc(bits.join('\n')));
        if(x.lat) L.push('GEO:'+(+x.lat).toFixed(6)+';'+(+x.lng).toFixed(6));
        L.push('END:VEVENT');
        n++;
      });
    });
    L.push('END:VCALENDAR');
    icsOut.n=n;
    return L.map(icsFold).join('\r\n')+'\r\n';
  }

  function moveDay(d, n){
    var ds=days(), i=ds.indexOf(d), j=i+n;

    if(j<0||j>=ds.length) return '出咗旅程範圍，先改返出發／返程日';
    var from=dayItems(d), to=ds[j];

    var there=dayItems(to).length;
    // 推去一個已經有安排嘅日子 = 兩日合併，唔好靜靜雞做
    if(there && !confirm('第'+(j+1)+'日（'+md(to)+'）本來已經有 '+there+' 個項目。\n'+
       '推過去會兩日合埋一齊（'+(there+from.length)+' 個）。繼續？')) return '';
    snap();
    var base=nextOrd(dayItems(to));
    from.forEach(function(x,k){ x.date=to; x.ord=base+k*10; });
    save();
    return '';

  // ---------- 附件離線預載 ----------
  // 出發前喺 wifi 撳一次，登機證／確認信就唔靠訊號。存喺瀏覽器 Cache，
  // 淨係呢部機睇得到；擺低嘅係未加密嘅檔案本體，同任何離線 app 一樣。
  var ATTC='trip-att';
  function tripFiles(){
    var out=[];
    tItems().forEach(function(x){ (x.files||[]).forEach(function(f){ out.push({x:x,f:f}); }); });
    return out;
  }
  function precacheFiles(){
    if(!window.caches){ alert('呢個瀏覽器唔支援離線儲存'); return; }
    var all=tripFiles();
    if(!all.length){ alert('呢個旅程冇附件'); return; }
    var ok=0, fail=0;
    setSync('','預載附件…0/'+all.length);
    caches.open(ATTC).then(function(c){
      (function go(i){
        if(i>=all.length){
          setSync(fail?'err':'ok', fail? ('預載完，'+ok+' 成功 '+fail+' 失敗') : ('已預載 '+ok+' 個附件'));
          if($('pan').innerHTML) offlineSheet();
          return;
        }
        setSync('','預載附件…'+(i+1)+'/'+all.length);
        var u=stUrl(all[i].f.p);
        fetch(u,{headers:stHdr()}).then(function(r){
          if(!r.ok) throw 0;
          return r.blob().then(function(b){
            return c.put(u, new Response(b,{headers:{'Content-Type':all[i].f.t||'application/octet-stream'}}));
          });
        }).then(function(){ ok++; go(i+1); }).catch(function(){ fail++; go(i+1); });
      })(0);
    });
  }
  function clearPrecache(){
    if(!window.caches) return;
    caches.delete(ATTC).then(function(){ setSync('ok','已清走離線附件'); offlineSheet(); });
  }
  function offlineSheet(){
    var all=tripFiles();
    var h='<h3>離線準備</h3>'+
      '<div class="hint" style="margin-bottom:14px">出門前喺 wifi 做一次。之後冇訊號都開得到登機證同確認信。</div>';
    if(!window.caches){

    } else if(!all.length){
      h+='<div class="empty">呢個旅程仲未有附件<br>去項目度加機票／酒店確認信先</div>';
    } else {

         '<button class="btn acc" data-act="precache">預載全部（'+all.length+' 個）</button>'+

         '<div class="hint">離線檔案係未加密咁擺喺瀏覽器度，同任何離線 app 一樣。唔想留喺部機就清走佢。</div>';
    }

    openSheet(h);
    if(window.caches && all.length) caches.open(ATTC).then(function(c){
      var n=0;
      (function go(i){
        if(i>=all.length){ var e=$('offN'); if(e) e.textContent=all.length+' 個 · 已離線 '+n+' 個'; return; }

        '<div class="btnrow"><button class="btn acc" data-act="savegmk">儲存 key</button>'+
        (mapKey()?'<button class="btn ghost" data-act="clrgmk">清走，用返 OSM</button>':'')+'</div>'+

        '<div class="fld" style="margin-top:16px"><label>定位（GPS）</label>'+
        '<div class="inp" style="background:var(--soft2)">'+(gpsOn()? '✅ 開住 · 精度 ±'+(myPos?Math.round(myPos.acc)+'m':'攞緊') : (gpsErr? '⚠️ '+esc(gpsErr) : '－ 未開'))+'</div>'+
        '<div class="hint">「而家」卡會自動開。位置<b>只留喺你部機</b>，唔會存入雲端、唔會傳去第三方；'+
        '淨係用嚟計「由你而家去下一站幾遠」同「現場天氣」。</div></div>'+
        '<div class="btnrow"><button class="btn ghost" data-act="gpsoff">熄咗定位</button></div>'+
        '<button class="btn ghost" data-act="offline" style="margin-top:18px">'+ic('note',15,'inline')+' 離線準備（預載附件）</button>'+
        '<button class="btn ghost" data-act="enrichall" style="margin-top:8px">'+ic('spark',15,'inline')+' 補齊未有 Google 資料嘅地點</button>'+
        '<button class="btn ghost" data-act="enrichall" data-all="1" style="margin-top:8px">'+ic('spark',15,'inline')+' 全部重新攝一次（'+tItems().filter(function(z){return kd(z.kind).geo;}).length+' 個）</button>'+
        '<div class="hint">加咗新欄位（例如當地時區）之後，舊項目要重攝一次才有。每個地點大約兩個 Google call。</div>'+
        '<button class="btn ghost" data-act="exJson" style="margin-top:8px">匯出備份</button>'+
        (MODE==='cloud'?'<button class="btn warn" data-act="logout" style="margin-top:8px">登出</button>':''));
    }
    else if(act==='savegmk'){
      var v=($('gmk').value||'').trim();
      if(!v){ alert('冇貼嘢'); return; }
      if(v.length<20){ alert('唔似係一條 key'); return; }
      snap(); state.settings.gmapKey=v; save(); closeSheet();
      gState='off'; if(map){ try{ map.remove(); }catch(e){} map=null; markers=[]; }
      setSync('','載 Google 地圖…'); drawMap();
    }
    else if(act==='clrgmk'){
      snap(); delete state.settings.gmapKey; save(); closeSheet();
      gState='off'; gmap=null; gmarks=[]; drawMap();
    }
    else if(act==='logout'){ try{ localStorage.removeItem('tripKey'); localStorage.removeItem('tripCache'); }catch(e){} location.reload(); }
  });

  document.addEventListener('input',function(e){
    if(e.target.id==='aiText'){ e.target.style.height='auto'; e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'; }
  });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) refreshIfChanged(); });
  setInterval(refreshIfChanged,45000);
  addEventListener('resize',gKick);
  addEventListener('orientationchange',gKick);
  addEventListener('online',function(){ setNet(); refreshIfChanged(); });
  addEventListener('offline',setNet);
  setNet();
  if('serviceWorker' in navigator) addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
  (function(){
    var set=function(id,n2,sz){ var e=$(id); if(e) e.innerHTML=ic(n2,sz); };
    set('brandIc','compass',18); set('aiIc','spark',17); set('mapIc','map',16); set('aiHeadIc','spark',16);
    var u=$('bUndo'), r=$('bRedo'), hb=$('hamb'), sc=document.querySelector('.sideclose');
    if(u) u.innerHTML=ic('undo',17); if(r) r.innerHTML=ic('redo',17);
    if(hb) hb.innerHTML='<svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>';
    if(sc) sc.innerHTML=ic('x',16);
  })();
  boot();
})();
</script>
</body>
</html>
