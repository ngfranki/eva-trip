<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>旅程記錄</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅程記錄">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* 色系、字體、間距全部由 Wanderlog 實測抽返嚟（2026-09-14）：
     白底 #FFF、文字 #212529、次要 #6C757D/#ADB5BD、分隔線 #DEE2E6、
     主色珊瑚紅 #F75940、連結藍 #3F52E3、PRO 金 #EC9B3B、側欄 188px 白底 */
  :root{
    --bg:#FFFFFF; --surf:#FFFFFF; --card:#FFFFFF;
    --soft:#F1F3F5; --soft2:#F8F9FA;
    --line:#DEE2E6; --line2:#E9ECEF;
    --ink:#212529; --ink2:#495057; --muted:#6C757D; --muted2:#ADB5BD;
    --acc:#F75940; --acc-d:#E44A32; --acc-soft:#FDEAE6;
    --link:#3F52E3; --link-soft:#EDEFFE;
    --pro:#EC9B3B; --ok:#2F9E68; --warn:#E03131;
    --d1:#4C6EF5; --d2:#12B886; --d3:#40C057; --d4:#FD7E14; --d5:#FA5252; --d6:#7950F2; --d7:#1098AD;
    --sh:0 1px 2px rgba(33,37,41,.06);
    --sh2:0 4px 14px rgba(33,37,41,.10), 0 1px 3px rgba(33,37,41,.08);
    --side:188px; --mapw:40%;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181C; --surf:#1B1E23; --card:#22262C;
      --soft:#262A31; --soft2:#1F2328;
      --line:#343A41; --line2:#2B3037;
      --ink:#E9ECEF; --ink2:#CED4DA; --muted:#9AA2AB; --muted2:#767E87;
      --acc:#FF6B4F; --acc-d:#F75940; --acc-soft:#3A241E;
      --link:#7C8CFF; --link-soft:#232840;
      --sh:0 1px 2px rgba(0,0,0,.4);
      --sh2:0 4px 14px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink);
    overflow-x:hidden; overscroll-behavior-x:none}
  body{font-family:"Source Sans 3","Source Sans Pro","PingFang HK",-apple-system,"Helvetica Neue",sans-serif;
       font-size:16px; line-height:1.45; overflow:hidden; -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer; border:0; background:none; padding:0; color:inherit}
  input,textarea{background:none; border:0; outline:none}
  .num{font-variant-numeric:tabular-nums}
  .ico{display:block; flex:0 0 auto}
  .ico.inline{display:inline-block; vertical-align:-3px}
  .idx.kico{color:#fff}
  .idx.kico .ico{margin:0}
  .kin{display:inline-flex; align-items:center; margin-right:5px; color:var(--muted); vertical-align:-2px}
  .akic{display:flex; align-items:center; color:var(--muted2); flex:0 0 auto}
  .addbar .fi:focus-within .akic{color:var(--acc)}
  .kinds button .ico,.bkrow button .ico{margin:0 auto}
  .sug .sic{display:flex; align-items:center; justify-content:center; color:var(--muted)}
  .klbl{display:inline-flex; align-items:center; gap:6px; color:var(--ink2)}
  .exp .ic{color:var(--muted)}
  .sech .chev,.sgrp h4 .ico{opacity:.55}
  .sgrp h4{gap:5px}
  .brand span{display:flex; align-items:center; color:var(--acc)}
  .aibtn em{display:flex; align-items:center}
  .leg em{display:flex; align-items:center; color:var(--muted2)}
  .prow em{display:flex; align-items:center; justify-content:center; color:var(--muted); padding-top:1px}
  .pmeta .ico.inline{color:var(--muted)}
  .prate .ico,.chip.rate .ico{color:inherit}
  .tbtn .ico{margin:0}
  .btn .ico.inline,.menu button .ico.inline{margin-right:5px; vertical-align:-3px}
  .hide{display:none !important}
  ::-webkit-scrollbar{width:9px; height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px; border:2px solid transparent; background-clip:content-box}

  /* ============ shell ============ */
  .shell{display:grid; grid-template-columns:var(--side) minmax(0,1fr) var(--mapw); height:100dvh}
  .side{background:var(--surf); border-right:1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto; padding-bottom:10px}
  .doc{overflow-y:auto; overflow-x:hidden; background:var(--bg); touch-action:pan-y; overscroll-behavior-x:none}
  .mapwrap{position:relative; height:100%; min-height:0; background:var(--soft)}
  #map{position:absolute; inset:0; z-index:1}

  /* ============ sidebar ============ */
  .brand{display:flex; align-items:center; gap:7px; padding:13px 14px 11px; font-weight:700; font-size:15px; letter-spacing:-.02em}
  .brand em{font-style:normal; font-size:18px}
  .aibtn{display:flex; align-items:center; gap:9px; width:100%; padding:13px 16px; margin:0 0 10px;
         background:linear-gradient(90deg,#F7714A 0%,#EE5A8C 55%,#B455C8 100%); color:#fff; font-weight:700; font-size:15px}
  .aibtn em{font-style:normal; font-size:16px}
  .sgrp{padding:0 8px 4px}
  .sgrp h4{display:flex; align-items:center; gap:6px; margin:6px 0 3px; padding:8px 10px; border-radius:7px;
           background:var(--ink); color:var(--surf); font-size:14.5px; font-weight:700; letter-spacing:-.01em}
  .sgrp h4 i{font-style:normal; font-size:10px; opacity:.75}
  .side nav button{display:block; width:100%; text-align:left; padding:6px 10px; border-radius:6px; font-size:14px;
                   color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .side nav button:hover{background:var(--soft)}
  .side nav button.on{background:var(--soft); font-weight:700}
  .side nav button i{font-style:normal; display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:-1px;
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sfoot{margin-top:auto; padding:10px 16px 0; font-size:11px; color:var(--muted2)}
  .sfoot button{color:var(--muted); font-size:13px; display:block; padding:4px 0}

  /* ============ topbar ============ */
  .top{position:sticky; top:0; z-index:12; background:var(--surf); border-bottom:1px solid var(--line);
       display:flex; align-items:center; gap:6px; padding:9px 16px}
  .top{overflow:hidden}
  .top .sync{font-size:12px; color:var(--muted); margin-right:auto; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; min-width:0}
  .tbtn{flex:0 0 auto}
  .top .sync.err{color:var(--warn)}
  .tbtn{display:flex; align-items:center; gap:5px; padding:6px 13px; border-radius:99px; font-size:14px; font-weight:600; color:var(--ink2)}
  .tbtn:hover{background:var(--soft)}
  .tbtn:disabled{opacity:.3; background:none}
  .tbtn.solid{background:var(--ink); color:var(--surf)}
  .tbtn.solid:hover{background:#000}
  .tbtn.acc{background:var(--acc); color:#fff; font-weight:700}
  .tbtn.acc:hover{background:var(--acc-d)}
  .tbtn.line{border:1px solid var(--line)}
  .mapbtn{display:none}

  /* ============ doc ============ */
  .page{max-width:660px; margin:0 auto; padding:0 20px 150px}
  .hero{position:relative; height:200px; margin:0 -20px;
        background:linear-gradient(160deg,#9DB4CE,#7E9E9A 40%,#C2A87E)}
  .hero.hasph{background-size:cover; background-position:center 42%; background-repeat:no-repeat}
  .hero::after{content:""; position:absolute; inset:0;
        background:linear-gradient(180deg,rgba(0,0,0,.10) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,.30) 100%)}
  .herocard{position:relative; z-index:2; margin:-72px 0 26px; background:var(--card); border-radius:10px; box-shadow:var(--sh2); padding:20px 22px}
  .herocard h1{margin:0; font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1.1}
  .herocard .sub{display:flex; align-items:center; gap:6px; margin-top:9px; font-size:14px; color:var(--muted); font-weight:600}
  .hstats{display:flex; gap:22px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
  .hstats div b{display:block; font-size:20px; font-weight:700; line-height:1.15; letter-spacing:-.02em}
  .hstats div span{font-size:12px; color:var(--muted)}
  .hedit{position:absolute; top:16px; right:0; z-index:3}

  .sec{margin:0 0 30px; scroll-margin-top:62px}
  .sech{display:flex; align-items:center; gap:8px; margin:0 0 12px}
  .sech .chev{color:var(--muted); font-size:11px}
  .sech h2{margin:0; font-size:24px; font-weight:700; letter-spacing:-.03em}
  .sech .n{font-size:13px; color:var(--muted); font-weight:600}
  .sech .sp{flex:1}
  .panel{padding:0}
  .panel.pad{background:var(--soft); border-radius:16px; padding:16px}
  .sech h2{font-size:22px}
  .sech.big h2{font-size:32px}
  .pill{background:var(--line2); color:var(--ink2); border-radius:24px; padding:7px 16px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:6px}
  .pill:hover{background:var(--line)}
  .pill.acc{background:var(--acc); color:#fff; font-weight:700}
  .pill.acc:hover{background:var(--acc-d)}
  .pill.bare{background:none; border-radius:20px; color:var(--muted); font-size:13.5px; padding:6px 12px}
  .pill.bare:hover{background:var(--soft)}

  /* 概覽兩格卡 */
  .twoup{display:flex; gap:16px; margin-bottom:26px; flex-wrap:wrap}
  .bkcard{flex:2 1 330px; background:var(--soft); border-radius:16px; padding:16px}
  .sumcard{flex:1 1 170px; background:var(--soft); border-radius:16px; padding:16px}
  .cardlbl{font-size:16px; font-weight:700; display:block; margin-bottom:8px}
  .bkrow{display:flex; gap:0; flex-wrap:wrap}
  .bkrow button{width:58px; display:flex; flex-direction:column; align-items:center; gap:1px; padding:2px 0}
  .bkrow button b{font-size:13px; font-weight:700; height:16px; color:var(--ink)}
  .bkrow button em{font-style:normal; font-size:17px}
  .bkrow button span{font-size:11.5px; color:var(--muted)}
  .bkrow button:hover em{transform:scale(1.14)}
  .bigno{font-size:24px; font-weight:400; color:var(--muted); letter-spacing:-.02em; line-height:1.2}
  .sumcard a{display:block; margin-top:8px; font-size:13.5px; color:var(--link); font-weight:700; cursor:pointer}

  /* 附件 */
  .files{display:flex; flex-direction:column; gap:6px}
  .fitem{display:flex; align-items:center; gap:8px; background:var(--soft); border-radius:9px; padding:8px 10px}
  .fitem .fic{display:flex; color:var(--muted); flex:0 0 auto}
  .fitem .fn{flex:1; min-width:0; text-align:left; font-size:13.5px; font-weight:600; color:var(--link);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .fitem .fsz{font-size:11.5px; color:var(--muted); flex:0 0 auto}
  .fadd{display:flex; align-items:center; gap:7px; padding:9px 11px; border:1px dashed var(--line);
    border-radius:9px; font-size:13px; color:var(--muted); cursor:pointer}
  .fadd:hover{border-color:var(--acc); color:var(--acc)}
  .chip.file{background:var(--soft2); color:var(--ink2); border:1px solid var(--line)}

  /* 探索卡（照 Wanderlog 橫向相片卡）*/
  .excards{display:flex; gap:12px; overflow-x:auto; padding:2px 0 8px; scrollbar-width:none}
  .excards::-webkit-scrollbar{display:none}
  .excard{flex:0 0 198px; background:var(--surf); border:1px solid var(--line2); border-radius:12px; overflow:hidden; position:relative}
  .excard .ph{height:118px; background:var(--soft); position:relative}
  .excard .ph img{width:100%; height:100%; object-fit:cover; display:block}
  .excard .ph .ld{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted2)}
  .excard .bd{padding:10px 11px 12px}
  .excard .nm{font-size:14px; font-weight:700; line-height:1.3; letter-spacing:-.01em}
  .excard .rt{font-size:12px; color:#C9700A; font-weight:700; margin-top:3px; display:flex; align-items:center; gap:3px}
  .excard .wy{font-size:12.5px; color:var(--muted); margin-top:5px; line-height:1.45}
  .excard .add{position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,.94); box-shadow:var(--sh2); display:flex; align-items:center; justify-content:center; color:var(--ink); padding:0}
  .excard .add:hover{background:var(--acc); color:#fff}
  .excard.done .add{background:var(--ok); color:#fff}

  /* 開支帳 */
  .exptot{background:var(--soft); border-radius:16px; padding:16px 24px; display:flex; align-items:flex-start; gap:18px; flex-wrap:wrap}
  .exptot .amt{font-size:36px; font-weight:400; letter-spacing:-.03em; line-height:1.1; flex:1 1 180px}
  .exptot .amt small{display:block; font-size:13px; color:var(--muted); font-weight:600; letter-spacing:0; margin-top:3px}
  .exphead{display:flex; align-items:baseline; gap:10px; margin:24px 0 8px}
  .exphead h3{margin:0; font-size:22px; font-weight:700; letter-spacing:-.02em}
  .exphead .sp{flex:1}
  .exp{display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line2)}
  .exp:last-child{border-bottom:0}
  .exp .ic{width:30px; height:30px; border-radius:50%; background:var(--soft); display:flex; align-items:center; justify-content:center; font-size:14px; flex:0 0 auto}
  .exp .bd{flex:1; min-width:0}
  .exp .bd b{display:block; font-size:14.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .exp .bd span{font-size:12.5px; color:var(--muted)}
  .exp .amt{font-weight:700; font-size:14.5px; white-space:nowrap; font-variant-numeric:tabular-nums}
  .exp .amt i{display:block; font-style:normal; font-size:11.5px; color:var(--muted); font-weight:600}
  .empty{color:var(--muted); font-size:14px; padding:16px 2px; line-height:1.75}

  /* ============ item rows ============ */
  .rows{display:flex; flex-direction:column; gap:2px}
  .row{position:relative; display:flex; gap:9px; align-items:flex-start; padding-left:14px}
  .row.drag{opacity:.3}
  .row.over .rcard{box-shadow:inset 0 2px 0 var(--acc)}
  .idx{position:absolute; left:0; top:11px; z-index:3; width:25px; height:25px; border-radius:50%;
       font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
       color:#fff; border:2px solid var(--surf)}
  .grip{position:absolute; left:-14px; top:16px; width:14px; color:transparent; font-size:12px; cursor:grab}
  .row:hover .grip{color:var(--muted2)}
  .rcard{flex:1; min-width:0; background:var(--soft); border-radius:9px; padding:11px 14px 11px 20px; margin-left:11px}
  .row.done .rcard{opacity:.62}
  .rcard .nm{font-size:15px; font-weight:700; letter-spacing:-.01em; word-break:break-word; line-height:1.35}
  .row.done .rcard .nm{text-decoration:line-through; text-decoration-color:var(--muted)}
  .rcard .kin{font-size:12px; color:var(--muted); font-weight:600; margin-right:5px}
  .rcard .ad{font-size:13px; color:var(--muted); margin-top:2px; word-break:break-word}
  .rcard .nt{font-size:14px; color:var(--ink2); margin-top:5px; white-space:pre-wrap; word-break:break-word; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
  .chip{font-size:12.5px; font-weight:700; border-radius:5px; padding:3px 8px; background:var(--link-soft); color:var(--link); white-space:nowrap}
  .chip.cost{background:var(--soft2); color:var(--ink2); border:1px solid var(--line)}
  .chip.warn{background:var(--warn); color:#fff}
  .thumb{width:86px; height:64px; flex:0 0 auto; border-radius:8px; overflow:hidden; background:var(--soft); margin-top:2px}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .chip.rate{background:#FFF3E0; color:#C9700A}
  .chip.open{background:#E7F5EC; color:#1F7A45}
  .chip.shut{background:var(--soft2); color:var(--muted); border:1px solid var(--line)}
  @media (prefers-color-scheme: dark){
    .chip.rate{background:#3A2E1A; color:#E8B368}
    .chip.open{background:#1E3326; color:#79C795}
  }
  @media (max-width:560px){ .thumb{width:64px; height:52px} }
  .rt{flex:0 0 auto; display:flex; align-items:center; gap:2px; padding-top:11px}
  .tick{width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px; color:transparent}
  .row:hover .tick{border-color:var(--muted2); color:var(--muted2)}
  .row.done .tick{background:var(--ok); border-color:var(--ok); color:#fff}
  .kebab{width:26px; height:26px; border-radius:6px; color:var(--muted2); font-size:16px; display:flex; align-items:center; justify-content:center; opacity:0}
  .row:hover .kebab{opacity:1}
  @media (hover:none){ .kebab,.tick{opacity:1} .tick{color:var(--muted2)} }
  .kebab:hover{background:var(--soft)}

  /* 車程段：虛線接駁 + 交通方式 + 時間距離 */
  .leg{position:relative; display:flex; align-items:center; gap:6px; padding:5px 0 5px 39px; font-size:13px; color:var(--muted)}
  .leg::before{content:""; position:absolute; left:12px; top:0; bottom:0; border-left:2px dotted var(--line)}
  .leg em{font-style:normal; font-size:13px}
  .leg a{color:var(--link); font-weight:700; text-decoration:none; margin-left:2px}
  .leg .est{font-size:10.5px; background:var(--soft2); border:1px solid var(--line); color:var(--muted2); border-radius:4px; padding:0 4px; margin-left:2px}

  .checks{margin-top:7px; display:flex; flex-direction:column; gap:4px}
  .checks label{display:flex; gap:8px; font-size:14px; align-items:flex-start; cursor:pointer}
  .checks input{margin:3px 0 0; accent-color:var(--ok)}
  .checks label.on span{text-decoration:line-through; color:var(--muted)}

  /* ============ inline add ============ */
  .add{position:relative; padding:8px 0 2px 25px}
  .addbar{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .addbar .fi{min-width:0}
  .addbar .fi{flex:1; display:flex; align-items:center; gap:8px; background:var(--surf); border:1px solid var(--line);
              border-radius:8px; padding:9px 12px}
  .addbar .fi:focus-within{border-color:var(--acc)}
  .addbar .fi input{flex:1 1 0; min-width:0; width:100%; font-size:14.5px}
  .addbar .fi input::placeholder{color:var(--muted2)}
  .kinds{display:flex; gap:2px}
  .kinds button{width:30px; height:30px; border-radius:7px; font-size:14px; display:flex; align-items:center; justify-content:center; color:var(--muted)}
  .kinds button:hover{background:var(--soft)}
  .kinds button.on{background:var(--acc-soft)}
  .sug{position:absolute; left:25px; right:0; top:100%; z-index:14; background:var(--card); border:1px solid var(--line);
       border-radius:9px; box-shadow:var(--sh2); padding:4px; max-height:290px; overflow-y:auto}
  .sug button{display:flex; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:6px; align-items:flex-start}
  .sug button:hover,.sug button.on{background:var(--soft)}
  .sug .sic{width:24px; flex:0 0 auto; text-align:center; font-size:14px}
  .sug b{display:block; font-size:14px; font-weight:700}
  .sug small{display:block; font-size:12.5px; color:var(--muted); margin-top:1px}
  .sug .hd{font-size:11px; color:var(--muted2); padding:6px 10px 3px; font-weight:700; letter-spacing:.06em; text-transform:uppercase}

  /* ============ day ============ */
  .day{margin-bottom:14px}
  .dayh{display:flex; align-items:baseline; gap:9px; margin:20px 0 9px}
  .dayh .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto; align-self:center}
  .dayh h3{margin:0; font-size:17px; font-weight:700; letter-spacing:-.02em}
  .dayh .dd{font-size:13.5px; color:var(--muted)}
  .dayh .sp{flex:1}
  .dayh .tot{font-size:13px; color:var(--muted); font-weight:600}
  .dayw{font-size:12.5px; color:var(--muted); margin:-4px 0 9px 18px; letter-spacing:.01em}
  .leg.from{color:var(--ink2); font-weight:600}

  /* ============ budget ============ */
  .bud{display:flex; flex-direction:column; gap:9px}
  .bud .r{display:flex; align-items:center; gap:11px; font-size:14px}
  .bud .r .bar{flex:1; height:6px; border-radius:99px; background:var(--line2); overflow:hidden}
  .bud .r .bar i{display:block; height:100%; border-radius:99px}
  .bud .r b{min-width:84px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
  .bud .r span:first-child{min-width:66px; color:var(--ink2)}
  .budtot{display:flex; justify-content:space-between; align-items:baseline; padding-top:13px; margin-top:5px; border-top:1px solid var(--line)}
  .budtot b{font-size:24px; font-weight:700; letter-spacing:-.02em}

  /* ============ map ============ */
  .leaflet-container{background:var(--soft); font:inherit}
  .pin{width:26px; height:26px; border-radius:50% 50% 50% 3px; transform:rotate(-45deg); display:flex; align-items:center;
       justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.10);
       border:2.5px solid #fff; color:#fff}
  .pin b{transform:rotate(45deg); font-size:11.5px; font-weight:700}
  .pin.big{width:34px; height:34px; z-index:900 !important}
  .pin.big b{font-size:14px}
  .mapbar{position:absolute; top:12px; left:12px; right:12px; z-index:5; display:flex; gap:5px;
    flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
  .mapbar::-webkit-scrollbar{display:none}
  .mapbar button{flex:0 0 auto; background:var(--surf); box-shadow:var(--sh2); border-radius:99px; padding:6px 12px; font-size:13px; font-weight:700; color:var(--ink2)}
  .mapbar button.on{background:var(--ink); color:var(--surf)}
  .leaflet-popup-content{margin:11px 13px; font-size:14px}
  .leaflet-popup-content b{display:block; margin-bottom:3px; font-size:14.5px; font-weight:700}
  .leaflet-popup-content a{color:var(--link); font-size:13px; font-weight:700}

  /* ============ AI panel ============ */
  .ai{position:absolute; inset:0; z-index:20; background:var(--bg); display:none; flex-direction:column}
  .ai.open{display:flex}
  .aihead{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line)}
  .aihead b{font-size:15px; font-weight:700; flex:1}
  .aihead button{font-size:13px; color:var(--muted); border-radius:99px; padding:5px 11px; font-weight:600}
  .aihead button:hover{background:var(--soft)}
  .aimsgs{flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:11px}
  .msg{max-width:88%; padding:10px 14px; border-radius:14px; font-size:14.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word}
  .msg.u{align-self:flex-end; background:var(--acc); color:#fff; border-bottom-right-radius:4px}
  .msg.a{align-self:flex-start; background:var(--soft); border-bottom-left-radius:4px}
  .msg.sys{align-self:center; background:var(--acc-soft); font-size:12.5px; color:var(--ink2); padding:6px 13px; border-radius:99px}
  .msg .did{display:block; margin-top:8px; font-size:12.5px; color:var(--acc); font-weight:700}
  .aiwelcome{color:var(--muted); font-size:14px; text-align:center; padding:26px 14px; line-height:1.8}
  .aichips{display:flex; gap:6px; padding:0 14px 8px; flex-wrap:wrap}
  .aichips button{font-size:13px; background:var(--surf); border:1px solid var(--line); border-radius:99px; padding:6px 12px; color:var(--ink2); font-weight:600}
  .aichips button:hover{border-color:var(--acc); color:var(--acc)}
  .aiin{display:flex; gap:8px; padding:11px 14px calc(13px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); align-items:flex-end}
  .aiin textarea{flex:1; background:var(--soft); border-radius:12px; padding:10px 13px; resize:none; max-height:120px; font-size:14.5px; line-height:1.5}
  .aiin button{width:38px; height:38px; border-radius:50%; background:var(--acc); color:#fff; font-size:16px; display:flex; align-items:center; justify-content:center; flex:0 0 auto}
  .aiin button:disabled{opacity:.4}
  .warnb{display:inline-block; font-size:11px; font-weight:700; color:#fff; background:var(--warn); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:1px}
  @media (max-width:820px){ .ai{position:fixed; inset:0; z-index:70} }

  /* ============ optimize / offline ============ */
  .netbar{display:none; background:var(--warn); color:#fff; font-size:13px; font-weight:700; padding:9px 14px; text-align:center}
  .netbar.show{display:block}
  .optbox{background:var(--soft2); border:1px solid var(--line2); border-radius:10px; padding:15px}
  .optrow{display:flex; justify-content:space-between; align-items:baseline; padding:3px 0; font-size:14px}
  .optrow b{font-size:20px; font-weight:700}
  .optrow.ok b{color:var(--ok)}
  .optsave{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:13.5px; font-weight:700; color:var(--acc)}
  .optseq{background:var(--surf); border:1px solid var(--line); border-radius:9px; padding:9px 13px; max-height:220px; overflow-y:auto}
  .optseq div{display:flex; gap:10px; padding:4px 0; font-size:14px; align-items:baseline}
  .optseq b{width:18px; color:var(--muted); font-size:12px; font-weight:700; flex:0 0 auto}

  /* 地點詳情卡 */
  .pshot{margin:-22px -22px 14px; height:190px; overflow:hidden; border-radius:12px 12px 0 0; background:var(--soft)}
  .pshot img{width:100%; height:100%; object-fit:cover; display:block}
  .phead h3{font-size:23px; font-weight:700; letter-spacing:-.02em; line-height:1.2}
  .pmeta{font-size:13.5px; color:var(--muted); margin-top:5px}
  .pmeta b{font-weight:700}
  .prate{color:#C9700A} .popen{color:var(--ok)} .pshut{color:var(--muted)}
  .ohint{color:var(--muted2); font-size:12.5px; margin-left:5px}
  .bkbox{border:1px solid var(--line); border-radius:10px; padding:12px 13px 2px; margin:2px 0 14px; background:var(--soft)}
  .bkh{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; margin-bottom:9px}
  .bkbox .inp{background:var(--bg)}

  /* 「而家」卡：車上乘客用。大字、行距鬆、唔使精細撳 */
  .tbtn.now{background:var(--acc); color:#fff; border-color:var(--acc); font-weight:800}
  .tbtn.now:hover{background:var(--acc-d); border-color:var(--acc-d)}
  .nowwrap{padding-top:2px}
  .nowtime{font-size:15px; color:var(--muted); font-weight:700; letter-spacing:.02em}
  .nowtime span{font-size:12px; font-weight:600; color:var(--muted2); margin-left:6px}
  .nowlbl{font-size:12px; font-weight:800; color:var(--muted); letter-spacing:.06em;
          text-transform:uppercase; margin:16px 0 4px}
  .nowbig{font-size:27px; font-weight:800; line-height:1.18; letter-spacing:-.025em; display:flex;
          align-items:center; gap:9px; flex-wrap:wrap}
  .nowbig .ico{flex:0 0 auto}
  .nowsub{font-size:14.5px; color:var(--muted); margin-top:5px; line-height:1.4}
  .nowrow{display:flex; align-items:center; gap:10px; font-size:16px; padding:11px 0;
          border-top:1px solid var(--line2); line-height:1.35; flex-wrap:wrap}
  .nowrow:first-of-type{border-top:0}
  .nowrow .ico{flex:0 0 auto; color:var(--muted)}
  .nowrow.big{font-size:20px; font-weight:700}
  .nowrow em{font-style:normal; font-size:13px; font-weight:600; color:var(--muted); margin-left:2px}
  .nowrow em.bad{color:var(--acc); font-weight:800}
  .nowrow.warn{color:var(--acc); font-weight:700}
  .nowrow.warn .ico{color:var(--acc)}
  .nowrow.ok .ico{color:var(--ok)}
  .nowrow a{color:var(--link); font-weight:700; display:flex; align-items:center; gap:10px}
  .nowwx{margin:14px 0 2px; padding:12px 14px; border-radius:10px; background:var(--soft);
         font-size:16px; font-weight:700; letter-spacing:.01em; line-height:1.4}
  .nowbtns{margin-top:16px; display:flex; flex-direction:column; gap:8px}
  .nowbtns .btn{text-align:center; text-decoration:none}
  .tfbtn.on{background:var(--acc)!important; color:#fff!important; border-color:var(--acc)!important}
  .prows{margin:16px 0 4px; display:flex; flex-direction:column}
  .prow{display:flex; gap:11px; padding:9px 0; border-top:1px solid var(--line2); font-size:14px; align-items:flex-start}
  .prow:first-child{border-top:0}
  .prow em{font-style:normal; width:18px; flex:0 0 auto; text-align:center}
  .prow span,.prow a{flex:1; word-break:break-word; white-space:pre-wrap}
  .prow a{color:var(--link); text-decoration:none; font-weight:600}
  .prow a[data-act]{font-weight:700; margin-left:6px; cursor:pointer}
  .phours{background:var(--soft); border-radius:10px; padding:11px 14px; margin-top:10px; font-size:13.5px; line-height:1.9}

  /* ============ sheet / modal ============ */
  .sheet{position:fixed; inset:0; z-index:60; display:none}
  .sheet.show{display:block}
  .sheet .bg{position:absolute; inset:0; background:rgba(33,37,41,.45)}
  .sheet .pan{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(450px,calc(100vw - 32px));
              max-height:88vh; overflow-y:auto; background:var(--surf); border-radius:12px; box-shadow:var(--sh2); padding:22px}
  .sheet h3{margin:0 0 16px; font-size:21px; font-weight:700; letter-spacing:-.02em}
  .sheet .close{position:absolute; top:17px; right:20px; font-size:13px; color:var(--muted); border-radius:99px; padding:4px 10px; font-weight:600}
  .sheet .close:hover{background:var(--soft)}
  .fld{margin-bottom:12px}
  .fld label{display:block; font-size:12.5px; color:var(--muted); margin:0 0 5px 1px; font-weight:700}
  .inp{width:100%; background:var(--surf); border:1px solid var(--line); border-radius:8px; padding:10px 12px; outline:none; font-size:14.5px}
  /* 🔴 iOS Safari：一 focus 字細過 16px 嘅輸入欄就會自動放大成個頁，而且唔會自己縮返。
     揿類型 icon 會自動 focus 個輸入欄，所以症狀係「揿完 icon 畫面放大縮唔返」。
     唔可以用 maximum-scale=1 解決（會連手指放大都禁埋，唔應該）。正解係觸控裝置一律 16px。 */
  @media (pointer:coarse){
    .inp, .addbar .fi input, .aiin textarea,
    input:not([type=checkbox]):not([type=radio]), select, textarea{font-size:16px}
    .inp{padding:11px 12px}
  }
  .inp:focus{border-color:var(--acc)}
  textarea.inp{resize:vertical; min-height:80px; line-height:1.55}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .btn{display:block; width:100%; background:var(--ink); color:var(--surf); border-radius:99px; padding:12px; font-size:15px; font-weight:700; text-align:center}
  .btn.ghost{background:var(--surf); color:var(--ink); border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--soft)}
  .btn.acc{background:var(--acc); color:#fff}
  .btn.acc:hover{background:var(--acc-d)}
  .btn.warn{background:var(--warn); color:#fff}
  .btnrow{display:flex; gap:9px; margin-top:11px}
  .btnrow .btn{flex:1}
  .hint{font-size:13px; color:var(--muted); margin-top:9px; line-height:1.65}
  .hint.err{color:var(--warn)}
  .menu{position:fixed; z-index:70; background:var(--card); border:1px solid var(--line); border-radius:9px; box-shadow:var(--sh2); padding:4px; min-width:180px}
  .menu button{display:block; width:100%; text-align:left; padding:8px 11px; border-radius:6px; font-size:14px}
  .menu button:hover{background:var(--soft)}
  .menu button.dz{color:var(--warn)}
  .menu hr{border:0; border-top:1px solid var(--line); margin:4px 6px}
  .spin{display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--acc); border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ============ print ============ */
  @media print{
    .side,.mapwrap,.top,.add,.kebab,.grip,.tick,.ai,.sheet,.menu,.netbar,.hero,.hedit,.tbtn,.empty,.leg::before{display:none !important}
    html,body{overflow:visible !important; height:auto !important; background:#fff !important; color:#000 !important; font-size:11pt}
    .shell{display:block !important; height:auto !important}
    .doc{overflow:visible !important; height:auto !important; background:#fff !important}
    .page{max-width:none !important; padding:0 !important}
    .herocard{margin:0 0 14px !important; box-shadow:none !important; padding:0 !important}
    .herocard h1{font-size:20pt}
    .hstats{border-top:1px solid #bbb}
    .rcard{background:#f7f7f7 !important; break-inside:avoid}
    .sec,.day,.row{break-inside:avoid}
    .sech h2{font-size:15pt}
    .dayh h3{font-size:12pt}
    .dayw{font-size:9pt; margin-left:0}
    .leg{padding-left:14px}
    #tripNote{border:1px solid #ddd}
    a{color:#000; text-decoration:none}
    @page{ margin:14mm 12mm }
  }

  /* ============ gate ============ */
  .gate{position:fixed; inset:0; background:var(--bg); z-index:90; display:none; align-items:center; justify-content:center; padding:20px}
  .gate.show{display:flex}
  .gate .box{width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--sh2); padding:26px}
  .gate h2{margin:0 0 7px; font-size:24px; font-weight:700; letter-spacing:-.02em}
  .gate p{margin:0 0 16px; font-size:14px; color:var(--muted); line-height:1.6}
  .gate .inp{margin-bottom:10px}

  /* ============ responsive ============ */
  .sidebd{display:none; position:fixed; inset:0; z-index:79; background:rgba(33,37,41,.42)}
  .sidebd.show{display:block}
  .sideclose{display:none; margin-left:auto; width:30px; height:30px; border-radius:50%;
    align-items:center; justify-content:center; font-size:17px; color:var(--muted)}
  .sideclose:hover{background:var(--soft)}
  @media (max-width:1080px){ :root{ --side:0px; --mapw:38%; }
    .side{position:fixed; left:0; top:0; bottom:0; width:230px; max-width:82vw; z-index:80;
      transform:translateX(-100%); transition:transform .2s}
    .side.open{transform:none; box-shadow:var(--sh2)}
    .mapbtn{display:flex}
    .sideclose{display:flex} }
  @media (max-width:820px){
    :root{ --mapw:0px; }
    .shell{grid-template-columns:1fr}
    .mapwrap{position:fixed; inset:0; z-index:50; display:none}
    .mapwrap.open{display:block}
    .mapclose{position:absolute; top:12px; right:12px; z-index:6; background:var(--surf); box-shadow:var(--sh2); border-radius:99px; padding:7px 14px; font-size:13.5px; font-weight:700}
    .page{padding:0 16px 130px}
    .hero{margin:0 -16px; height:160px}
    .herocard{margin-top:-60px}
    .herocard h1{font-size:27px}
    .sech h2{font-size:21px}
    .top{padding:8px 14px}
    .addbar .fi{flex:1 1 100%}
    .kinds{width:100%; justify-content:space-between}
    .kinds button{width:38px; height:34px; font-size:16px}
    .add{padding-left:0}
    .sug{left:0}
    .idx{left:0; top:10px}
    .rcard{margin-left:9px; padding-left:19px}
    .row{padding-left:12px}
  }
  @media (min-width:821px){ .mapclose{display:none} }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="box">
    <h2>旅程記錄</h2>
    <p>行程規劃＋旅程日誌。入暗號同步雲端；唔想同步可以淨係喺呢部機用。</p>
    <button class="btn acc hide" id="gateReuse">用返飲食記錄嘅暗號</button>
    <div class="hint hide" id="gateOr" style="text-align:center; margin:9px 0 10px">或者自己打</div>
    <input class="inp" id="gateKey" type="password" autocomplete="off" placeholder="暗號">
    <button class="btn" id="gateGo">進入</button>
    <button class="btn ghost" id="gateLocal" style="margin-top:8px">淨係喺呢部機用</button>
    <div class="hint" id="gateMsg"></div>
  </div>
</div>

<div class="shell">

  <aside class="side" id="side">
    <div class="brand"><span id="brandIc"></span> 旅程記錄<button class="sideclose" data-act="closeside"></button></div>
    <button class="aibtn" data-act="ai"><em id="aiIc"></em> AI 助手</button>
    <div id="toc"></div>
    <div class="sfoot">
      <button data-act="trips">切換旅程</button>
      <button data-act="settings">設定</button>
      <div id="ver" style="padding-top:6px"></div>
    </div>
  </aside>

  <div class="sidebd" id="sidebd" data-act="closeside"></div>

  <main class="doc" id="doc">
    <div class="top">
      <span class="sync" id="sync">載緊…</span>
      <button class="tbtn mapbtn" data-act="menu-side" id="hamb" title="目錄"></button>
      <button class="tbtn now" data-act="now" title="而家">而家</button>
      <button class="tbtn" id="bUndo" data-act="undo" title="復原"></button>
      <button class="tbtn" id="bRedo" data-act="redo" title="重做"></button>
      <button class="tbtn mapbtn" data-act="openmap"><span id="mapIc"></span> 地圖</button>
      <button class="tbtn solid" data-act="export">匯出</button>
    </div>
    <div class="netbar" id="netbar">📴 離線中 — 睇得改得，接返網就自動同步</div>
    <div id="main"></div>
  </main>

  <section class="mapwrap" id="mapwrap">
    <div id="map"></div>
    <div class="mapbar" id="mapbar"></div>
    <button class="mapclose" data-act="closemap">收起</button>

    <section class="ai" id="aiPanel">
      <div class="aihead"><b><span id="aiHeadIc"></span> AI 助手</b>
        <button data-act="aiclear">新對話</button>
        <button data-act="aiclose">收起</button></div>
      <div class="aimsgs" id="aiMsgs"></div>
      <div class="aichips" id="aiChips"></div>
      <div class="aiin"><textarea id="aiText" rows="1" placeholder="問我行程嘅嘢，或者叫我改…"></textarea>
        <button data-act="aisend" id="aiSend">↑</button></div>
    </section>
  </section>

</div>

<div class="sheet" id="sheet"><div class="bg" data-act="closesheet"></div><div class="pan" id="pan"></div></div>
<div id="menuHost"></div>

  // ---------- 日出日落：純計算，唔用 API（任何日期都有，包括一年後）----------
  // NOAA 簡化算法。校驗過：東京 2025-12-05 算出 06:37/16:29，實測 06:34/16:29。
  function lngTz(lng){ return Math.round(+lng/15)*60; }      // 回「分鐘」
  // 把一個時刻換成「當地時區嘅牆上時間」。tzMin 單位係分鐘（Google utcOffsetMinutes
  // 同 Open-Meteo utc_offset_seconds/60 都係分鐘）。
  // ⚠️ getTimezoneOffset() 係 (UTC − 本機)，UTC+8 回 −480，所以要「加」佢。
  function atTz(d, tzMin){
    if(tzMin==null) return d;
    return new Date(d.getTime() + (tzMin + d.getTimezoneOffset())*60000);
  }
  function sunTimes(lat, lng, ds, tzMin){
    if(lat==null||lng==null||!ds) return null;
    var RD=Math.PI/180, p=String(ds).split('-');
    var y=+p[0], m=+p[1], d=+p[2];
    if(!y||!m||!d) return null;
    var a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
    var jd=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045-0.5;
    var n=jd-2451545.0+0.0008, Js=n-lng/360;
    var M=(357.5291+0.98560028*Js)%360;
    var C=1.9148*Math.sin(M*RD)+0.0200*Math.sin(2*M*RD)+0.0003*Math.sin(3*M*RD);
    var L=(M+C+180+102.9372)%360;
    var Jt=2451545.0+Js+0.0053*Math.sin(M*RD)-0.0069*Math.sin(2*L*RD);
    var dec=Math.asin(Math.sin(L*RD)*Math.sin(23.44*RD))/RD;
    var cw=(Math.sin(-0.833*RD)-Math.sin(lat*RD)*Math.sin(dec*RD))/(Math.cos(lat*RD)*Math.cos(dec*RD));
    if(cw>1) return {polar:'night'};          // 極夜：全日唔出太陽
    if(cw<-1) return {polar:'day'};           // 極晝
    // tzMin 冇俾就用經度估（每 15° 一個鐘）。旅行嗰陣部機時區係出發地，
    // 用佢算當地日落一定錯，所以寧可用經度估。
    var w=Math.acos(cw)/RD, tz=(tzMin==null? lngTz(lng) : tzMin)/60;
    function hm(J){
      var f=(J-2451545.0)%1; if(f<0) f+=1;
      var h=(f*24+tz)%24; if(h<0) h+=24;
      var hh=Math.floor(h), mi=Math.round((h-hh)*60);
      if(mi===60){ mi=0; hh=(hh+1)%24; }
      return pad(hh)+':'+pad(mi);
    }
    return {rise:hm(Jt-w/360), set:hm(Jt+w/360)};
  }

  // ---------- 營業時間：解析 Google 嘅 weekdayDescriptions ----------
  // 支援 "Monday: 9:00 AM – 5:00 PM"、"Closed"、"Open 24 hours"、多段時間、跨夜，
  // 同中文版本（星期一: 上午9:00 至 下午5:00 / 休息 / 24 小時營業）。
  function hoursIdx(ds){ var w=pD(ds).getDay(); return w===0?6:w-1; }   // Google 由星期一起
  function parseHourLine(line){
    if(!line) return null;
    var t=String(line).replace(/^[^:：]*[:：]\s*/,'').trim();
    if(!t) return null;
    if(/closed|休息|定休|not open/i.test(t)) return {closed:true, raw:t};
    if(/24\s*hours|24\s*小時|24小时/i.test(t)) return {all:true, raw:t};
    var AP='[ap]\\.?m\\.?|上午|下午|中午|凌晨|晚上|早上';
    var T='(?:('+AP+')\\s*)?(\\d{1,2})(?::(\\d{2}))?\\s*(?:('+AP+'))?';
    var out=[], re=new RegExp(T+'\\s*(?:[–\\-~—至到]|to)\\s*'+T,'gi'), m;
    while((m=re.exec(t))){

      var A=toMin(m[2],m[3],k1||k2), B=toMin(m[6],m[7],k2||k1);
      if(A==null||B==null) continue;

      out.push([A,B]);

    return out.length? {spans:out, raw:t} : {unknown:true, raw:t};
    function toMin(h,mi,ap){
      h=+h; mi=+(mi||0); if(isNaN(h)) return null;
      ap=String(ap||'').toLowerCase().replace(/\./g,'');
      if(ap==='pm'||ap==='下午'||ap==='晚上'){ if(h<12) h+=12; }
      else if(ap==='am'||ap==='上午'||ap==='凌晨'||ap==='早上'){ if(h===12) h=0; }
      else if(ap==='中午'){ if(h<12) h+=12; }
      return h*60+mi;
    }

  function dayHours(x, ds){
    if(!x || !x.hours || !x.hours.length || !ds) return null;

  }
  // 「你排咗嘅時間」同「營業時間」撞唔撞？回一句人話，冇問題就回空。
  function hoursWarn(x){
    if(!x || !x.date) return '';
    var H=dayHours(x, x.date);
    if(!H) return '';
    if(H.closed) return '星期'+dow(x.date)+'休息';
    if(!x.time || H.all || !H.spans) return '';
    var p=x.time.split(':'), t=(+p[0])*60+(+p[1]||0);
    var ok=H.spans.some(function(sp){ return (t>=sp[0]&&t<=sp[1]) || (t+1440>=sp[0]&&t+1440<=sp[1]); });
    if(ok) return '';
    var first=H.spans[0], last=H.spans[H.spans.length-1];
    if(t<first[0]) return x.time+' 到，但 '+minHM(first[0])+' 才開';
    if(t>last[1]) return x.time+' 到，但 '+minHM(last[1])+' 關門';
    return x.time+' 唔喺營業時間內（'+H.spans.map(function(sp){ return minHM(sp[0])+'–'+minHM(sp[1]); }).join('、')+'）';

  function minHM(m){ m=((m%1440)+1440)%1440; return pad(Math.floor(m/60))+':'+pad(m%60); }

    if(H.all) return {open:true, local:tz!=null, why:'24 小時'};
    if(!H.spans) return null;

  // ---------- 天氣：Open-Meteo（免 key、免登記、非商業免費）----------

  // 超出範圍就只用純計算嘅日落時間。

  function dayPt(d){
    var a=dayItems(d).filter(function(x){ return x.lat!=null; });
    if(!a.length) return tripCentre();

  function wxKey(d){ var t=curTrip(); return t? t.id+'|'+d : ''; }

  // 出發日仲遠過 16 日就攞唔到預報。但「12 月北海道凍到幾多、落唔落雪」呢個
  // 問題，往年同期嘅實際數字已經答得到 —— 而且係免 key 嘅歷史 API。
  // 三個 request（過去三年），一次過攞晒所有地點（archive API 同 forecast 一樣
  // 支援多座標）。歷史數據唔會變，所以 cache 一個月。
  function yearOf(ds, Y){ return Y+ds.slice(4); }        // '2026-12-01' → '2023-12-01'
  var histBusy=false;
  function wxHist(pts, dayIdx, ds, tid){
    if(histBusy) return;

    var y0=+ds[0].slice(0,4), yrs=[y0-1,y0-2,y0-3];
    var lat=pts.map(function(q){ return q.lat.toFixed(3); }).join(',');
    var lng=pts.map(function(q){ return q.lng.toFixed(3); }).join(',');

            var D=loc.daily; if(D.temperature_2m_max[i]==null) return;

            o.mn.push(D.temperature_2m_min[i]);

        var t2=curTrip(); if(!t2) return;

        var n=0;

          var o=acc[dd], rec=state.wx[t2.id+'|'+dd]||{};

  var wxBusy=false, wxFail=0;
  function wxFetch(force){
    var t=curTrip(); if(!t||!t.start) return;
    if(!state.wx) state.wx={};
    var ds=days(); if(!ds.length) return;

    // 逐日一個座標，重複嘅合埋（一個 request 攞齊）
    var pts=[], seen={}, dayIdx={};
    ds.forEach(function(d){

    if(!pts.length) return;                                          // 一個地點都未定位，冇得計

    }

    var todayS=today(), maxD=fmtD(new Date(Date.now()+15*86400000));
    var a=(ds[0]<todayS)? todayS : ds[0], b=ds[ds.length-1];
    if(b>maxD) b=maxD;
    var inRange = (a<=b && a<=maxD);

    var url='https://api.open-meteo.com/v1/forecast'+
      '?latitude='+pts.map(function(q){ return q.lat.toFixed(3); }).join(',')+
      '&longitude='+pts.map(function(q){ return q.lng.toFixed(3); }).join(',')+
      '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,snowfall_sum,weather_code,sunrise,sunset'+
      '&timezone=auto';
    // 出發日仲遠過 16 日就攞唔到預報，但照打一次攞當地時區（日落要用）
    url += inRange? ('&start_date='+a+'&end_date='+b) : '&forecast_days=1';

    wxBusy=true;
    fetch(url).then(function(r){ return r.ok? r.json() : null; }).then(function(j){
      if(!j){ wxBusy=false; wxFail=Date.now(); return; }
      var t2=curTrip(); if(!t2){ wxBusy=false; return; }
      var arr = Array.isArray(j)? j : [j];                           // 一個座標嗰陣唔係 array
      ds.forEach(function(d){
        var loc=arr[dayIdx[d]]; if(!loc) return;
        var rec=state.wx[t2.id+'|'+d]||{};
        if(loc.utc_offset_seconds!=null) rec.tz=Math.round(loc.utc_offset_seconds/60);
        var D=loc.daily, i=(D&&D.time)? D.time.indexOf(d) : -1;
        if(i>=0){
          rec.mn=D.temperature_2m_min[i]; rec.mx=D.temperature_2m_max[i];
          rec.pr=D.precipitation_sum[i];  rec.sn=D.snowfall_sum[i];
          rec.cd=D.weather_code[i];
          rec.rise=(D.sunrise[i]||'').slice(11,16);
          rec.set=(D.sunset[i]||'').slice(11,16);
        }
        state.wx[t2.id+'|'+d]=rec;
      });
      t2.wxAt=Date.now(); wxBusy=false;
      save(true); render();
    }).catch(function(){ wxBusy=false; wxFail=Date.now(); });
  }
  var WXI={0:'晴',1:'大致晴',2:'多雲',3:'密雲',45:'霧',48:'霧',51:'微雨',53:'微雨',55:'微雨',
    61:'雨',63:'雨',65:'大雨',66:'凍雨',67:'凍雨',71:'雪',73:'雪',75:'大雪',77:'雪粒',
    80:'雨',81:'雨',82:'大雨',85:'陣雪',86:'大陣雪',95:'雷雨',96:'雷雨',99:'雷雨'};
  // 每日標題嗰行：氣溫 · 雪 · 天黑
  // 全日總車程。真數（Google）先，冇就用逐段直線估算加埋並標明「估」。
  function dayDrive(d){
    var r=dayRoute(d);
    if(r && r.totalSec) return {sec:r.totalSec, m:r.totalM||0, real:true};
    var arr=dayItems(d).filter(function(x){ return kd(x.kind).geo && x.lat!=null; });
    var org=dayOrigin(d);
    if(org) arr=[org].concat(arr);
    if(arr.length<2) return null;
    var sec=0, m=0;
    for(var i=1;i<arr.length;i++){
      var km=hav([arr[i-1].lat,arr[i-1].lng],[arr[i].lat,arr[i].lng])*1.3;
      var kmh = km<2?4.5 : (km<15?26 : (km<60?40:55));
      sec+=km/kmh*3600; m+=km*1000;
    }
    return {sec:sec, m:m, real:false};
  }
  function dayWx(d){
    var t=curTrip(); if(!t) return '';
    var w=wxGet(d), bits=[];
    var dr=dayDrive(d), rr=dayRoute(d);
    if(dr) bits.push('車程 '+minsTxt(dr.sec)+' · '+(dr.m/1000).toFixed(dr.m<10000?1:0)+'km'+
      (dr.real? (rr&&rr.traffic? '（計路況）':'') : '（估）'));
    if(w && w.mx!=null){
      bits.push(Math.round(w.mn)+'°~'+Math.round(w.mx)+'°');
      // 有具體雨雪量就唔好再講一次「雨」（舊版會出「雨 · 雨 24mm」）
      var amt='';
      if(+w.sn>0) amt='雪 '+(+w.sn).toFixed(0)+'cm';
      else if(+w.pr>=1) amt='雨 '+(+w.pr).toFixed(0)+'mm';
      if(amt) bits.push(amt);
      else if(WXI[w.cd]) bits.push(WXI[w.cd]);
    } else if(w && w.h && w.h.mx!=null){
      // 超出 16 日預報窗 → 用往年同期實際數字，並且講明係往年
      bits.push('往年 '+Math.round(w.h.mn)+'°~'+Math.round(w.h.mx)+'°');
      if(w.h.sn!=null && w.h.sn>=0.3) bits.push('雪 '+(w.h.sn<1? w.h.sn.toFixed(1) : w.h.sn.toFixed(0))+'cm');
    }
    var set = w&&w.set ? w.set : null;
    if(!set){
      var c=dayPt(d);
      if(c){ var st=sunTimes(c.lat, c.lng, d, (w&&w.tz!=null)? w.tz : null);
        if(st && st.set) set=st.set; else if(st && st.polar==='night') set='極夜'; }
    }
    if(set) bits.push('天黑 '+set);
    return bits.join(' · ');
  }

  // ---------- state / migration ----------
  function defState(){ return {v:2, trips:[], lists:[], items:[], logs:{}, settings:{curTrip:null,updatedAt:null}, meta:{}, wx:{}, del:{}}; }
  // 墓碑：記住「刪過邊個 id」。冇呢樣嘅話 mergeStates 係純 id union ——
  // 你喺 Mac 刪走 8 個點，iPhone 離線行完一日再上線，8 個會全部復活。
  // 一定要喺 snap() 之後才叫，咁 undo 就連墓碑一齊還原。
  function rmv(ids){
    if(!state.del) state.del={};
    var ts=new Date().toISOString();
    (Array.isArray(ids)?ids:[ids]).forEach(function(id){ if(id) state.del[id]=ts; });
  }
  function DELCUT(){ return Date.now()-90*86400000; }   // 墓碑保留 90 日就夠
  function migrate(s){
    if(!s || typeof s!=='object') return defState();
    if(s.v===2){
      if(!Array.isArray(s.trips)) s.trips=[];
      if(!Array.isArray(s.lists)) s.lists=[];
      if(!Array.isArray(s.items)) s.items=[];
      if(!s.logs) s.logs={}; if(!s.settings) s.settings={}; if(!s.meta) s.meta={};
      if(!s.wx) s.wx={};
      if(!s.del) s.del={};
      return s;
    }
    // v1 → v2：stops 變 items，未排日期嘅入「想去」清單
    var o=defState();
    o.trips=Array.isArray(s.trips)?s.trips:[];
    o.logs=s.logs&&typeof s.logs==='object'?s.logs:{};
    o.settings=s.settings&&typeof s.settings==='object'?s.settings:{curTrip:null};
    var byTrip={};
    (Array.isArray(s.stops)?s.stops:[]).forEach(function(st){
      var k = (st.cat==='eat')?'eat' : (st.cat==='stay')?'stay' : (st.cat==='go')?'car' : 'place';
      var it={ id:st.id||uid(), tripId:st.tripId, kind:k, listId:null, date:st.date||null, ord:st.ord||0,
               time:st.time||'', name:st.name||'', lat:st.lat||null, lng:st.lng||null, addr:st.addr||'',
               note:st.note||'', cost:+st.cost||0, done:!!st.done, checks:[] };
      if(!it.date){
        if(!byTrip[it.tripId]){ var L={id:uid(), tripId:it.tripId, name:'想去', ord:1}; o.lists.push(L); byTrip[it.tripId]=L.id; }
        it.listId=byTrip[it.tripId];
      }
      o.items.push(it);
    });
    return o;
  }
  function applyState(row){
    state=migrate((row&&row.state)||{});
    lastUpdated=(row&&row.updated_at)||null;
    if(!curTrip() && state.trips.length) state.settings.curTrip=state.trips[0].id;
    ensureList();
  }
  function ensureList(){
    var t=curTrip(); if(!t) return;
    if(!state.lists.some(function(l){return l.tripId===t.id;}))
      state.lists.push({id:uid(), tripId:t.id, name:'想去', ord:1});
  }
  function cacheSave(){ try{ localStorage.setItem('tripCache', JSON.stringify({state:state,updated_at:lastUpdated})); }catch(e){} }
  function cacheLoad(){ try{ var s=localStorage.getItem('tripCache'); return s?JSON.parse(s):null; }catch(e){ return null; } }
  function setSync(c,t){ var e=$('sync'); e.className='sync '+(c||''); e.textContent=t; }
  function hdr(){ return {apikey:SBK, Authorization:'Bearer '+SBK, 'x-client-info':KEY, 'Content-Type':'application/json'}; }

  // ---------- undo ----------
  function snap(){
    try{ undoStack.push(JSON.stringify(state)); }catch(e){ return; }
    if(undoStack.length>40) undoStack.shift();
    redoStack.length=0;
  }
  function undo(){ if(!undoStack.length) return; try{ redoStack.push(JSON.stringify(state)); state=JSON.parse(undoStack.pop()); save(); }catch(e){} }
  function redo(){ if(!redoStack.length) return; try{ undoStack.push(JSON.stringify(state)); state=JSON.parse(redoStack.pop()); save(); }catch(e){} }
  function upBtns(){ $('bUndo').disabled=!undoStack.length; $('bRedo').disabled=!redoStack.length; }

  // ---------- persist ----------
  function save(quiet){
    dirty=true; state.settings.updatedAt=new Date().toISOString(); cacheSave();
    if(!quiet) render();
    if(MODE==='local'){ dirty=false; setSync('ok','已存喺本機 '+nowT()); return; }
    setSync('','儲緊…');
    if(pTimer) clearTimeout(pTimer);
    pTimer=setTimeout(persist,600);
  }
  // 兩部機同時用嘅時候，舊 state 唔可以盲目覆蓋新 state。
  // 以 id 做 union：兩邊新增嘅都保留；同一個 id 兩邊都改過就以伺服器（較新）為準。
  function mergeStates(mine, theirs){
    var out=JSON.parse(JSON.stringify(theirs));
    // 兩邊嘅墓碑合埋，再剪走太舊嘅
    var del=Object.assign({}, theirs.del||{}, mine.del||{});
    var cut=DELCUT();
    Object.keys(del).forEach(function(id){ var t=+new Date(del[id]); if(t && t<cut) delete del[id]; });
    out.del=del;
    // 規矩：刪贏改。一邊刪咗、另一邊改過，都當刪 —— 簡單、可預期。
    ['trips','lists','items'].forEach(function(k){
      if(!Array.isArray(out[k])) out[k]=[];
      out[k]=out[k].filter(function(x){ return !(x && del[x.id]); });
      var seen={}; out[k].forEach(function(x){ seen[x.id]=1; });
      (mine[k]||[]).forEach(function(x){ if(x&&x.id&&!seen[x.id]&&!del[x.id]) out[k].push(x); });
    });
    out.logs=out.logs||{};
    Object.keys(mine.logs||{}).forEach(function(k){
      var a=mine.logs[k], b=out.logs[k];
      if(!b) out.logs[k]=a;
      else if(a&&a.updatedAt&&(!b.updatedAt||a.updatedAt>b.updatedAt)) out.logs[k]=a;
    });
    out.chat=Object.assign({}, out.chat||{}, mine.chat||{});
    // 呢幾個係「攞過就唔想再攞」嘅 cache（路線／天氣／探索）。
    // 舊版 out 由 theirs 整份複製，所以每次撞版都會丟失本機攞到嘅，
    // 下次 render 又再燒一次 Google／Open-Meteo call。改成 additive：
    // 對面冇嘅 key 就保留本機嗰份。
    ['routes','wx','explore'].forEach(function(k){
      var mix=Object.assign({}, mine[k]||{});
      Object.keys(out[k]||{}).forEach(function(kk){ mix[kk]=out[k][kk]; });   // 對面嘅贏
      out[k]=mix;
    });
    out.settings=out.settings||{};
    var ms=mine.settings||{};
    if(ms.curTrip) out.settings.curTrip=ms.curTrip;              // 本機正在睇邊個行程
    if(ms.gmapKey && !out.settings.gmapKey) out.settings.gmapKey=ms.gmapKey;
    return out;
  }
  var pRetry=0;
  function persist(){
    if(!state||MODE!=='cloud'||!KEY) return;
    var ts=new Date().toISOString();
    // 第一次（表仲未有 row）→ upsert
    if(!lastUpdated){
      fetch(SB+'/rest/v1/'+TABLE+'?on_conflict=id',{method:'POST',
        headers:Object.assign(hdr(),{Prefer:'resolution=merge-duplicates,return=representation'}),
        body:JSON.stringify([{id:'main',state:state,updated_at:ts}])})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ dirty=false; pRetry=0; if(rows&&rows[0]) lastUpdated=rows[0].updated_at; cacheSave(); setSync('ok','已儲低 '+nowT()); })
      .catch(function(){ setSync('err','離線，資料未同步'); setTimeout(persist,8000); });
      return;
    }
    // 之後每次都帶住「我讀到嘅版本」做條件，唔啱就唔覆蓋
    fetch(SB+'/rest/v1/'+TABLE+'?id=eq.main&updated_at=eq.'+encodeURIComponent(lastUpdated),
      {method:'PATCH', headers:Object.assign(hdr(),{Prefer:'return=representation'}),
       body:JSON.stringify({state:state, updated_at:ts})})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(rows){
      if(rows && rows[0]){ dirty=false; pRetry=0; lastUpdated=rows[0].updated_at; cacheSave(); setSync('ok','已儲低 '+nowT()); return; }
      // 0 row ＝ 其他裝置喺我讀完之後寫過 → 合併，唔可以覆蓋
      if(pRetry>=4){ setSync('err','同步衝突，撳一下狀態重試'); return; }
      pRetry++;
      setSync('','其他裝置有改動，合併緊…');
      fetchRow(function(row){
        if(!row){ setTimeout(persist,3000); return; }
        state=mergeStates(state, migrate(row.state||{}));
        lastUpdated=row.updated_at; cacheSave(); render();
        setTimeout(persist,150);
      });
    })
    .catch(function(){ setSync('err','離線，資料未同步'); setTimeout(persist,8000); });
  }
  function fetchRow(cb){
    var done=false,ctrl=null; try{ctrl=new AbortController();}catch(e){}
    var t=setTimeout(function(){ if(done)return; done=true; try{ctrl&&ctrl.abort();}catch(e){} cb(null,false); },12000);
    fetch(SB+'/rest/v1/'+TABLE+'?id=eq.main&select=state,updated_at',{headers:hdr(),signal:ctrl?ctrl.signal:undefined})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ if(done)return; done=true; clearTimeout(t); cb(rows&&rows[0]?rows[0]:null,true); })
      .catch(function(){ if(done)return; done=true; clearTimeout(t); cb(null,false); });
  }
  function boot(){
    if(!MODE){ showGate(''); return; }
    if(MODE==='local'){ var c=cacheLoad(); applyState(c&&c.state?c:{state:defState()}); setSync('ok','本機模式'); render(); return; }
    if(!state){ var c2=cacheLoad(); if(c2&&c2.state){ applyState(c2); render(); setSync('','上次嘅資料·更新緊…'); } else setSync('','載緊資料…'); }
    fetchRow(function(row,reached){
      if(!row){
        if(!reached){ if(!state){ applyState({state:defState()}); render(); } setSync('err','離線，資料未同步');
          if(rTimer) clearTimeout(rTimer); rTimer=setTimeout(boot,10000); return; }
        setSync('','第一次用，開緊…');
        fetch(SB+'/rest/v1/'+TABLE+'?on_conflict=id',{method:'POST',
          headers:Object.assign(hdr(),{Prefer:'resolution=merge-duplicates,return=representation'}),
          body:JSON.stringify([{id:'main',state:defState(),updated_at:new Date().toISOString()}])})
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(rows){ if(!rows||!rows[0]) throw 0; applyState(rows[0]); cacheSave(); setSync('ok','已同步'); render(); })
        .catch(function(){ try{localStorage.removeItem('tripKey');}catch(e){} KEY=''; MODE=''; showGate('暗號唔啱，再入一次'); });
        return;
      }
      applyState(row); cacheSave(); setSync('ok','已同步'); render();
    });
  }
  function refreshIfChanged(){
    if(!state||dirty||MODE!=='cloud'||!KEY) return;
    fetch(SB+'/rest/v1/'+TABLE+'?id=eq.main&select=updated_at',{headers:hdr()})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(rows){ if(rows&&rows[0]&&rows[0].updated_at!==lastUpdated)
        fetchRow(function(row){ if(row&&!dirty){ applyState(row); cacheSave(); render(); setSync('ok','已同步 '+nowT()); } }); })
      .catch(function(){ setSync('err','離線，資料未同步'); });
  }

  // ---------- gate ----------
  function mealKey(){ try{ return localStorage.getItem('mealKey')||''; }catch(e){ return ''; } }
  function showGate(msg){
    $('gate').className='gate show'; $('gateMsg').textContent=msg||'';
    var has=!!mealKey();
    $('gateReuse').className='btn acc'+(has?'':' hide');
    $('gateOr').className='hint'+(has?'':' hide');
    if(!has) setTimeout(function(){ try{$('gateKey').focus();}catch(e){} },50);
  }
  function enter(k){ KEY=k; MODE='cloud'; try{ localStorage.setItem('tripKey',k); localStorage.removeItem('tripLocal'); }catch(e){} $('gate').className='gate'; boot(); }
  $('gateGo').addEventListener('click',function(){ var k=($('gateKey').value||'').trim(); if(k) enter(k); });
  $('gateKey').addEventListener('keydown',function(e){ if(e.key==='Enter'){ var k=(e.target.value||'').trim(); if(k) enter(k); } });
  $('gateReuse').addEventListener('click',function(){ var k=mealKey(); if(k) enter(k); });
  $('gateLocal').addEventListener('click',function(){ MODE='local'; try{ localStorage.setItem('tripLocal','1'); }catch(e){} $('gate').className='gate'; boot(); });

  // ---------- model ----------
  function curTrip(){ var id=state&&state.settings.curTrip; if(!id) return null;
    for(var i=0;i<state.trips.length;i++) if(state.trips[i].id===id) return state.trips[i]; return null; }
  function tripById(id){ for(var i=0;i<state.trips.length;i++) if(state.trips[i].id===id) return state.trips[i]; return null; }
  function days(){ var t=curTrip(); if(!t||!t.start||!t.end) return [];
    var n=diffD(t.start,t.end); if(n<0||n>400) return [t.start];
    var a=[]; for(var i=0;i<=n;i++) a.push(shift(t.start,i)); return a; }
  function tItems(){ var t=curTrip(); if(!t) return []; return state.items.filter(function(x){return x.tripId===t.id;}); }
  function tLists(){ var t=curTrip(); if(!t) return []; return state.lists.filter(function(l){return l.tripId===t.id;}).sort(function(a,b){return (a.ord||0)-(b.ord||0);}); }
  function byOrd(a,b){
    var d=(a.ord||0)-(b.ord||0);
    if(d) return d;
    return String(a.time||'99:99')<String(b.time||'99:99')? -1 : 1;   // ord 打和就按時間
  }
  function dayItems(d){ return tItems().filter(function(x){return x.date===d;}).sort(byOrd); }
  function listItems(id){ return tItems().filter(function(x){return x.listId===id && !x.date;}).sort(byOrd); }
  function itemById(id){ for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) return state.items[i]; return null; }
  function nextOrd(arr){ var m=0; arr.forEach(function(x){ if((x.ord||0)>m) m=x.ord||0; }); return m+10; }
  function cur(){ var t=curTrip(); return (t&&t.cur)||'HKD'; }
  function money(n){ return cur()+' '+Math.round(+n||0).toLocaleString(); }
  function rates(){ var t=curTrip(); if(!t) return {}; if(!t.rates) t.rates={}; return t.rates; }
  function itemCcy(x){ return x.ccy || cur(); }
  // 換算去旅程主幣種。匯率係你自己喺旅程設定入面填（唔駁 API，離線都準）。
  function toHome(amt, ccy){
    amt=+amt||0; if(!ccy || ccy===cur()) return amt;
    var r=rates()[ccy]; return r? amt*(+r) : amt;
  }
  function fmtCcy(ccy, n){
    n=+n||0;
    var dp = (Math.abs(n)<100 && n%1!==0) ? 2 : 0;
    return ccy+' '+n.toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp});
  }
  function homeTotal(){ return tItems().reduce(function(a,x){ return a+toHome(x.cost, itemCcy(x)); },0); }
  function unknownCcys(){
    var out={}, h=cur();
    tItems().forEach(function(x){ var c=itemCcy(x); if(+x.cost>0 && c!==h && !rates()[c]) out[c]=1; });
    return Object.keys(out);
  }
  // ⚠️ sumCost 係「唔理貨幣嘅原始加總」，只可以用喺同一貨幣嘅情況。
  // 要顯示畀人睇嘅總額一律用 sumHome()。
  function sumCost(arr){ return arr.reduce(function(a,x){ return a+(+x.cost||0); },0); }
  function sumHome(arr){ return arr.reduce(function(a,x){ return a+toHome(x.cost, itemCcy(x)); },0); }
  function hav(a,b){
    var R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
    var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2*R*Math.asin(Math.sqrt(s));
  }
  function legTxt(a,b){
    if(a.lat==null||b.lat==null) return null;   // 唔可以用 !a.lat：lat 0（赤道）係 falsy
    var km=hav([a.lat,a.lng],[b.lat,b.lng])*1.3;
    if(km<0.06) return null;
    // 2026-09-15 修：舊版 ≥15km 畫火車 icon ＋ 用 65km/h 計。呢個係自駕 app，
    // 而呢個 fallback 正正喺山路冇訊號攞唔到 Routes 嗰陣出現 —— 即係最需要嗰刻講大話。
    // 一律當開車。速度分級，長途當上高速；寧可估慢，唔好令你以為趕得切。
    var mode=ic('car',15), kmh;
    if(km<2){ mode=ic('walk',15); kmh=4.5; }      // 兩公里內真係行路

    return { ic:mode, t:t+' \u00b7 '+(km<10?km.toFixed(1):Math.round(km))+' km' };
  }

  // ---------- 路線最優化（nearest-neighbour → 2-opt）----------
  function P(x){ return [x.lat,x.lng]; }
  function pathKm(seq){ var t=0; for(var i=1;i<seq.length;i++) t+=hav(P(seq[i-1]),P(seq[i])); return t; }
  function optimizeSeq(pts, fixStart){
    if(pts.length<3) return pts.slice();
    var rest=pts.slice(), order=[];
    order.push(fixStart? rest.shift() : rest.shift());
    var cur=order[0];
    while(rest.length){
      var bi=0,bd=Infinity;
      for(var i=0;i<rest.length;i++){ var d=hav(P(cur),P(rest[i])); if(d<bd){ bd=d; bi=i; } }
      cur=rest.splice(bi,1)[0]; order.push(cur);
    }
    var lo = fixStart?1:0, guard=0, improved=true;
    while(improved && guard<120){
      improved=false; guard++;
      for(var a=lo; a<order.length-1; a++){
        for(var b=a+1; b<order.length; b++){
          var prev=order[a-1], A=order[a], B=order[b], nxt=order[b+1];
          if(!prev) continue;
          var before=hav(P(prev),P(A)) + (nxt? hav(P(B),P(nxt)) : 0);
          var after =hav(P(prev),P(B)) + (nxt? hav(P(A),P(nxt)) : 0);
          if(after < before - 1e-9){
            var seg=order.slice(a,b+1).reverse();
            Array.prototype.splice.apply(order,[a,b+1-a].concat(seg));
            improved=true;
          }
        }
      }
    }
    return order;
  }
  function optimizeDay(d){
    var all=dayItems(d);
    var geo=all.filter(function(x){ return x.lat&&x.lng; });
    if(geo.length<3) return null;
    var seq=optimizeSeq(geo,true);
    var before=pathKm(geo), after=pathKm(seq);
    var same=seq.every(function(x,i){ return x.id===geo[i].id; });
    return {d:d, all:all, geo:geo, seq:seq, before:before, after:after, same:same};
  }
  function optimizeSheet(d){
    var r=optimizeDay(d);
    if(!r){ alert('呢日要至少 3 個有座標嘅地點先排到'); return; }
    // 🔴 呢幾個數係「直線距離」，唔係車程。實測北海道路里程／直線係 1.12×（石狩平原）
    // 到 2.08×（繞洞爺湖），所以舊版寫「行程總長 88 km」可能實際係 170 km。
    // 唔改個演算法（實測排錯序嘅代價細），但一定要標明呢個係直線數，
    // 同時把手上嘅真實車程一齊擺出嚟對照。
    var dr0=dayDrive(d);
    var realLine = dr0? ('<div class="hint" style="margin:8px 0 0">而家呢個次序嘅<b>實際車程</b>：'+
        minsTxt(dr0.sec)+' · '+(dr0.m/1000).toFixed(dr0.m<10000?1:0)+'km'+
        (dr0.real?'（Google 真路線）':'（估算）')+'</div>') : '';
    if(r.same){ openSheet('<h3>'+ic('route',19,'inline')+' 路線最優化</h3><div class="empty">而家嘅次序已經係最順<br>直線總長 '+r.before.toFixed(1)+' km，唔使改。</div>'+realLine); return; }
    var saved=r.before-r.after, pct=Math.round(saved/r.before*100);
    openSheet('<h3>'+ic('route',19,'inline')+' 路線最優化 · '+longD(d)+'</h3>'+
      '<div class="optbox"><div class="optrow"><span>而家（直線）</span><b class="num">'+r.before.toFixed(1)+' km</b></div>'+
      '<div class="optrow ok"><span>重排之後（直線）</span><b class="num">'+r.after.toFixed(1)+' km</b></div>'+
      '<div class="optsave">直線慳 '+saved.toFixed(1)+' km（'+pct+'%）</div></div>'+
      '<div class="hint" style="margin:8px 0 0">⚠ 呢三個數係<b>直線距離</b>，唔係車程。'+
      '北海道實際路里程係直線嘅 1.1–2.1 倍，繞湖／過山峠嗰段差得最遠。</div>'+realLine+
      '<div class="fld" style="margin-top:14px"><label>新次序</label><div class="optseq">'+
      r.seq.map(function(x,i){ return '<div><b>'+(i+1)+'</b> '+esc(x.name)+'</div>'; }).join('')+'</div></div>'+
      '<div class="hint">第一個地點固定做起點。冇座標嘅項目（航班、筆記）位置唔會郁。<b>時間會留喺原本嘅時段</b>（唔會跟住地點走）。</div>'+
      '<div class="btnrow"><button class="btn ghost" data-act="closesheet">唔要</button>'+
      '<button class="btn acc" data-act="applyopt" data-d="'+d+'">套用</button></div>');
  }
  function applyOpt(d){
    var r=optimizeDay(d); if(!r||r.same) return;
    snap();
    // 只換有座標嗰啲項目所佔嘅位，冇座標嘅（航班／筆記）原地不動
    var slots=[]; r.all.forEach(function(x,i){ if(x.lat&&x.lng) slots.push(i); });
    // 時間係釘住「時段」嘅，唔跟地點走。舊版搬 item 連 time 一齊搬，
    // 結果重排完可以由上到下變 16:00 → 11:00 → 09:00，而 byOrd 唔會發現。
    var times=r.all.map(function(x){ return x.time||''; });
    var out=r.all.slice();
    slots.forEach(function(pos,k){ out[pos]=r.seq[k]; });
    out.forEach(function(x,i){ x.ord=(i+1)*10; x.time=times[i]; });
    save(); closeSheet(); setSync('ok','路線重排咗，慳 '+(r.before-r.after).toFixed(1)+' km');
  }

  // ---------- 離線 ----------
  function setNet(){
    var off=!navigator.onLine, b=$('netbar');
    if(b) b.className='netbar'+(off?' show':'');
  }

  // ---------- 真路線（Google Routes，逐日 cache，簽名冇變就唔會再 call）----------
  // 你今朝由邊度出發？＝上一日最後一個有座標嘅項目（通常就係酒店）。
  // 唔計呢段，一個「新宿 → 箱根」嘅行車日會顯示成「車程 27 分鐘」，
  // 因為 app 只計咗箱根內部幾段。自駕行程一日最長嗰段通常就係呢段。
  function dayOrigin(d){
    var ds=days(), i=ds.indexOf(d);
    if(i<=0) return null;                       // 第一日冇「昨晚」
    for(var k=i-1;k>=0;k--){
      var prev=dayItems(ds[k]).filter(function(x){ return kd(x.kind).geo && x.lat!=null; });
      if(!prev.length) continue;
      // 你係喺住宿過夜，唔係喺當日最後去嗰個景點過夜。
      // 有住宿就用住宿（取最後一個，即係當晚 check in 嗰間）。
      var stays=prev.filter(function(x){ return x.kind==='stay'; });
      return stays.length? stays[stays.length-1] : prev[prev.length-1];
    }
    return null;
  }
  // 砌一個帶時區 offset 嘅 RFC3339 時刻，例如 '2026-12-01T09:00:00+09:00'
  function isoAt(ds, hm, tzMin){
    var q=String(hm||'09:00').split(':');
    var off = tzMin==null? 0 : tzMin, sg = off<0? '-' : '+', ao=Math.abs(off);
    return ds+'T'+pad(+q[0]||0)+':'+pad(+(q[1]||0))+':00'+sg+pad(Math.floor(ao/60))+':'+pad(ao%60);
  }
  function routeSig(pts){ return pts.map(function(p){ return p.lat.toFixed(4)+','+p.lng.toFixed(4); }).join('|'); }
  // 「由昨晚住嘅地方去今日第一站」嗰段
  function legFromPrev(d){
    var r=dayRoute(d);
    if(r && r.fromPrev && r.legs && r.legs[0]){
      var l=r.legs[0], mins=Math.max(1,Math.round(l.sec/60)), km=l.m/1000;
      return { name:r.fromPrev, t:minsTxt(l.sec)+' · '+(km<10?km.toFixed(1):Math.round(km))+' km', real:1 };
    }
    var org=dayOrigin(d);
    if(!org) return null;
    var first=dayItems(d).filter(function(x){ return kd(x.kind).geo && x.lat!=null; })[0];
    if(!first) return null;
    var e=legTxt(org, first);
    return e? { name:org.name, t:e.t, real:0 } : null;
  }
  function dayRoute(d){
    if(!state.routes) state.routes={};
    var t=curTrip(); if(!t) return null;
    return state.routes[t.id+'|'+d]||null;
  }
  function ensureRoute(d){
    if(GOOG===false || MODE!=='cloud') return;
    var t=curTrip(); if(!t) return;
    var own=dayItems(d).filter(function(x){ return kd(x.kind).geo && x.lat!=null && x.lng!=null; });
    var org=dayOrigin(d);
    var pts=own.map(function(x){ return {lat:x.lat,lng:x.lng}; });
    if(org) pts.unshift({lat:org.lat,lng:org.lng});
    if(pts.length<2) return;
    // 🔴 規劃期嘅路線本來唔計路況（TRAFFIC_UNAWARE），所以系統性低報。
    // 實測新宿→箱根：唔計路況 107 分鐘 / 97.7km，計路況 133 分鐘 / 113.9km
    // —— 差 26 分鐘，而且 Google 會揀另一條路。你撳「路線」跳去 Google Maps
    // 睇到嘅係計路況嘅數，所以兩邊對唔上。
    // 而家未來日期一律用 TRAFFIC_AWARE ＋ 當日出發時間做預測（Routes Pro SKU，
    // 每月 5,000 次免費；一日一個 call，用唔到一成）。過去日期冇得預測，照舊。
    var w0=wxGet(d);
    var tz0 = (w0&&w0.tz!=null)? w0.tz : (pts[0]? lngTz(pts[0].lng) : null);
    var firstT=(own.filter(function(x){ return x.time; })[0]||{}).time || '09:00';
    var dep=isoAt(d, firstT, tz0);
    var useTf = Date.parse(dep) > Date.now()+5*60000;
    var sig=routeSig(pts)+(org?'|o':'')+(useTf?'|t'+firstT:''), k=t.id+'|'+d;
    if(!state.routes) state.routes={};
    var cur2=state.routes[k];
    if(cur2 && cur2.sig===sig) return;
    if(routeBusy[k]) return;
    routeBusy[k]=1;
    gCall({op:'route',points:pts,mode:'DRIVE',
           traffic:useTf, departureTime:useTf? dep : undefined},function(j,err){
      delete routeBusy[k];
      if(err||!j||!j.legs){ return; }
      // totalSec／totalM 係 Google 計好一併回嚟嘅，舊版只存 legs 就掉咗佢哋。
      state.routes[k]={sig:sig, legs:j.legs, mode:j.mode,
                       totalSec:j.totalSec||0, totalM:j.totalM||0,
                       traffic:!!j.traffic, dep:useTf? dep : '',
                       fromPrev: org? org.name : '', at:Date.now()};
      save(true); render();
    });
  }
  var routeBusy={};
  function legReal(d, i){
    var r=dayRoute(d); if(!r||!r.legs) return null;
    var off = r.fromPrev? 1 : 0;                 // legs[0] 係「由昨晚住嘅地方出發」嗰段
    if(!r.legs[i+off]) return null;
    var l=r.legs[i+off], mins=Math.max(1,Math.round(l.sec/60)), km=l.m/1000;
    var t2 = mins>=60 ? Math.floor(mins/60)+' 小時'+(mins%60?' '+(mins%60)+' 分':'') : mins+' 分鐘';
    return { ic:ic('car',15), t:t2+' · '+(km<10?km.toFixed(1):Math.round(km))+' km', real:1 };
  }

  // ---------- render ----------
  function render(){
    if(!state) return;
    upBtns();
    var t=curTrip();
    if(!t){ $('main').innerHTML='<div class="page" style="padding-top:60px"><div class="panel pad"><div class="empty">仲未有旅程<br>開一個先</div><button class="btn acc" data-act="newtrip">＋ 開新旅程</button></div></div>';
            $('toc').innerHTML=''; drawMap(); return; }
    ensureList();
    if(MODE==='cloud') wxFetch();      // 自己有守衛，唔會每次 render 都打
    var h='<div class="page">';
    h+=hero(t);
    h+=twoUp();
    h+=exploreSec();
    h+=notesSec(t);
    tLists().forEach(function(l){ h+=listSec(l); });
    h+='<div style="margin:0 0 26px"><button class="tbtn" data-act="newlist">＋ 新清單</button></div>';
    h+=itinSec();
    h+=budgetSec();
    h+='</div>';
    $('main').innerHTML=h;
    $('toc').innerHTML=toc();
    var v=$('ver'); if(v) v.textContent='v '+APP_VER;
    drawMap();
  }
  // 封面：揀個有相、評分最高嘅地點做 hero；冇就用漸變
  function heroPhoto(){
    var t=curTrip(); if(!t) return '';
    if(t.cover) return t.cover;
    var cands=tItems().filter(function(x){ return x.photoUrl; });
    if(!cands.length) return '';
    cands.sort(function(a,b){ return (+b.rating||0)-(+a.rating||0); });
    return cands[0].photoUrl;
  }
  function hero(t){
    var it=tItems(), done=it.filter(function(x){return x.done;}).length, n=days().length;
    var ph=heroPhoto();
    return '<div class="hero'+(ph?' hasph':'')+'"'+

      (t.start? md(t.start)+'–'+md(t.end)+' · '+n+'日':'未定日期')+'</div>'+

      '<div><b class="num">'+it.length+'</b><span>項目</span></div>'+

      '<div><b class="num">'+it.filter(function(x){return !x.date;}).length+'</b><span>未排期</span></div>'+
      '<div><b class="num">'+Math.round(homeTotal()).toLocaleString()+'</b><span>'+esc(cur())+'</span></div>'+
      '</div></div>';

  function twoUp(){
    var counts={}; tItems().forEach(function(x){ counts[x.kind]=(counts[x.kind]||0)+1; });
    var order=['flight','stay','car','eat','place','buy','check'];
    var h='<div class="twoup"><div class="bkcard"><span class="cardlbl">快速加</span><div class="bkrow">';
    order.forEach(function(k){
      h+='<button data-act="addkind" data-k="'+k+'" title="加一個'+KINDS[k].n+'"><b>'+(counts[k]||'')+'</b><em>'+ic(KINDS[k].i,20)+'</em><span>'+KINDS[k].n+'</span></button>';
    });

    h+='<div class="sumcard"><span class="cardlbl">預算</span><div class="bigno">'+esc(fmtCcy(cur(),homeTotal()))+'</div>'+
       '<a data-act="go" data-s="s-bud">查看明細</a></div>';
    return h+'</div>';

  // ---------- 附件（Supabase Storage · trip-files · 同一個暗號閘）----------
  var BUCKET='trip-files', MAXMB=10;
  function stUrl(path){ return SB+'/storage/v1/object/'+BUCKET+'/'+path.split('/').map(encodeURIComponent).join('/'); }
  function stHdr(extra){ return Object.assign({apikey:SBK, Authorization:'Bearer '+SBK, 'x-client-info':KEY}, extra||{}); }
  function fmtSize(b){ b=+b||0; return b<1024?b+' B':(b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB'); }
  function fileIcon(t){ return String(t||'').indexOf('image')>=0 ? 'pin' : 'note'; }
  function uploadFile(x, file, cb){
    if(MODE!=='cloud'){ alert('要雲端模式先上載得到附件'); if(cb) cb(false); return; }
    if(file.size > MAXMB*1048576){ alert('\u300c'+file.name+'\u300d\u6709 '+fmtSize(file.size)+'\uff0c\u5927\u904e '+MAXMB+'MB \u4e0a\u9650'); if(cb) cb(false); return; }
    var safe=String(file.name||'file').replace(/[^\w.\-]+/g,'_').slice(-60);
    var path=curTrip().id+'/'+x.id+'/'+uid()+'-'+safe;
    setSync('','\u4e0a\u8f09 '+file.name+'\u2026');
    // Cache-Control: no-store 好重要 —— 唔加嘅話檔案用啱暗號讀過一次之後，
    // Supabase 個 CDN 會快取，期間知道路徑嘅人錯暗號都讀得到（實測過）。
    // 加咗之後錯暗號一律 404。
    fetch(stUrl(path), {method:'POST',
      headers:stHdr({'Content-Type':file.type||'application/octet-stream', 'Cache-Control':'no-store'}),
      body:file})
      .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+' '+t.slice(0,80)); }); return r.json(); })
      .then(function(){
        snap(); if(!x.files) x.files=[];
        x.files.push({p:path, n:file.name, s:file.size, t:file.type||'', at:Date.now()});
        save(); setSync('ok','\u4e0a\u8f09\u5b8c '+file.name); if(cb) cb(true);
      })
      .catch(function(e){ setSync('err','\u4e0a\u8f09\u5931\u6557\uff1a'+(e.message||'')); if(cb) cb(false); });
  }
  function openFile(f){
    // 先睇有冇離線副本（冇訊號都開得到）
    if(window.caches){
      caches.match(stUrl(f.p)).then(function(m){
        if(m) m.blob().then(function(b){ var u=URL.createObjectURL(b); window.open(u,'_blank'); setTimeout(function(){URL.revokeObjectURL(u);},60000); });
        else openFileNet(f);
      }).catch(function(){ openFileNet(f); });
      return;
    }
    openFileNet(f);
  }
  function openFileNet(f){
    if(!f) return;
    setSync('','\u958b\u7dca '+f.n+'\u2026');
    fetch(stUrl(f.p), {headers:stHdr()})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.blob(); })
      .then(function(b){
        var u=URL.createObjectURL(b.type? b : new Blob([b],{type:f.t||'application/octet-stream'}));
        window.open(u,'_blank','noopener');
        setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
        setSync('ok','');
      })
      .catch(function(e){ setSync('err','\u958b\u5514\u5230\uff1a'+(e.message||'')); });
  }
  function delFile(x, i){
    var f=(x.files||[])[i]; if(!f) return;
    if(!confirm('\u522a\u5497\u300c'+f.n+'\u300d\uff1f\u96f2\u7aef\u6a94\u6848\u6703\u6c38\u4e45\u79fb\u9664\u3002')) return;
    fetch(stUrl(f.p), {method:'DELETE', headers:stHdr()})
      .then(function(){ snap(); x.files.splice(i,1); save(); setSync('ok','\u522a\u5497 '+f.n); })
      .catch(function(){ setSync('err','\u522a\u5514\u5230'); });
  }
  function filesHTML(x, editable){
    var fs=x.files||[], h='<div class="files">';
    fs.forEach(function(f,i){
      h+='<div class="fitem"><span class="fic">'+ic(fileIcon(f.t),16)+'</span>'+
         '<button class="fn" data-act="openfile" data-id="'+x.id+'" data-i="'+i+'">'+esc(f.n)+'</button>'+
         '<span class="fsz">'+fmtSize(f.s)+'</span>'+
         (editable?'<button class="kebab" data-act="delfile" data-id="'+x.id+'" data-i="'+i+'" style="opacity:1">'+ic('x',14)+'</button>':'')+
         '</div>';
    });
    if(editable)
      h+='<label class="fadd">'+ic('plus',15)+' \u52a0\u9644\u4ef6\uff08\u6a5f\u7968\u3001\u78ba\u8a8d\u4fe1\u2026\u6700\u5927 '+MAXMB+'MB\uff09'+
         '<input type="file" multiple hidden data-act="pickfile" data-id="'+x.id+'"></label>';
    return h+'</div>';
  }

  // ---------- 探索：AI 推介 + Google 相／評分 ----------
  function exList(){ var t=curTrip(); if(!t) return null; return (state.explore||{})[t.id]||null; }
  function exploreSec(){
    var t=curTrip(); if(!t) return '';
    var ex=exList();
    var busy=!!exBusy;
    var h='<div class="sec" id="s-explore"><div class="sech">'+ic('chev',13,'chev')+'<h2>探索</h2>'+
      (ex&&ex.items?'<span class="n">'+ex.items.length+'</span>':'')+'<span class="sp"></span>'+
      '<button class="pill acc" data-act="explore"'+(busy?' disabled':'')+'>'+ic('spark',15,'inline')+' '+
      (busy?'搵緊…':(ex?'換一批':'搵下有咩好去'))+'</button></div>';
    if(!ex || !ex.items || !ex.items.length){
      h+='<div class="panel pad"><div class="empty">'+
         (busy?'<span class="spin"></span>AI 揀地方，再去 Google 攞相同評分…'
              :'叫 AI 照住「'+esc(t.dest||t.name)+'」推介，再由 Google 補相同評分')+'</div></div>';
      return h+'</div>';
    }
    h+='<div class="excards">';
    ex.items.forEach(function(r,i){
      var added=tItems().some(function(x){ return x.placeId? x.placeId===r.placeId : x.name===r.name; });
      h+='<div class="excard'+(added?' done':'')+'">'+
        '<div class="ph">'+(r.photoUrl?'<img src="'+esc(r.photoUrl)+'" alt="" loading="lazy">':'<div class="ld">'+ic(r.kind||'pin',20)+'</div>')+'</div>'+
        '<button class="add" data-act="exadd" data-i="'+i+'" title="'+(added?'已加':'加落想去')+'">'+ic(added?'check':'plus',16)+'</button>'+
        '<div class="bd"><div class="nm">'+esc(r.name)+'</div>'+
        (r.rating?'<div class="rt">'+ic('star',11)+(+r.rating).toFixed(1)+(r.ratingCount?' <span style="color:var(--muted);font-weight:600">('+(+r.ratingCount).toLocaleString()+')</span>':'')+'</div>':'')+
        (r.why?'<div class="wy">'+esc(r.why)+'</div>':'')+
        '</div></div>';
    });
    return h+'</div></div>';
  }
  var exBusy=false;
  function runExplore(){
    var t=curTrip(); if(!t || exBusy) return;
    if(MODE!=='cloud'){ alert('要雲端模式先用得 AI'); return; }
    exBusy=true; render();
    var have=tItems().map(function(x){ return x.name; }).join('、');
    var pr='你係旅程顧問。幫我推介「'+(t.dest||t.name)+'」值得去嘅地方。\n'+
      (have?'我已經有：'+have+'（唔好重複）\n':'')+
      (t.note?'我嘅筆記：'+String(t.note).slice(0,300)+'\n':'')+
      '要 10 個，混合景點、餐廳、住宿都可以。\n'+
      '【重要】只可以用你有信心真實存在嘅地方，用當地語言正式名。唔肯定就唔好寫。\n'+
      '只可以回覆 JSON，唔准有其他字：\n'+
      '{"stops":[{"name":"地點名（連城市）","cat":"place|eat|stay|buy","note":"一句：點解值得去"}]}';
    aiCall('plan', pr, function(txt, err){
      var arr=err?null:parseStops(txt);
      if(!arr || !arr.length){ exBusy=false; setSync('err','AI 推介唔到，再試一次'); render(); return; }
      if(!state.explore) state.explore={};
      state.explore[t.id]={ at:Date.now(), items:arr.slice(0,10).map(function(r){
        return { name:String(r.name||'').slice(0,80), why:String(r.note||'').slice(0,90),
                 kind:(KINDS[r.cat]?r.cat:'place') };
